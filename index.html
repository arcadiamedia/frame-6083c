function openMedia(m){
  if(m.k==='link'){window.open(m.u,'_blank','noopener');return}
  if(m.k==='file'){const a=el('a');a.href=m.d;a.download=m.n||'附件';document.body.appendChild(a);a.click();a.remove();return}
  const c=document.getElementById('lbC');c.textContent='';
  const e=document.createElement(m.k==='img'?'img':m.k==='vid'?'video':'audio');
  e.src=m.d;if(m.k==='img')e.alt=m.n||'照片';else{e.controls=true;e.autoplay=true}
  c.appendChild(e);document.getElementById('lbT').textContent=m.n||'';document.getElementById('lb').hidden=false;
  lbAt=performance.now();
}
/* 照片缩到最长边 1600 再存进文件，不然几张照片就把 HTML 撑到几十兆 */
function shrink(f){
  return new Promise((ok,no)=>{const u=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
function readURL(f){return new Promise((ok,no)=>{const r=new FileReader();
  r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
/* L：加到哪几条上（单选是它那一条，多选一起改的时候是勾着的那几条） */
async function addFiles(L,files){
  let n=0;
  for(const f of files){
    try{
      let d;
      if(/^image\/(jpeg|png|webp|bmp|heic|heif)$/.test(f.type)) d=await shrink(f);
      else{
        if(f.size>15e6){toast('「'+f.name+'」有 '+Math.round(f.size/1e6)+' MB，太大放不进文件；请传到网盘，再把网址写进说明里');continue}
        d=await readURL(f);
      }
      const m=normMedia({n:f.name,d});
      if(m){L.forEach(a=>a.media.push(m));n++}else toast('「'+f.name+'」这种文件放不进来');
    }catch(_){toast('「'+f.name+'」读不出来')}
  }
  if(n&&L.length>1)toast(n+' 个文件，加到了 '+L.length+' 条上');
  changed(true);
}
function pickFiles(L,acc){const f=document.getElementById('fMedia');f.accept=acc;f.value='';
  f.onchange=()=>addFiles(L,Array.from(f.files));f.click()}
/* 八个色点：cur 现在是哪个，pick(c) 点了哪个；lock 为真就只是看看、点不了 */
function colorDots(cur,pick,lock){
  const cr=el('div','cols'+(lock?' lock':''));
  COLORS.forEach((c,k)=>{const b=el('button','cdot'+(cur===c?' on':''));b.type='button';b.style.background=c;
    b.title=CNAME[k];b.setAttribute('aria-label','颜色：'+CNAME[k]);b.disabled=!!lock;b.onclick=()=>pick(c);cr.appendChild(b)});
  return cr;
}
/* ---------- 能改的每一项 ---------- */
/* 用户（2026-11-15 夜）：「点击开槽、尺寸等对象不要在屏幕中间弹出设置项，这些设置项放到清单里去。我需要批量修改
   功能：多选之后不只是能执行删除、隐藏这些操作，要能执行所有选择对象所有能修改的操作，比如改标题、说明、颜色、
   槽口的长宽深。哪怕某个对象的设置其他对象没有 —— 比如同时选择了开槽和标注，标注没有长宽高设置项 —— 那么修改
   只对有这些选项的对象生效。」
   F：能改的每一项。has(an) 这一条有没有这一项，get / set 读写；num 是数（min 最小多少）。
   右下角的设置里，单选一条的、多选之后「一起改」的，是同一个 editFor，都照这张表来：
   fGet 这几条在这一项上的值 —— 都一样就是它，不一样是 MIX，没有哪条有这一项是 undefined；
   fSet 把有这一项的那几条都改成 v，返回改了几条（没有这一项的不动；数不对一条都不改）。
   原先在模型上点中画上去的东西时旁边弹的那个小界面（#pop、markEditor）没有了，它里面的东西都在这儿 */
const MIX={};
function cutF(t,key,min,sh){return {num:1,min,has:a=>a.type===t&&!!pieceOf(a)&&(!sh||a.g.sh===sh),
  get:a=>a.g[key],set:(a,v)=>{a.g[key]=v;cutBox(a)}}}
const F={
  title:{has:()=>true,get:a=>a.title,set:(a,v)=>{a.title=String(v).replace(/\s+/g,' ').slice(0,60)}},
  text:{has:()=>true,get:a=>a.text,set:(a,v)=>{a.text=String(v)}},
  color:{has:()=>true,get:a=>a.color,set:(a,v)=>{a.color=v}},
  /* 槽：位置是做的时候点出来的（起点），能改的是长、宽、深 —— 改长度时起点不动 */
  nL:cutF('notch','L',1), nW:cutF('notch','W',1), nD:cutF('notch','Dp',1),
  /* 洞：圆的还是方的；圆的改直径，方的改长、宽；再就是它在木料上的位置（沿木料、横向） */
  hSh:{has:a=>a.type==='hole'&&!!pieceOf(a),get:a=>a.g.sh,set:(a,v)=>{a.g.sh=v==='r'?'r':'c';cutBox(a)}},
  hD:cutF('hole','d',1,'c'), hL:cutF('hole','L',1,'r'), hW:cutF('hole','W',1,'r'),
  hPos:cutF('hole','pos',0), hOff:cutF('hole','off',0),
  /* 尺寸：连续尺寸的读数写哪几样；手动放过的尺寸线拉出多远 */
  dShow:{has:a=>a.type==='dim'&&a.chain,get:a=>a.show,set:(a,v)=>{if(SHOWN.hasOwnProperty(v))a.show=v}},
  dOff:{num:1,has:a=>a.type==='dim'&&!!a.ov&&!!dimGeo(a,false),get:a=>a.off,set:(a,v)=>{a.off=Math.round(v)}},
};
function fHas(k,L){return L.filter(F[k].has)}
function fGet(k,L){const f=F[k], M=fHas(k,L); if(!M.length) return undefined;
  const v=f.get(M[0]);return M.every(a=>f.get(a)===v)?v:MIX}
function fSet(k,L,v){const f=F[k], M=fHas(k,L);
  if(f.num&&!(typeof v==='number'&&isFinite(v)&&(f.min==null||v>=f.min))) return 0;
  M.forEach(a=>f.set(a,v));return M.length}
/* 尺寸线换到另一侧（画得出来的那几条）；返回换了几条 */
function dimFlip(L){const M=L.filter(a=>a.type==='dim'&&dimGeo(a,false));
  M.forEach(a=>{if(a.off)a.off=-a.off;else if(a.ov)a.ov=a.ov.map(x=>-x||0);else a.flip=!a.flip});return M.length}
/* 把这几条（在模型上有位置的）的视角改成现在的画面；返回改了几条 */
function setViews(L){const M=L.filter(placed);M.forEach(a=>{a.view=getView()});return M.length}
/* 一个输入框管一项：这几条都一样就显示那个值，不一样就空着、写「各不相同」；没有哪条有这一项就点不了。
   _sync：这一项的值变了（撤销、改了别的项带着变），把框里的值跟上 —— 正在打字的那个框不动 */
function bindF(inp,k,L,ph){
  inp.classList.add('bk');
  inp._sync=()=>{const v=fGet(k,L);inp.disabled=v===undefined;
    inp.value=(v===MIX||v===undefined)?'':v;inp.placeholder=v===MIX?'各不相同':(ph||'')};
  inp._sync();return inp}
function syncF(){const ae=document.activeElement;
  document.querySelectorAll('#ed .bk').forEach(x=>{if(x!==ae&&x._sync)x._sync()})}
/* 这几条自己的颜色（L 一条或几条）。已完成的统一是浅灰、所在的群组指定了颜色就跟着群组：全都是这样的时候色点
   点不了，旁边写着为什么；只有其中几条是这样，照改，写明那几条暂时看不出。withDone：后面带「已完成」那个勾（单选时） */
function annColors(L,withDone){
  const cov=a=>{const q=grpOf(a);return a.done||!!(q&&q.color)}, k=L.filter(cov).length, an=L[0], g=grpOf(an),
        shown=a=>{const q=grpOf(a);return !a.done&&q&&q.color?q.color:a.color}, c0=shown(an),
        why=!k?'':k<L.length?'其中 '+k+' 条的颜色跟着群组或者已完成，改了暂时看不出'
           :L.every(a=>a.done)?'已完成的统一显示成浅灰':L.length>1?'这几条的颜色都跟着群组或者已完成'
           :'颜色跟着群组「'+g.name+'」',
        w=el('div'), cr=colorDots(L.every(a=>shown(a)===c0)?c0:'',c=>{fSet('color',L,c);changed(true)},k===L.length);
  if(withDone){const dl=el('label','dn'), dc=el('input');dc.type='checkbox';dc.checked=an.done;
    dc.onchange=()=>{an.done=dc.checked;changed(true)};dl.appendChild(dc);dl.appendChild(document.createTextNode('已完成'));
    cr.appendChild(dl)}
  w.appendChild(cr);if(why)w.appendChild(el('div','mini',why));return w;
}
/* 右下角设置里的那一块（renderEd 给它加上头）：单选一条的（L 就是它那一条），和多选之后的「一起改」（batch，L 是
   勾着的那几条）。从上到下：标题；各自的尺寸（槽口 / 开洞 / 尺寸，有哪种出哪种，一起改的时候各带一行小标题写着
   是几条）；说明（单选时下面列着说明里的网址）；上传文件（单选时下面是已经挂上的文件）；颜色；群组；视角、删除。
   一起改的时候，完成、隐藏、移到群组、删除在上面那排按钮里；「重新放置」「继续加点」要到模型上去点，只有一条的
   时候才有。
   多选着改东西，勾一直留着。用户（2026-11-16，第二十三版）：「现在多选，选择颜色后就会中止多选状态，改成操作不
   中止多选」—— 头一天深夜他说的是「改完就取消勾选，不要保持勾选」，用了一天改回来了。要不选了：处理栏右上角的
   ×、Esc、把勾一个个去掉，或者点清单里的一行（单选它） */
function editFor(L,batch){
  const e=el('div','anE'), an=L[0], row=()=>{const r=el('div','row');e.appendChild(r);return r},
        key=k=>(batch?'b':an.id)+':'+k, of=t=>L.filter(a=>a.type===t),
        sec=(name,M)=>{if(batch)e.appendChild(el('div','sec',name+' · '+M.length+' 条'))},
        grid=()=>{const g=el('div','fg');e.appendChild(g);return g},
        numF=(fg,lab,k,step)=>{const l=el('label',null,lab), inp=el('input');
          inp.type='number';inp.inputMode='decimal';inp.step=step||'1';if(F[k].min!=null)inp.min=F[k].min;
          bindF(inp,k,L);
          inp.oninput=()=>{if(fSet(k,L,parseFloat(inp.value)))changed(false,key(k))};
          inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();inp.blur()}};
          l.appendChild(inp);fg.appendChild(l)},
        pick=(k,opts)=>{const r=row(), cur=fGet(k,L);
          opts.forEach(o=>{const b=el('button',cur===o[0]?'on':'',o[1]);b.type='button';b.disabled=cur===undefined;
            b.onclick=()=>{if(fSet(k,L,o[0]))changed(true)};r.appendChild(b)})},
        lost=(M,one,many)=>{if(M.length)e.appendChild(el('div','issue',batch?'其中 '+M.length+' 条'+many:one))};
  /* 标题：起了名字才在模型上显示；清空了就还它一个「无标题 N」 */
  const tl=el('label','fld','标题'), ti=el('input');ti.type='text';ti.maxLength=60;
  bindF(ti,'title',L,'起了名字才在模型上显示');
  ti.oninput=()=>{fSet('title',L,ti.value);changed(false,key('title'))};
  ti.onblur=()=>{let ch=false;L.forEach(a=>{const t=a.title.trim();if(!t||t!==a.title){a.title=t;ch=true}});
    if(!ch) return;nameAll();ti._sync();changed(false,key('title'))};
  ti.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();ti.blur()}};
  tl.appendChild(ti);e.appendChild(tl);
  /* 各自的尺寸 */
  const N=of('notch'), H=of('hole'), Dm=of('dim'), gone=M=>M.filter(a=>!pieceOf(a));
  if(N.length){sec('槽口',N);const fg=grid();numF(fg,'长','nL');numF(fg,'宽','nW');numF(fg,'深','nD');
    lost(gone(N),'原来那根木料找不到了：位置按保存时的画，尺寸改不了。','原来的木料找不到了，尺寸改不了。')}
  if(H.length){sec('开洞',H);pick('hSh',[['c','圆洞'],['r','方洞']]);
    const fg=grid(), rd=H.some(a=>a.g.sh==='c'), sq=H.some(a=>a.g.sh==='r'), both=rd&&sq,
          ax=H.every(a=>a.g.ax===H[0].g.ax), wa=H.every(a=>a.g.wa===H[0].g.wa);
    if(rd)numF(fg,both?'直径（圆洞）':'直径','hD');
    if(sq){numF(fg,both?'长（方洞）':'长（沿木料）','hL');numF(fg,both?'宽（方洞）':'宽','hW')}
    numF(fg,ax?AXN[H[0].g.ax]:'位置（沿木料）','hPos');numF(fg,wa?AXW[H[0].g.wa]:'位置（横向）','hOff');
    lost(gone(H),'原来那根木料找不到了：位置按保存时的画，尺寸改不了。','原来的木料找不到了，尺寸改不了。')}
  if(Dm.length){sec('尺寸',Dm);
    const Ch=Dm.filter(a=>a.chain), Dg=Dm.filter(a=>dimGeo(a,false));
    if(Ch.length){                               // 连续尺寸：读数写哪几样（相对 / 绝对 / 两样都写）
      if(batch&&Ch.length<Dm.length)e.appendChild(el('div','mini','读数怎么写（其中连续尺寸 '+Ch.length+' 条）'));
      pick('dShow',['r','a','ar'].map(k=>[k,SHOWN[k]]))}
    if(Dg.length){

         （前几版留下来没放过的，重新放一次就归用户管了） */
      const fg=grid(), l2=el('div','lab'), two=el('div','two'), fb=el('button',null,'换一侧');
      if(Dg.some(a=>a.ov))numF(fg,'拉出（mm）','dOff','50');
      l2.appendChild(el('span',null,!batch&&!an.ov?'尺寸线（老版本自动摆的）':'尺寸线'));
      if(!batch){const rb=el('button',null,'重新放置');rb.type='button';
        rb.onclick=()=>startTool(an.chain?'dimc':'dim1',an,true);two.appendChild(rb)}
      fb.type='button';fb.onclick=()=>{if(dimFlip(L))changed(true)};two.appendChild(fb);l2.appendChild(two);fg.appendChild(l2);
      if(!batch&&an.chain){const ad=el('button',null,'继续加点');ad.type='button';ad.onclick=()=>startTool('dimc',an);row().appendChild(ad)}
    }
    lost(Dm.filter(a=>!dimGeo(a,false)),'原来那块板找不到了：这条尺寸画不出来。','原来的板找不到了，画不出来。')}
  /* 说明：写了才有模型上那个 i。说明里的网址在下面列出来，点了新开一页（单选时） */
  const dl=el('label','fld','说明'), ta=el('textarea');
  bindF(ta,'text',L,PH.note);ta.oninput=()=>{fSet('text',L,ta.value);changed(false,key('text'))};
  dl.appendChild(ta);e.appendChild(dl);
  if(!batch){const lk=el('div','anL');lk.classList.add('bk');
    lk._sync=()=>{const ls=linksOf(an.text);lk.textContent='';lk.hidden=!ls.length;ls.forEach(q=>lk.appendChild(linkEl(q)))};
    lk._sync();e.appendChild(lk)}
  /* 上传文件：照片、PDF、视频、图纸……要传就传，不传就算了（网址直接写在说明里）。一起改的时候每一条都加上 */
  if(!batch){const m=el('div','anM');e.appendChild(m);fillMedia(A.indexOf(an),m,true)}     // 单选：已经挂上的文件
  const fr=batch?row():null, ub=el('button',null,'上传文件');ub.type='button';
  ub.title='照片、PDF、视频、图纸……什么文件都行；照片会缩小了再存'+(batch?'。勾着的每一条都加上':'');
  ub.onclick=()=>pickFiles(L,'');if(fr)fr.appendChild(ub);
  e.appendChild(annColors(L,!batch));
  if(!batch&&G.length){const gl=el('label','fld gi','群组'), sl=el('select');sl.setAttribute('aria-label','群组');

    sl.value=grpOf(an)?an.grp:'';sl.onchange=()=>{an.grp=sl.value;changed(true)};
    gl.appendChild(sl);e.appendChild(gl)}
  /* 最底下一行：上传文件、视角（在模型上有位置的才有）、删除。一起改的时候只有「上传文件」「更新视角」，在说明下面 */
  const P=L.filter(placed), vr=fr||row();
  if(!batch)vr.appendChild(ub);
  if(!batch&&P.length){const g1=el('button',null,'回到视角');g1.type='button';
    g1.title='回到做它时的视角（动态视角关着也回得去）';
    g1.onclick=()=>{an.view?applyView(an.view,an):focusOn(an)};vr.appendChild(g1)}
  if(P.length){const g2=el('button',null,'更新视角');g2.type='button';
    g2.title=batch?'把这几条的视角都改成现在的画面':'把这一条的视角改成现在的画面';
    g2.onclick=()=>{const n=setViews(L);changed(batch);toast(batch?n+' 条的视角已改成现在的画面':'这一条的视角已改成现在的画面')};
    vr.appendChild(g2)}
  if(!batch){const g3=el('button','del','删除');g3.type='button';g3.title='点了就删（选着它按 Delete 键也行）；删错了按撤销（Ctrl+Z）';
    g3.onclick=()=>delOne(an);vr.appendChild(g3)}
  return e;
}
/* 删掉一条（单选着的那条：设置里的「删除」、Delete 键）。点了就删，删错了按撤销 */
function delOne(an){const i=A.indexOf(an);if(i<0) return;A.splice(i,1);sel=-1;changed(true)}
/* ---------- 清单：照待办清单的样子 ---------- */
/* 从上到下：没分组的卡片 → 一个个群组（一行组头，下面是它的卡片）→ 已完成（标了完成的都归到这儿，
   不管原来在哪一组；取消完成就回原来的组）。
   一条一行：左边一个方格（多选）、一个色点、标题、是什么、右边一只眼睛（隐藏）；
   点它 = 选中它（右下角出它的设置）、镜头转过去，再点一下不选了；按着 Ctrl 点 = 多选，按着 Shift 点 = 连选。
   能拖：拖到另一行上排序，拖到组头上换组；组头也能拖，给群组排先后（手机上换组在设置的「群组」里选，排序到电脑上做）。
   群组和「已完成」下面的事项往里缩一格。
   组头：折叠箭头、颜色、名字、条数、眼睛、铅笔（改名、换颜色、删除群组）。
   折叠只是清单的样子：存下来，不算一步撤销。 */
let gEdit='', gFocus=false;            // 正开着编辑区的那个群组；刚新建的，名字框要拿到焦点
/* 用户（2026-11-15 晚）：「方格为多选，不是直接标记为已完成，同时需要有全部选中当前组所有清单的功能，选择后可以
   统一处理，处理方式包括但不限于：标记为完成、隐藏、移动到其他组别、删除」；（当天夜里）「多选之后不只是能执行
   删除、隐藏这些操作，要能执行所有选择对象所有能修改的操作」；（深夜）「改完就取消勾选，不要保持勾选」「多选也是
   在这里（模型右下角）弹出设置」「模型里可以按住 Ctrl 多选那些对象」。
   SEL（声明在前面）：勾着的那几条 —— 清单里的方格、模型上按着 Ctrl 点，是同一份。勾着东西的时候不单选谁
   （sel = -1），反过来单选一条，勾着的就都去掉。
   每个组头上一个方格 = 全选 / 全不选这一组（选了一部分是半勾）。勾着东西的时候，右下角的设置（renderEd）里是：
   一排按钮 —— 标记完成 / 取消完成、隐藏 / 显示、删除、移到群组（含不分组、新建群组）；下面「一起改」——
   和单选一条时是同一套（editFor），每一项只改有它的那几条。一次处理 = 一步撤销。做完勾还留着（第二十三版起：

function newGroup(){const g={id:nid(),name:freeName('群组',G.map(x=>x.name)),color:'',hidden:false,fold:false};G.push(g);return g}
/* 勾着的那几条（顺手把已经不在了的清掉） */
function selList(){const have=new Set(A.map(a=>a.id));SEL.forEach(id=>{if(!have.has(id))SEL.delete(id)});return A.filter(a=>SEL.has(a.id))}
/* 把勾着的那几条一起处理，算一步；勾还留着（删掉的除外）。what：

   'move' 移到群组 arg（'' = 不分组，'+' = 新建一个再移进去）—— 移过去的不再算已完成（从「已完成」那一组挪出来了）。
   一项一项改（标题、颜色、长宽深……）走 fSet，见 editFor */

/* ---------- 清单里的行：拖着排序、拖着换组 ---------- */

   上半截 = 排到它前面，下半截 = 排到它后面（那一侧画一条金线）；拖到别的组里的行上，连组一起换（拖到已完成的行上
   = 标成已完成，原来的组还记着）。拖到组头上还是老样子：只换组，先后不动。
   勾着几条、拖的是其中一条：勾着的一起走，相互的先后不变。一次拖动 = 一步撤销。只读时拖不了；手机上没有这个
   （触屏上网页里的拖放靠不住，排序到电脑上做）。

/* ---------- 群组拖着排序 ----------

   前面、「已完成」永远在最后，拖到那儿不算。一次 = 一步撤销。只读时拖不了；手机上没有（触屏上网页里的拖放靠不住）。
   拖群组时事件冒到清单（#annList）上统一处理；事项那一行、组头上「拖事项进组」的处理见了 dragG 就让开。 */
let dragG='';

function gAim(ev){

function gMark(a){dropMark(null);if(a)a.els[a.after?a.els.length-1:0].classList.add(a.after?'dropB':'dropA')}

  {const z=zone();free.forEach(i=>card(i,z))}

/* 带标注的整页源码：把 SRC 里那块标注数据换成现在的。ro：存成只读的一份（本来就是只读的一份，再存还是只读）。< 写成 <，数据里就不会

function htmlWith(ro){

  if(ro||LOCK)o.ro=1;                                    // 只读的一份：打开就是只读，那把锁点不开
  const j=JSON.stringify(o).replace(/</g,'\\u003c');
  const m=/(<script[^>]*id="ann0"[^>]*>)[\s\S]*?(<\/script>)/.exec(SRC);
  return SRC.slice(0,m.index)+m[1]+j+m[2]+SRC.slice(m.index+m[0].length);

/* 把一段字放进剪贴板：行了 ok()，不行 fail() */

    document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(_){}

/* 用户（2026-11-15，第二十版）：「分享的时候有两个选项：一个是可编辑，另一个是不可编辑。」点「分享」展开两行，一行一种：
   · 链接（这一页是从网上打开的才有）：网址，只读的带着 ?view=1。对方看到的是网上那一份 —— 这台设备上改过、
     还没传上去的东西不在里面，复制的时候说一声；
   · 文件：带着这台设备上现在的标注的一份 HTML，只读的里面记着 ro。手机上直接调起系统的分享，电脑上存到「下载」。
   本来就是只读的一份（LOCK）只能再分享只读的。 */

function webPage(){try{return /^https?:$/.test(location.protocol)}catch(_){return false}}

/* 清单的文字版：和清单一样只有起了名字的，一个顺序 —— 没分组的、一个个群组、已处理。一条一行：标题【是什么】在哪；多大；说明；文件 */
function listText(){
  const line=an=>'· '+an.title+'【'+tname(an)+'】'+
    [where(an),sub(an),an.text.replace(/\s*\n\s*/g,' ').trim(),
     an.media.length?'文件：'+an.media.map(m=>m.n||'未命名').join('、'):''].filter(Boolean).join('；')+
    (an.done?'（已完成）':'');
  const L=A.filter(inList), open=L.filter(a=>!a.done), dn=L.filter(a=>a.done);
  let s=(D.job?D.job+' ':'')+'框架模型事项（共 '+L.length+' 条）';
  open.filter(a=>!grpOf(a)).forEach(a=>{s+='\n'+line(a)});
  G.forEach(g=>{const m=open.filter(a=>a.grp===g.id); if(!m.length) return;
    s+='\n【'+g.name+'】';m.forEach(a=>{s+='\n'+line(a)})});
  if(dn.length){s+='\n【已完成】';dn.forEach(a=>{s+='\n'+line(a)})}
  return s;
}
function importText(s){
  if(RO) return;
  let o=null;
  try{const m=/<script[^>]*id="ann0"[^>]*>([\s\S]*?)<\/script>/.exec(s);o=JSON.parse(m?m[1]:s)}catch(_){}
  const items=Array.isArray(o)?o:(o&&o.items);
  if(!Array.isArray(items)){toast('这个文件里没有找到事项');return}
  const have=new Set(A.map(a=>a.id)), used=new Set(A.map(a=>a.title));let n=0, ng=0, nv=0;
  /* 文件里的群组、视角一起带进来（已经有的不重复加） */
  const hg=new Set(G.map(g=>g.id)), hv=new Set(VW.map(v=>v.id));
  (o&&Array.isArray(o.groups)?o.groups:[]).map(normGroup).forEach(g=>{if(g&&!hg.has(g.id)){G.push(g);hg.add(g.id);ng++}});
  (o&&Array.isArray(o.views)?o.views:[]).map(normView).forEach(v=>{if(v&&!hv.has(v.id)){VW.push(v);hv.add(v.id);nv++}});
  items.forEach(x=>normAll(x).forEach(an=>{if(!have.has(an.id)){relink(an);
    if(untitled(an)&&used.has(an.title))an.title='';            // 还叫「无标题 N」又和现有的重名：重新排一个
    A.push(an);have.add(an.id);n++}}));
  nameAll();
  if(n||ng||nv){changed(true);if(nv)renderViews()}
  const other=o&&o.job&&D.job&&o.job!==D.job;
  toast(n||ng||nv?'导入了 '+n+' 条事项'+(ng?'、'+ng+' 个群组':'')+(nv?'、'+nv+' 个视角':'')+
          (other?'。注意：这份事项是 '+o.job+' 的，和当前模型不是同一个工程，位置可能对不上':'')
         :'没有新的事项（文件里的都已经在了）');
}
