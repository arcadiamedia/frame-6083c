<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6083C</title>
<style>
:root{
  --bg:#12100c; --panel:#1c1a15; --line:#332f26; --fg:#ece7dc; --dim:#9a9284;
  --acc:#d9a441; --ok:#5fa86e; --bad:#c9614f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
#gl{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl.drag{cursor:grabbing}
/* 标注的序号、尺寸线画在这张叠在上面的画布上；它不接鼠标，事件都落到 #gl */
#ov{position:fixed;inset:0;display:block;pointer-events:none}
.pane{position:fixed;background:color-mix(in srgb,var(--panel) 92%,transparent);
  border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
#side{top:12px;left:12px;width:250px;max-height:calc(100vh - 24px);overflow:auto;padding:12px}
/* 右上一列：标注面板在上（常驻），构件信息框在下（点了木料才出现）。
   手机上这一列不存在（display:contents），两块各自定位 */
#rcol{position:fixed;top:12px;right:12px;width:292px;max-height:calc(100vh - 24px);
  max-height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
#rcol>.pane{position:relative;pointer-events:auto}
#info{padding:12px;display:none;flex:none}
/* 信息框右上角的关闭按钮：点空白处也能关，但手机上空白少、初次用也不知道。
   按钮在信息框上、不在画布上，点它不会触发拾取。内容区 #infoBody 自己滚动，
   内容长时按钮不跟着滚走 */
#infoX{position:absolute;top:8px;right:8px;width:28px;height:28px;min-width:0;flex:none;
  padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border-color:transparent;color:var(--fg)}
#infoX svg{width:18px;height:18px}
#infoX:active{background:#26231c;color:var(--acc)}
#info h1{padding-right:26px}
#infoBody{max-height:46vh;overflow:auto}
#hud{bottom:12px;left:12px;padding:8px 12px;color:var(--dim);font-size:12px;
  max-width:calc(100vw - 328px)}         /* 不伸到右上那一列底下 */
h1{margin:0 0 2px;font-size:14px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:11px;margin-bottom:10px}
h2{margin:14px 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
  font-weight:600}
label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;font-size:12px}
@media (hover:hover){label:hover{color:var(--acc)}}
input[type=checkbox]{accent-color:var(--acc);margin:0}
.sw{width:11px;height:11px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button{flex:1;min-width:52px;background:#26231c;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 6px;font:inherit;font-size:11px;cursor:pointer}
@media (hover:hover){button:hover{border-color:var(--acc);color:var(--acc)}
  #infoX:hover{background:#26231c;color:var(--acc)}}
button.on{background:var(--acc);color:#1a1509;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:2px 0;vertical-align:top}
td:first-child{color:var(--dim);padding-right:8px;white-space:nowrap}
.issue{color:var(--bad);font-size:11px;margin-top:6px;line-height:1.45}
.pill{font-size:10px;padding:1px 6px;border-radius:20px;background:#2a2620;color:var(--dim)}
.pill.ok{background:#20301f;color:var(--ok)} .pill.bad{background:#33201c;color:var(--bad)}
.mini{color:var(--dim);font-size:11px}
/* ---------- 标注 ---------- */
#ann{padding:12px;display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
#annHead{display:flex;align-items:center;gap:8px;cursor:pointer}
#annHead h1{flex:1;margin:0}
#annFold{width:18px;height:18px;flex:none;color:var(--dim);transition:transform .15s}
#ann.fold #annFold{transform:rotate(-90deg)}
#ann.fold #annBody{display:none}
#annBody{display:flex;flex-direction:column;min-height:0;margin-top:4px}
#annList{overflow:auto;min-height:0;margin-top:10px}
#annState{margin-top:8px;line-height:1.5}
#annState:empty{display:none}
.an{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#201d17}
.an.sel{border-color:var(--acc)}
.anH{display:flex;gap:8px;padding:7px 8px;cursor:pointer;align-items:flex-start}
.num{flex:none;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.anT{min-width:0;flex:1}
.t1{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an.sel .t1{white-space:normal;overflow-wrap:anywhere}
.an.done .t1{text-decoration:line-through;color:var(--dim)}
.t2:empty{display:none}
.anM{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 8px 36px}
.anM:empty{display:none}
.th{position:relative;width:48px;height:48px;border-radius:6px;border:1px solid var(--line);
  cursor:pointer;background:#000;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 9px;border-radius:14px;
  border:1px solid var(--line);background:#26231c;font-size:11px;cursor:pointer}
.chip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{flex:none;width:18px;height:18px;min-width:0;padding:0;border-radius:50%;font-size:12px;line-height:1}
.th .mx{position:absolute;top:-7px;right:-7px}
.anE{padding:0 8px 8px;border-top:1px solid var(--line)}
textarea,.anE input[type=number],.lk input{width:100%;background:#15130f;color:var(--fg);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px}
textarea{display:block;min-height:54px;resize:vertical;margin-top:8px}
textarea:focus,.anE input:focus{outline:none;border-color:var(--acc)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.fg label,.fg .lab{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0;font-size:11px;
  color:var(--dim);cursor:default}
.fg .two{display:flex;gap:6px}
.cols{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}
/* 八个色点：平时一圈细边（黑色那个在深色面板上也认得出），选中的外面套一个白环 */
.cdot{width:20px;height:20px;min-width:0;flex:none;padding:0;border-radius:50%;border:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.cdot.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #fff}
/* 连续尺寸各点的读数表 */
.dtw{max-height:168px;overflow:auto;margin-top:6px}
.dt th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;padding:2px 0}
.dt td{vertical-align:middle;font-size:11px;font-variant-numeric:tabular-nums}
.dt td:last-child{width:24px;text-align:right}
.dt .mx{display:inline-flex;align-items:center;justify-content:center}
/* 撤销 / 重做（标注面板标题行里） */
button.ic{flex:none;min-width:0;width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center}
button.ic svg{width:15px;height:15px}
button.go{border-color:var(--acc);color:var(--acc)}
/* 放标注时的提示条：一排选项，放不下就换行 */
#hud.tool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--fg);
  left:274px;min-width:300px;max-width:calc(100vw - 590px)}       /* 夹在左边侧栏和右上那一列之间 */
#hud.tool .br{flex-basis:100%;height:0}
#hud.tool .tip{color:var(--dim)}
#hud.tool button.inl{margin-left:0}
#hud.tool input.len{width:76px;background:#15130f;color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:2px 6px;font:inherit;font-size:12px}
#hud.tool input.len:focus{outline:none;border-color:var(--acc)}
.cols .dn{margin-left:auto}
.lk{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lk[hidden]{display:none}
.lk button{flex:none}
button.del{color:var(--bad)}
button.inl{flex:none;min-width:0;padding:2px 8px;margin-left:6px}
button:disabled,input:disabled{opacity:.5;cursor:default}
#tog2{display:none}
#tog2n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--acc);color:#1a1509;font-size:10px;font-weight:700;line-height:18px;text-align:center}
#cap .capH{display:flex;align-items:center;gap:8px}
#capT{flex:1;min-width:0;font-size:13px;font-weight:600}
#capC{flex:none;min-width:0;width:36px;height:36px;padding:0;display:flex;align-items:center;
  justify-content:center;background:transparent;border-color:transparent;color:var(--fg)}
#capC svg{width:20px;height:20px}
#capS{margin:2px 0 0 28px}
#capS:empty,#capX:empty{display:none}
#capX{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
#capM{padding:8px 0 0}
#cap .row{align-items:center}
#capI{flex:none;padding:0 4px}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lbC img,#lbC video{max-width:100%;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);display:block}
#lbT{color:var(--fg);font-size:12px}
#lbX{position:absolute;top:10px;right:10px;width:44px;height:44px;min-width:0;flex:none;padding:0;
  display:flex;align-items:center;justify-content:center}
#lbX svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:30;display:none;
  max-width:min(440px,calc(100vw - 32px));background:#2a2620;color:var(--fg);border:1px solid var(--acc);
  border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5}
/* 手机（窄屏，或触屏为主的设备）：侧栏默认收起，左上角按钮展开/收起；
   勾选行、按钮加大，手指好点 */
#tog{display:none}
#tog .i-x{display:none}
body.side-open #tog .i-menu{display:none}
body.side-open #tog .i-x{display:inline}
@media (max-width:760px),(pointer:coarse){
  #tog{display:flex;align-items:center;justify-content:center;top:12px;left:12px;z-index:3;
    width:44px;height:44px;min-width:0;flex:none;padding:0}
  #side{display:none;top:64px;width:min(260px,calc(100vw - 24px));
    max-height:calc(100vh - 76px);max-height:calc(100dvh - 76px);z-index:2}
  body.side-open #side{display:block}
  /* 右上那一列拆开：信息框回到右上角；标注面板变成左边的抽屉，
     由左上第二个按钮开关（两个抽屉同时只开一个） */
  #rcol{display:contents}
  #rcol>.pane{position:fixed}
  #info{top:12px;right:12px;width:min(262px,calc(100vw - 132px))}
  #infoBody{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)}
  #tog2{display:flex;align-items:center;justify-content:center;top:12px;left:64px;z-index:3;
    width:44px;height:44px;min-width:0;flex:none;padding:0}
  #ann{display:none;top:64px;left:12px;width:min(320px,calc(100vw - 24px));
    max-height:calc(100vh - 76px);max-height:calc(100dvh - 76px);z-index:2}
  body.ann-open #ann{display:flex}
  #ann.fold #annBody{display:flex}
  #annHead{cursor:default}
  #annFold{display:none}
  #cap{left:12px;right:12px;bottom:12px;z-index:1;padding:10px 12px;max-height:46vh;overflow:auto}
  body.has-cap #hud{display:none}
  textarea,.anE input[type=number],.lk input{font-size:16px}
  .cdot{width:26px;height:26px}
  .cols{gap:7px}             /* 八个色点排一行（列表出了滚动条也够） */
  button.ic{width:40px;height:40px}
  button.ic svg{width:20px;height:20px}
  .mx{width:26px;height:26px;font-size:14px}
  .th .mx{top:-10px;right:-10px}
  button.inl{padding:6px 12px}
  #infoX{top:0;right:0;width:44px;height:44px}
  #infoX svg{width:22px;height:22px}
  #info h1{padding-right:34px}
  #hud{right:12px;padding:6px 10px;font-size:11px;max-width:none}
  #hud.tool{left:12px;min-width:0;max-width:none}
  #hud.tool input.len{width:96px;font-size:16px;padding:5px 8px}      /* 小于 16px 的输入框，iOS 一点就把整页放大 */
  label{padding:5px 0;font-size:13px}
  input[type=checkbox]{width:16px;height:16px}
  button{padding:8px 6px;font-size:12px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#39342a;border-radius:4px}
</style></head><body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<button class="pane" id="tog" type="button" aria-label="显示/隐藏侧栏" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path class="i-menu" d="M4 7h16M4 12h16M4 17h16"/><path class="i-x" d="M6 6l12 12M18 6L6 18"/></svg></button>
<button class="pane" id="tog2" type="button" aria-label="显示/隐藏标注" aria-controls="ann" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 4 2.5 4H6"/></svg><span id="tog2n" hidden></span></button>

<div class="pane" id="side">
  <h1>6083C</h1>
  <div class="sub" id="sub"></div>

  <h2>视图</h2>
  <div class="row">
    <button data-view="iso">轴测</button><button data-view="top">俯视</button>
    <button data-view="front">正视</button><button data-view="side">侧视</button>
  </div>
  <div class="row">
    <button id="bWire">线框</button><button id="bEdge" class="on">边线</button><button id="bProj" class="on">正交</button><button id="bFit">全览</button>
  </div>

  <h2>楼层</h2><div id="lvs"></div>
  <h2>构件类型</h2><div id="kds"></div>

  <h2>爆炸 <span class="mini" id="expv">0</span></h2>
  <input type="range" id="exp" min="0" max="100" value="0">
  <h2>剖切高度 <span class="mini" id="clipv">全部</span></h2>
  <input type="range" id="clip" min="0" max="100" value="100">
</div>

<div id="rcol">
<div class="pane" id="ann">
  <div id="annHead" role="button" tabindex="0" aria-expanded="true" aria-controls="annBody"><h1>标注 <span class="mini" id="annN"></span></h1><button id="bUndo" class="ic" type="button" title="撤销（Ctrl+Z）" aria-label="撤销" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button><button id="bRedo" class="ic" type="button" title="重做（Ctrl+Shift+Z）" aria-label="重做" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button><svg id="annFold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
  <div id="annBody">
    <div class="row">
      <button data-tool="hl">高亮构件</button><button data-tool="notch">槽口</button><button data-tool="hole">开洞</button>
    </div>
    <div class="row">
      <button data-tool="dim1">单次测量</button><button data-tool="dimc">连续测量</button>
    </div>
    <div class="row">
      <button data-tool="note">文字</button><button data-tool="doc">资料</button>
    </div>
    <div id="annList"></div>
    <div class="row">
      <button id="bSave">保存 HTML</button><button id="bShare" hidden>分享</button><button id="bCopy">复制清单</button>
    </div>
    <div class="row">
      <button id="bExp">导出标注</button><button id="bImp">导入标注</button>
    </div>
    <div class="mini" id="annState"></div>
  </div>
</div>
<div class="pane" id="info"><button id="infoX" type="button" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="infoBody"></div></div>
</div>
<div class="pane" id="hud"></div>
<div class="pane" id="cap" hidden>
  <div class="capH"><span class="num" id="capN"></span><div id="capT"></div><button id="capC" type="button" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="mini" id="capS"></div>
  <div id="capX"></div>
  <div class="anM" id="capM"></div>
  <div class="row"><button id="capP">上一条</button><span class="mini" id="capI"></span><button id="capNx">下一条</button><button id="capE">编辑</button></div>
</div>
<div id="lb" hidden><button id="lbX" type="button" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="lbC"></div><div id="lbT"></div></div>

/* ---------- 小型向量/矩阵 ---------- */
const V={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
 cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
 norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]},
 dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2]};
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2);
 return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]}
/* 正交投影：视高取 dist·tan(fov/2)，与透视在目标距离处的视高一致，
   切换投影时画面大小不跳，滚轮缩放的手感也不变 */
function orthoM(hh,asp,n,f){const hw=hh*asp;
 return [1/hw,0,0,0, 0,1/hh,0,0, 0,0,2/(n-f),0, 0,0,(f+n)/(n-f),1]}
function lookAt(eye,ctr,up){const z=V.norm(V.sub(eye,ctr)),x=V.norm(V.cross(up,z)),y=V.cross(z,x);
 return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
  -V.dot(x,eye),-V.dot(y,eye),-V.dot(z,eye),1]}
function mul(a,b){const o=new Array(16);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}
 return o}

  const T=(x,y,z)=>[ox+ux*x+nx*y, oy+uy*x+ny*y, oz+z];

    const tri0=tris.length, e0=edges.length, v0=GP.length/3;
    for(const f of faces){
      const u=V.sub(f[1],f[0]), v=V.sub(f[2],f[0]), nn=V.norm(V.cross(u,v));
      const base=GP.length/3;
      for(const p1 of f){
        GP.push(p1[0],p1[1],p1[2]); GN.push(nn[0],nn[1],nn[2]);
        GC.push(c[0]/255,c[1]/255,c[2]/255); GI.push(id+1); GE.push(0,0);
        for(let k=0;k<3;k++){ if(p1[k]<bb[k])bb[k]=p1[k]; if(p1[k]>bb[k+3])bb[k+3]=p1[k]; }
      }
      for(let k=1;k<f.length-1;k++) tris.push(base,base+k,base+k+1);
      /* 面的周界线 —— 实体叠边线用，木料棱角一根根看得清 */
      for(let k=0;k<f.length;k++) edges.push(base+k,base+(k+1)%f.length);
    }
    pieces.push({id,pi,mi,lv:P.lv,ki,lab,len,plies,mat,x,y,z,dx,dy,dz,
                 tri0,tri1:tris.length,e0,e1:edges.length,v0,v1:GP.length/3});

});
center=[(bb[0]+bb[3])/2,(bb[1]+bb[4])/2,(bb[2]+bb[5])/2];
radius=Math.max(1,Math.hypot(bb[3]-bb[0],bb[4]-bb[1],bb[5]-bb[2])/2);

/* 爆炸方向：每块板离整体中心的水平方向，逐顶点写进 attribute */
pieces.forEach(p=>{
  const P0=D.panels[p.pi];
  const dx=P0.tr[0]-center[0], dy=P0.tr[1]-center[1], L=Math.hypot(dx,dy)||1;
  for(let i=p.v0;i<p.v1;i++){ GE[i*2]=dx/L; GE[i*2+1]=dy/L; }

function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));

 if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));return p}

const VS=`
attribute vec3 aPos; attribute vec3 aNrm; attribute vec3 aCol; attribute float aId;
attribute vec2 aExp;
uniform mat4 uMVP; uniform float uExpK; uniform float uZBias;
uniform vec3 uEye; uniform vec3 uFwd; uniform float uOrtho;
varying vec3 vNrm; varying vec3 vCol; varying vec3 vId; varying float vZ;
vec3 idcol(float i){ float r=mod(i,256.0); float g=mod(floor(i/256.0),256.0);
  float b=floor(i/65536.0); return vec3(r,g,b)/255.0; }
void main(){
  vec3 p=aPos; p.xy += aExp*uExpK;
  /* 边线沿视线朝镜头挪 uZBias 毫米 —— 屏幕位置不变，只是深度靠前一点：
     赢得过自己贴着的面，赢不过前方哪怕几毫米厚的实体，被挡住的线就看不见。
     偏置按世界毫米给、不随远近变（旧做法在裁剪空间加常数，透视时远处
     等于几十毫米，墙骨边线从别的构件后面透出来；polygonOffset 按面斜率
     放大，侧立窄面后面的线全漏）。 */
  if(uZBias>0.0){ p += (uOrtho>0.5 ? -uFwd : normalize(uEye-p))*uZBias; }
  gl_Position=uMVP*vec4(p,1.0);
  vNrm=aNrm; vCol=aCol; vId=idcol(aId); vZ=aPos.z;
}`;
const FS=`
precision mediump float;
varying vec3 vNrm; varying vec3 vCol; varying vec3 vId; varying float vZ;
uniform float uPick; uniform float uClip; uniform float uLine;
void main(){
  if(vZ>uClip) discard;
  if(uPick>0.5){ gl_FragColor=vec4(vId,1.0); return; }
  if(uLine>0.5){ gl_FragColor=vec4(0.22,0.17,0.11,1.0); return; }
  vec3 n=normalize(vNrm);
  float d=max(dot(n,normalize(vec3(0.45,0.25,0.86))),0.0);
  float a=0.42+0.58*d;
  float rim=pow(1.0-abs(n.z),2.0)*0.06;
  vec3 c=vCol*a+rim;
  gl_FragColor=vec4(c,1.0);
}`;
const P=prog(VS,FS);
const loc={pos:gl.getAttribLocation(P,'aPos'),nrm:gl.getAttribLocation(P,'aNrm'),

 exp:gl.getAttribLocation(P,'aExp'),

 clip:gl.getUniformLocation(P,'uClip'),expk:gl.getUniformLocation(P,'uExpK'),

function buf(data,n){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);return b}
const bPos=buf(GP),bNrm=buf(GN),bCol=buf(GC),bId=buf(GI),bExp=buf(GE);
const bIdx=gl.createBuffer(), bEIdx=gl.createBuffer();
const uintOK=gl.getExtension('OES_element_index_uint');
let idxCount=0, edgeCount=0;

/* ---------- 过滤与索引 ---------- */
const showLv=new Set(D.levels.map((_,i)=>i));
const showKd=new Set(D.kinds.map((_,i)=>i));
function rebuild(){
  const arr=[], earr=[];
  pieces.forEach(p=>{
    if(!showLv.has(p.lv)||!showKd.has(p.ki))return;
    for(let t=p.tri0;t<p.tri1;t++) arr.push(tris[t]);
    for(let t=p.e0;t<p.e1;t++) earr.push(edges[t]);
  });

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);

    uintOK?new Uint32Array(arr):new Uint16Array(arr),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bEIdx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
    uintOK?new Uint32Array(earr):new Uint16Array(earr),gl.STATIC_DRAW);
  rebuildMarks();
  hud();
}

/* ---------- 相机 ---------- */
/* 边线深度偏置（世界毫米）：必须小于最薄的遮挡物 —— 拉撑板 7.5~10mm */
const EDGE_BIAS_MM=2.0;
let yaw=-0.9,pitch=0.62,dist=radius*2.6,pan=[0,0,0],wire=false,clipZ=1e9,expK=0,
    orthoOn=true,edgesOn=true;
function eye(){
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  return [center[0]+pan[0]+dist*cp*Math.cos(yaw),
          center[1]+pan[1]+dist*cp*Math.sin(yaw),
          center[2]+pan[2]+dist*sp];
}
/* 模型在镜头前后占多深 —— dc：模型包围球的球心顺着视线离镜头多远（负的 = 在镜头后面），R：球的半径
   （爆炸开了跟着放大，再留一点余量）。远近裁剪面、正交下视线的起点都照它定。
   球心是模型的中心，不是镜头盯着的那一点：镜头绕着光标转、朝着光标缩放以后，盯着的那一点常常离模型
   中心一两个半径远。早先裁剪面照「盯着的那一点前后各 1.6 个半径」定，那时模型的一头就落到裁剪面外面，
   被斜着切掉一块 —— 用户看到的「特定视角产生破面」。 */
function depthSpan(){
  const cp=Math.cos(pitch), f=[-cp*Math.cos(yaw),-cp*Math.sin(yaw),-Math.sin(pitch)];       // 视线方向
  return {dc:dist-(pan[0]*f[0]+pan[1]*f[1]+pan[2]*f[2]), R:radius*1.03+expK*1.5+50};
}
function draw(pick){
  const w=cv.width,h=cv.height;
  gl.viewport(0,0,w,h);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clearColor(0.07,0.063,0.047,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const e=eye(), c=[center[0]+pan[0],center[1]+pan[1],center[2]+pan[2]];
  /* 远近裁剪面贴着模型包围球走（见 depthSpan）：深度缓冲的精度全花在有几何的地方。
     正交投影允许负的近平面 —— 裁剪槽直接包住整个模型，镜头贴得再近、转到哪个角度都不会切出破面；
     透视的近平面必须为正：镜头在球外面就贴着球的近端，钻进球里了就取一个小的正数（随距离缩小，
     但不超过半径的 2%，不然离得远的时候会把眼前的木料切掉）。 */
  const sp=depthSpan();
  const zn=orthoOn?sp.dc-sp.R
    :(sp.dc-sp.R>radius*0.002?sp.dc-sp.R:Math.max(radius*0.002,Math.min(dist*0.03,radius*0.02)));
  const zf=orthoOn?sp.dc+sp.R:Math.max(sp.dc+sp.R,zn*2);
  const proj=orthoOn?orthoM(dist*Math.tan(0.36),w/h,zn,zf)
                    :persp(0.72,w/h,zn,zf);
  const mvp=mul(proj,lookAt(e,c,[0,0,1]));
  gl.useProgram(P);
  gl.uniformMatrix4fv(loc.mvp,false,new Float32Array(mvp));
  gl.uniform1f(loc.pick,pick?1:0);
  gl.uniform1f(loc.clip,clipZ);
  gl.uniform1f(loc.expk,expK);
  const fw=[c[0]-e[0],c[1]-e[1],c[2]-e[2]], fl=Math.hypot(fw[0],fw[1],fw[2])||1;
  gl.uniform3f(loc.eye,e[0],e[1],e[2]);
  gl.uniform3f(loc.fwd,fw[0]/fl,fw[1]/fl,fw[2]/fl);
  gl.uniform1f(loc.ortho,orthoOn?1:0);
  const bind=(b,l,n)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l,n,gl.FLOAT,false,0,0)};
  bind(bPos,loc.pos,3); bind(bNrm,loc.nrm,3); bind(bCol,loc.col,3); bind(bId,loc.id,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,bExp);
  gl.enableVertexAttribArray(loc.exp);
  gl.vertexAttribPointer(loc.exp,2,gl.FLOAT,false,0,0);
  gl.uniform1f(loc.line,0); gl.uniform1f(loc.zbias,0);
  gl.depthFunc(gl.LEQUAL);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);
  gl.drawElements(wire&&!pick?gl.LINES:gl.TRIANGLES,idxCount,
    uintOK?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,0);
  if(!pick&&edgesOn&&!wire){
    gl.uniform1f(loc.line,1); gl.uniform1f(loc.zbias,EDGE_BIAS_MM);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bEIdx);
    gl.drawElements(gl.LINES,edgeCount,uintOK?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,0);
    gl.uniform1f(loc.line,0); gl.uniform1f(loc.zbias,0);
  }
  /* 标注：高亮块接着画进同一张深度图，序号和尺寸线画到上面那张 2D 画布 */
  if(!pick){ MVP=mvp; drawMarks(mvp,e,[fw[0]/fl,fw[1]/fl,fw[2]/fl]); drawOv(); }
}

/* ---------- 交互 ---------- */
/* 鼠标：左键拖拽旋转，Shift/右键/中键拖拽平移，滚轮缩放，点击拾取。旋转绕着按下去时光标指着的
   那一点，缩放以光标指着的那一点为中心（那一点在屏幕上不动）。
   触屏：单指旋转；双指捏合缩放（以两指中点为中心，指下那一点不动），两指一起挪
   = 平移（画面跟着手指走）；轻点拾取。pointer 事件按 pointerId 记住每根手指，
   每次只算增量，手指数变化时画面不跳。双指之后剩下的那根手指不再旋转、直到
   全部抬起 —— 两指抬起总有先后，不然俯视时画面会被带歪一点。 */
const TOUCH=matchMedia('(pointer: coarse)').matches;   // 触屏为主：底栏提示换成手势
const ptrs=new Map();               // pointerId -> {x,y}
let gest=null, raf=0;               // gest：一次按下到全部抬起
function redraw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw(false)}); }
function panBy(dx,dy,s){ const cy=Math.cos(yaw),sy=Math.sin(yaw);
  pan[0]+= (sy*dx - cy*dy*Math.sin(pitch))*s;
  pan[1]+=(-cy*dx - sy*dy*Math.sin(pitch))*s;
  pan[2]+= dy*Math.cos(pitch)*s; }
function zoomTo(d){ return Math.max(radius*0.05,Math.min(radius*40,d)); }
function two(){ const [p,q]=ptrs.values();
  return {x:(p.x+q.x)/2, y:(p.y+q.y)/2, d:Math.hypot(p.x-q.x,p.y-q.y)||1}; }
/* ---- 转、缩都以光标（手指）指着的那一点为准，不是画面中心 ---- */
/* 屏幕上这一点指着模型的哪里（世界坐标）：指着木料就是木料表面上那一点；指着空白处，取视线上和
   镜头目标点一样深的那一点 */
function pointAt(cx,cy){
  const p=pickPiece(cx,cy);
  if(p) return L2W(p.pi,rawHit(p,cx,cy).raw);
  const ray=rayAt(cx,cy), cb=camBasis(), c=[center[0]+pan[0],center[1]+pan[1],center[2]+pan[2]],
        den=V.dot(ray.d,cb.z), k=Math.abs(den)<1e-9?0:V.dot(V.sub(c,ray.o),cb.z)/den;
  return [ray.o[0]+ray.d[0]*k,ray.o[1]+ray.d[1]*k,ray.o[2]+ray.d[2]*k];
}
/* 抓住世界点 P：记下它在镜头里的位置 s —— 从目标点量起，往右、往上、朝着镜头各多远 */
function grab(P){const cb=camBasis(), r=[P[0]-center[0]-pan[0],P[1]-center[1]-pan[1],P[2]-center[2]-pan[2]];
  return {P,s:[V.dot(r,cb.x),V.dot(r,cb.y),V.dot(r,cb.z)]}}
/* 镜头转过（或者 s 改过）以后，把目标点挪到让 P 在镜头里还是 s 那个位置：P 在屏幕上就没动 */
function hold(g){const cb=camBasis();
  pan=[0,1,2].map(i=>g.P[i]-g.s[0]*cb.x[i]-g.s[1]*cb.y[i]-g.s[2]*cb.z[i]-center[i])}
/* 绕着抓住的那一点转（没抓就是绕目标点） */
function orbitBy(dx,dy,g){

/* 以屏幕上 (cx,cy) 指着的那一点为中心，把镜头距离缩放到 nd：那一点在屏幕上不动。正交投影只和屏幕
   位置有关；透视还要看那一点有多深，所以得知道它是哪一点（P，没给就现找） */
function zoomAt(cx,cy,nd,P){
  nd=zoomTo(nd); if(nd===dist) return;
  if(orthoOn){const r=cv.getBoundingClientRect(), u=2*dist*Math.tan(0.36)/(cv.clientHeight||innerHeight), k=nd/dist;
    panBy((k-1)*(cx-r.left-r.width/2),(k-1)*(cy-r.top-r.height/2),u);dist=nd;return}
  const g=grab(P||pointAt(cx,cy)), a=dist-g.s[2], b=nd-g.s[2];        // 镜头到那一点有多深：缩之前、缩之后
  dist=nd; if(a>1e-6&&b>1e-6){g.s[0]*=b/a;g.s[1]*=b/a;hold(g)}
}
cv.addEventListener('pointerdown',e=>{
  stopFly();                        // 手一碰就停下正在转过去的镜头
  if(e.isPrimary) ptrs.clear();     // 新的一次手势（顺手清掉万一漏收 up 的残留）
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  cv.classList.add('drag');

cv.addEventListener('pointermove',e=>{

    return;
  }
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(ptrs.size===1){
    p.x=e.clientX; p.y=e.clientY;
    if(gest.multi) return;
    gest.moved+=Math.abs(dx)+Math.abs(dy);
    if(gest.mouse&&(gest.b!==0||e.shiftKey)) panBy(dx,dy,dist*0.0016);
    else{
      /* 转第一下之前，先看光标（手指）指着哪：整个这一拖都绕着那一点转 */
      if(!gest.pv) gest.pv=grab(pointAt(e.clientX-dx,e.clientY-dy));

  }
  const a=two(); p.x=e.clientX; p.y=e.clientY; const b=two();
  /* 目标深度上每个 CSS 像素对应的世界毫米 —— 与 draw() 的视高 dist·tan(0.36) 同源，
     正交下处处精确，透视下在目标深度上精确 */
  const u=2*dist*Math.tan(0.36)/(cv.clientHeight||innerHeight);

});
function lift(e,cancel){
  if(!ptrs.delete(e.pointerId)) return;

  if(!cancel&&g&&!g.multi&&g.moved<(g.mouse?4:10)){
    if(g.mouse){setShift(e.shiftKey);setCtrl(guideKey(e))}   // Shift+点 = 锁定方向（Shift+拖 才是平移）；Ctrl+点 = 引导点
    tapAt(e.clientX,e.clientY,!g.mouse)}

cv.addEventListener('pointerup',e=>lift(e,false));
cv.addEventListener('pointercancel',e=>lift(e,true));
let wheelPv=null;                   // 透视投影下连着滚：不必每一下都重新找光标指着哪
cv.addEventListener('wheel',e=>{e.preventDefault();stopFly();
  let P=null;
  if(!orthoOn){const n=performance.now(), w=wheelPv;
    if(w&&n-w.t<400&&Math.abs(w.x-e.clientX)<3&&Math.abs(w.y-e.clientY)<3){P=w.P;w.t=n}
    else{P=pointAt(e.clientX,e.clientY);wheelPv={x:e.clientX,y:e.clientY,P,t:n}}}

let fb=null,tex=null,rb=null;
/* 屏幕上这一点是哪根木料（没有就是 null）。只画进离屏的拾取缓冲，屏幕上的画面不动。
   给了 nb={r} 就连周围 r 个像素的一小块一起读回来：nb.ids = 这一圈里露出来的木料，
   nb.shows(id,x,y) = 屏幕上 (x,y) 附近露没露出 id 这一根（取点吸附用） */
function pickPiece(cx,cy,nb){
  /* CSS 像素 -> 画布像素用画布自己的实际比例：缩放比变了而画布还没重排时，
     现查 devicePixelRatio 会读到别处的像素（点这根、选中那根） */
  const w=cv.width,h=cv.height, rx=w/(cv.clientWidth||w), ry=h/(cv.clientHeight||h);

  gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);
  draw(true);
  const px=new Uint8Array(4), X=Math.round(cx*rx), Y=Math.round(h-cy*ry);
  gl.readPixels(X,Y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  if(nb){
    const R=Math.ceil(nb.r*rx)+2, x0=Math.max(0,X-R), y0=Math.max(0,Y-R),
          w2=Math.min(w,X+R+1)-x0, h2=Math.min(h,Y+R+1)-y0, k=Math.max(2,Math.round(rx*2.5));
    nb.ids=new Set(); nb.shows=()=>false;
    if(w2>0&&h2>0){
      const buf=new Uint8Array(w2*h2*4), at=i=>buf[i]+buf[i+1]*256+buf[i+2]*65536;
      gl.readPixels(x0,y0,w2,h2,gl.RGBA,gl.UNSIGNED_BYTE,buf);
      for(let i=0;i<buf.length;i+=4){const id=at(i);if(id)nb.ids.add(id)}
      nb.shows=(id,sx,sy)=>{const u=Math.round(sx*rx)-x0, v=Math.round(h-sy*ry)-y0;
        for(let b=Math.max(0,v-k);b<=Math.min(h2-1,v+k);b++)
          for(let a=Math.max(0,u-k);a<=Math.min(w2-1,u+k);a++) if(at((b*w2+a)*4)===id) return true;
        return false};
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const id=px[0]+px[1]*256+px[2]*65536;   // 0 = 背景
  return id?(pieces[id-1]||null):null;
}

    if(gd){const x=btn('引导点',()=>{tool.gBtn=!tool.gBtn;again()},guideOn()?'on':'');x.id='gBtn';
      x.title='亮着的时候点下去的是引导点，不是真正的点；读数从引导点量起。电脑上按住 '+(MAC?'⌘':'Ctrl')+' 也一样'}

  const bad=D.panels.filter(p=>!p.ok).length;
  const np=D.panels.filter(p=>!p.placed).length;

    (bad?` · <span style="color:var(--bad)">${bad} 块对账未通过</span>`:'')+

          :' &nbsp;|&nbsp; 拖拽旋转 · 滚轮缩放 · Shift+拖拽平移 · 点击查看构件');

   量一段尺寸、写一句话、挂一份资料。都存在数组 A 里。

   · 高亮块（构件高亮 / 槽口 / 开洞）是 WebGL 里的半透明实体：有深度，贴在木料表面，

   脚本开头抓下来的原始页面）另存一份 —— 还是单个文件，发给别人打开就带着标注。
   标注里的字来自用户或别人给的文件，一律用 textContent 放进页面，不拼 HTML。 */

const PEXP=D.panels.map(P0=>{const dx=P0.tr[0]-center[0],dy=P0.tr[1]-center[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];});

/* ---------- 坐标：板局部 <-> 世界 ---------- */
function L2W(pi,p){const t=D.panels[pi].tr,e=PEXP[pi];       // 带爆炸，画图用
  return [t[0]+t[3]*p[0]+t[5]*p[1]+e[0]*expK, t[1]+t[4]*p[0]+t[6]*p[1]+e[1]*expK, t[2]+p[2]]}
function L2W0(pi,p){const t=D.panels[pi].tr;                  // 不带爆炸，算尺寸用
  return [t[0]+t[3]*p[0]+t[5]*p[1], t[1]+t[4]*p[0]+t[6]*p[1], t[2]+p[2]]}
/* 反过来用真正的逆矩阵，不当它是正交的：摆位里的方向余弦只留两位小数，斜墙上
   (0.71,0.71) 的长度不是 1，照正交算会差出千分之几 —— 几米长的墙就是几十毫米 */
function D2L(pi,d){const t=D.panels[pi].tr, k=t[3]*t[6]-t[4]*t[5];

   是做的时候用户手动放的 —— 贴哪个面、拉多远都由他定。前几版的数据没有 ov：画的时候照老办法
   自动摆（见 drawDim）。
   数值一律按没爆炸的位置算，画的时候才跟着爆炸走。 */
function dirW(pi,d){const t=D.panels[pi].tr;return V.norm([t[3]*d[0]+t[5]*d[1],t[4]*d[0]+t[6]*d[1],d[2]])}
/* 世界方向 -> 板局部的单位方向（存进标注用） */
function dirL(pi,u){const d=D2L(pi,u), L=Math.hypot(d[0],d[1],d[2])||1;return d.map(x=>Math.round(x/L*1e5)/1e5)}
/* 板 pi 里的方向 d 是不是正好顺着模型的某根轴：是就返回 0/1/2（X/Y/Z），斜的（或没有方向）返回 -1 */
function axW(pi,d){if(!d) return -1;const u=dirW(pi,d);return [0,1,2].findIndex(k=>Math.abs(u[k])>.9995)}
/* P 测点；M 测点落在量的那条线上的位置；N 再拉出去之后的位置（尺寸线上）—— 都是世界坐标。
   u 量的方向，w 拉出的方向；val 各点到第一个点的距离（带正负，顺着 u 为正）；ord 按 val
   从小到大的点序；len 首尾之间的总长 */
function dimGeo(an,exploded){
  const pis=an.pts.map(q=>PIDX.get(q.pn)); if(pis.some(i=>i==null)) return null;
  const P0=an.pts.map((q,i)=>L2W0(pis[i],q.p)), P=exploded?an.pts.map((q,i)=>L2W(pis[i],q.p)):P0;
  const u0=an.dir?dirW(pis[0],an.dir):V.norm(V.sub(P0[1],P0[0])),
        u=(an.dir||!exploded)?u0:V.norm(V.sub(P[1],P[0]));

  if(an.ov){const v=dirW(pis[0],an.ov), c=V.dot(v,u), q=[v[0]-u[0]*c,v[1]-u[1]*c,v[2]-u[2]*c];
    if(Math.hypot(q[0],q[1],q[2])>.05) w=V.norm(q)}

  const M=P.map(q=>{const k=V.dot(V.sub(q,P[0]),u);return [0,1,2].map(j=>P[0][j]+u[j]*k)}),

    const a=g.N[g.ord[0]], b=g.N[g.ord[g.ord.length-1]];return [0,1,2].map(k=>(a[k]+b[k])/2)}

function annVisible(an){
  if(an.type==='doc') return false;
  const pi=PIDX.get(an.pn); if(pi==null||!showLv.has(D.panels[pi].lv)) return false;
  if(an.type==='dim') return an.pts.every(q=>PIDX.has(q.pn));
  const p=pieceOf(an); return !(p&&!showKd.has(p.ki));
}

/* ---------- 高亮块：WebGL 半透明实体 ---------- */
const VS2=`
attribute vec3 aPos; attribute vec4 aCol;
uniform mat4 uMVP; uniform vec3 uEye; uniform vec3 uFwd; uniform float uOrtho; uniform float uZBias;
varying vec4 vCol; varying float vZ;
void main(){
  /* 与边线同一招：沿视线朝镜头挪几毫米，贴在木料表面的块赢得过那个面，
     赢不过前面隔着的另一根木料 */
  vec3 p=aPos+(uOrtho>0.5 ? -uFwd : normalize(uEye-aPos))*uZBias;
  gl_Position=uMVP*vec4(p,1.0); vCol=aCol; vZ=aPos.z;
}`;
const FS2=`
precision mediump float;
varying vec4 vCol; varying float vZ; uniform float uClip; uniform float uA;
void main(){ if(vZ>uClip) discard; gl_FragColor=vec4(vCol.rgb,vCol.a*uA); }`;
const P2=prog(VS2,FS2);
const loc2={pos:gl.getAttribLocation(P2,'aPos'),col:gl.getAttribLocation(P2,'aCol'),
  mvp:gl.getUniformLocation(P2,'uMVP'),eye:gl.getUniformLocation(P2,'uEye'),
  fwd:gl.getUniformLocation(P2,'uFwd'),ortho:gl.getUniformLocation(P2,'uOrtho'),

/* 沿 na 轴拉伸的棱柱：ring 是另外两个轴（序号从小到大）上的截面，w0..w1 是 na 轴上的范围 */
function mkPrism(pi,ring,w0,w1,na,col,al,sides){
  const o=[0,1,2].filter(k=>k!==na), n=ring.length;
  const pt=(q,w)=>{const r=[0,0,0];r[na]=w;r[o[0]]=q[0];r[o[1]]=q[1];return L2W(pi,r)};
  const lo=ring.map(q=>pt(q,w0)), hi=ring.map(q=>pt(q,w1));
  const tri=(a,b,c)=>{for(const q of [a,b,c]){MK.pos.push(q[0],q[1],q[2]);MK.col.push(col[0],col[1],col[2],al)}};
  const ln=(a,b)=>{for(const q of [a,b]){MK.lpos.push(q[0],q[1],q[2]);MK.lcol.push(col[0],col[1],col[2],1)}};
  for(let k=1;k<n-1;k++){tri(lo[0],lo[k],lo[k+1]);tri(hi[0],hi[k],hi[k+1])}
  for(let i=0;i<n;i++){const j=(i+1)%n;
    tri(lo[i],lo[j],hi[j]);tri(lo[i],hi[j],hi[i]);ln(lo[i],lo[j]);ln(hi[i],hi[j]);if(sides)ln(lo[i],hi[i])}
}
/* 标注变了、过滤变了、爆炸量变了都要重排一次（块的世界坐标带着爆炸位移） */
function rebuildMarks(){
  MK.pos.length=MK.col.length=MK.lpos.length=MK.lcol.length=0; MK.rng=[];
  A.forEach(an=>{
    const r={f0:MK.pos.length/3,l0:MK.lpos.length/3};
    if(annVisible(an)&&an.type!=='dim'&&an.type!=='note'){
      const pi=PIDX.get(an.pn), col=hex(an.color);
      if(an.type==='hl'){
        /* 整根木料罩上一层：按它的准确轮廓四面各放大 1mm */
        const p=pieceOf(an);
        if(p){const b=boxOf(p), cx=(b.lo[0]+b.hi[0])/2, cz=(b.lo[2]+b.hi[2])/2,
                    kx=1+2/Math.max(1,b.hi[0]-b.lo[0]), kz=1+2/Math.max(1,b.hi[2]-b.lo[2]);
          mkPrism(pi,ringOf(p).map(q=>[cx+(q[0]-cx)*kx,cz+(q[1]-cz)*kz]),b.lo[1]-1,b.hi[1]+1,1,col,.5,true)}
      }else{
        const b=an.box, g=an.g, e=.5;
        if(an.type==='hole'&&g.sh==='c'){
          const o=[0,1,2].filter(k=>k!==g.na), c0=(b[o[0]]+b[o[0]+3])/2, c1=(b[o[1]]+b[o[1]+3])/2, ring=[];
          for(let k=0;k<24;k++){const t=k/24*6.283185307;ring.push([c0+Math.cos(t)*g.d/2,c1+Math.sin(t)*g.d/2])}

        }else mkPrism(pi,[[b[0]-e,b[2]-e],[b[3]+e,b[2]-e],[b[3]+e,b[5]+e],[b[0]-e,b[5]+e]],b[1]-e,b[4]+e,1,col,.62,true);

  const up=(b,d)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.DYNAMIC_DRAW)};

function drawMarks(mvp,e,fw){
  if(!MK.nf&&!MK.nl) return;
  gl.useProgram(P2);

    gl.vertexAttribPointer(loc2.col,4,gl.FLOAT,false,0,0)};

  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE);
  gl.disable(gl.CULL_FACE); gl.depthMask(false);

  bind(MK.bLP,MK.bLC); gl.uniform1f(loc2.zbias,4); gl.drawArrays(gl.LINES,0,MK.nl);
  /* 开洞不做深度测试再画一遍：洞开在木头里面，隔着木料也要看得见。高亮、槽口照实画 —— 被挡住的
     那几面看不见，选中没选中一个样（早先选中的那条也这样透着画，刚做出来的总是「透明」的） */
  gl.disable(gl.DEPTH_TEST);
  A.forEach((an,i)=>{const r=MK.rng[i]; if(an.type!=='hole'||!r||(r.f1<=r.f0&&r.l1<=r.l0)) return;
    bind(MK.bP,MK.bC); gl.uniform1f(loc2.a,.35); gl.drawArrays(gl.TRIANGLES,r.f0,r.f1-r.f0);
    bind(MK.bLP,MK.bLC); gl.uniform1f(loc2.a,1); gl.drawArrays(gl.LINES,r.l0,r.l1-r.l0)});
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
}

/* ---------- 序号、尺寸线、文字：2D 叠层 ---------- */
const DFONT='600 12px system-ui,sans-serif';
function oLine(a,b,c,w){ox.beginPath();ox.moveTo(a[0],a[1]);ox.lineTo(b[0],b[1]);ox.strokeStyle=c;ox.lineWidth=w;ox.stroke()}

function oLine2(a,b,c,w,h){oLine(a,b,h||halo(c),w+1.8);oLine(a,b,c,w)}
function oDot(a,c,r,h){ox.beginPath();ox.arc(a[0],a[1],r||3.5,0,6.2832);ox.fillStyle=c;ox.fill();
  ox.lineWidth=1.2;ox.strokeStyle=h||halo(c);ox.stroke()}
/* 尖在 s、朝 (dx,dy) 的实心箭头 */
function oArrow(s,dx,dy,c){const bx=s[0]-dx*9, by=s[1]-dy*9;
  ox.beginPath();ox.moveTo(s[0],s[1]);ox.lineTo(bx-dy*3.4,by+dx*3.4);ox.lineTo(bx+dy*3.4,by-dx*3.4);ox.closePath();
  ox.fillStyle=c;ox.fill();ox.lineWidth=1;ox.strokeStyle=halo(c);ox.stroke()}
/* 一个读数：中心在 (x,y)，顺着角度 ang 写，垫一块底（黑色的字垫浅底，其余垫深底）——
   压在木料上也看得清。角度归到「字头朝上，或者朝左」：竖着的读数从下往上念，和工程图
   一样；倒着的翻过来 */
function oNum(x,y,s,ang,c){
  while(ang>=Math.PI/2-1e-6)ang-=Math.PI; while(ang<-Math.PI/2-1e-6)ang+=Math.PI;
  ox.save();ox.translate(x,y);ox.rotate(ang);ox.font=NFONT;
  const w=ox.measureText(s).width+8, h=20, r=4, x0=-w/2, y0=-h/2;
  ox.beginPath();ox.moveTo(x0+r,y0);ox.arcTo(x0+w,y0,x0+w,y0+h,r);ox.arcTo(x0+w,y0+h,x0,y0+h,r);
  ox.arcTo(x0,y0+h,x0,y0,r);ox.arcTo(x0,y0,x0+w,y0,r);ox.closePath();
  ox.fillStyle=lum(c)<60?'rgba(245,242,235,.93)':'rgba(18,16,12,.86)';ox.fill();
  ox.textAlign='center';ox.textBaseline='middle';ox.fillStyle=c;ox.fillText(s,0,.5);ox.restore()}
/* 一个垫了黑边的字（取尺寸时三根轴的名字） */
function oChar(x,y,s,c){ox.font=DFONT;ox.textAlign='center';ox.textBaseline='middle';ox.lineJoin='round';
  ox.lineWidth=3.2;ox.strokeStyle='rgba(0,0,0,.75)';ox.strokeText(s,x,y);ox.fillStyle=c;ox.fillText(s,x,y)}
function oBadge(x,y,i,an){const on=i===sel, r=on?12:10;
  ox.beginPath();ox.arc(x,y,r,0,6.2832);ox.fillStyle=an.color;ox.fill();
  ox.lineWidth=on?2.5:1.5;ox.strokeStyle=on?'#fff':halo(an.color);ox.stroke();
  ox.fillStyle=ink(an.color);ox.font='700 '+(on?12:11)+'px system-ui,sans-serif';
  ox.textAlign='center';ox.textBaseline='middle';ox.fillText(String(i+1),x,y+.5);
  hits.push({x,y,r,i})}
/* 左端在 (x,y) 的一条文字胶囊（rt：x 是右端）；给了 i 就能点 */
function oText(x,y,s,i,rt){
  ox.font=DFONT;const w=ox.measureText(s).width+14, h=22, r=11, t=y-11;if(rt)x-=w;
  ox.beginPath();ox.moveTo(x+r,t);ox.arcTo(x+w,t,x+w,t+h,r);ox.arcTo(x+w,t+h,x,t+h,r);
  ox.arcTo(x,t+h,x,t,r);ox.arcTo(x,t,x+w,t,r);ox.closePath();
  ox.fillStyle='rgba(20,17,11,.88)';ox.fill();
  ox.fillStyle='#ece7dc';ox.textAlign='left';ox.textBaseline='middle';ox.fillText(s,x+7,y+.5);

/* 画一条尺寸。i<0 是放置过程中的预览：不画序号、不能点。

   测点之间那条空带里；绝对读数垂直于尺寸线，贴着引出线伸出去的那一头；每个读数垫一块底。
   尺寸线放哪：用户做的时候手动放的（ov / off：往哪个方向拉、拉多远），是三维里的固定位置，
   引出线顺着拉出的方向。只有前几版留下来、没放过的老数据（没有 ov）才自动 —— 在屏幕上平移
   GAP 个像素，放到背着模型的那一侧，转动画面它会跟着换边。

const GAP=46, NFONT='600 15px system-ui,sans-serif';     // 读数的字比别处大：画在面里斜着看会被压扁
/* 尺寸读数画在模型上的实际大小：一个字单位 1.6 毫米，15 号字就是 24 毫米高 —— 45 的间距里写得下「45」。
   拉近到一个字单位 1.4 个像素（面正对着屏幕时字高 21 像素）就到头了，再拉近字不再变大。上限定得比别处的字

const UNIT=1.6, CAPPX=1.4;

/* 世界点 X 处，面里的两个方向 u / w（世界单位向量）在屏幕上每「字单位」走多少像素；mm 是这里
   一个字单位合多少毫米。字是画在模型上的，有实际大小（一个字单位 = unit 毫米），所以近大远小；
   面斜着看，字跟着压扁、歪过去。cap 为真时再加一个上限：面正对着屏幕时一个字单位不超过 CAPPX 个
   像素 —— 拉近到这个大小以后再拉近，字不再变大（尺寸读数用）；cap 为假就是纯粹按实际大小

  if(ax*by-ay*bx>0){bx=-bx;by=-by}

function oLineC(a,b,c,w){

   · 读数一个不落全都写：字按实际大小画在面里，远了小、近了大（大到正常字号为止），挤在一起
     就挤在一起，不因为写不下就藏掉哪一个。
   · 箭头是开口的，和尺寸线、引出线一样粗。每一段间距两头各一个，指着这一段的两个端点；只写

/* 画一条尺寸：手动放过的画在面里；前几版留下来没放过的，照老办法冲着屏幕自动摆 */
function drawDim(an,i){
  const g=dimGeo(an,true); if(!g||g.P.every(q=>q[2]>clipZ)) return;

/* 老办法（没放过的老数据）：冲着屏幕画，尺寸线自动摆到背着模型的一侧 */

  const g=dimGeo(an,true); if(!g||g.P.every(q=>q[2]>clipZ)) return;
  const T=g.P.map(w2s), SM=g.M.map(w2s); if(T.some(s=>s[2]<=0)||SM.some(s=>s[2]<=0)) return;
  const on=i>=0&&i===sel, c=an.color, n=T.length, o=g.ord, a3=SM[o[0]], b3=SM[o[n-1]];
  let ux=b3[0]-a3[0], uy=b3[1]-a3[1]; const L=Math.hypot(ux,uy);

/* ---------- 视角：记下 / 回到 ---------- */
/* 每条标注记着做它时的画面：镜头、投影、爆炸、剖切、隐藏了哪些楼层和构件类型。
   楼层和类型记名字不记序号，镜头目标记绝对坐标 —— 重新生成模型后照样用。 */
function getView(){
  return {yaw:Math.round(yaw*1e4)/1e4,pitch:Math.round(pitch*1e4)/1e4,dist:Math.round(dist),
    t:[0,1,2].map(k=>Math.round(center[k]+pan[k])),o:orthoOn?1:0,exp:+expEl.value,clip:+clipEl.value,
    a:Math.round(cv.clientWidth/Math.max(1,cv.clientHeight)*1000)/1000,

let flyRAF=0;

function flyTo(y2,p2,d2,t2){

  let dy=y2-y1; dy=Math.atan2(Math.sin(dy),Math.cos(dy));        // 转角走近路
  const at=s=>{yaw=y1+dy*s;pitch=p1+(p2-p1)*s;dist=d1*Math.pow(d2/d1,s);
    pan=[0,1,2].map(i=>t1[i]+(tp[i]-t1[i])*s);draw(false)};
  if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches){at(1);return}
  const t0=performance.now();
  const step=now=>{const k=Math.min(1,Math.max(0,(now-t0)/450));at(k*k*(3-2*k));
    flyRAF=k<1?requestAnimationFrame(step):0};

/* 面板没挡住的那一块屏幕（CSS 像素）：标注落在这里面才算看得见 */
function safeRect(){const W=cv.clientWidth, H=cv.clientHeight;
  if(NARROW.matches) return {x0:28,x1:W-28,y0:84,y1:Math.max(200,H-250)};
  return W>980?{x0:290,x1:W-330,y0:50,y1:H-70}:{x0:30,x1:W-30,y0:50,y1:H-70}}
/* 记下的画面搬到现在这块屏幕上：屏幕比当时窄（电脑上做的标注拿到手机竖屏上看）就退远
   一些 —— 按宽高比之差的平方根，左右多看到一些、东西又不至于缩得太小；标注要是还落在
   画面外或面板底下，再把镜头平移到刚好露出来 */

  const W=cv.clientWidth, H=Math.max(1,cv.clientHeight), t=v.t.slice();

    const z=[Math.cos(v.pitch)*Math.cos(v.yaw),Math.cos(v.pitch)*Math.sin(v.yaw),Math.sin(v.pitch)],

    const px=W/2+V.dot(r,x)*k, py=H/2-V.dot(r,y)*k;

    if(px<s.x0||px>s.x1||py<s.y0||py>s.y1){

function applyView(v,an){

/* ---------- 放置 ---------- */
/* 尺寸怎么量（照 SketchUp 尺寸工具的路数）：

     第二个点定方向，再一个个往下点，「完成」或回车收住。标注上记着是哪一种（chain）。
   · 取点：点在模型上（自动吸附顶点 / 中点 / 圆心 / 垂足 / 边线）；第一个点之后也可以用鼠标

let chainShow='r', shiftOn=false;       // chainShow：连续测量的读数上次选的是哪种写法
function toolBtns(){document.querySelectorAll('[data-tool]').forEach(b=>
  b.classList.toggle('on',!!tool&&tool.btn===b.dataset.tool))}
/* t：按钮的名字 —— dim1 单次测量 / dimc 连续测量 / hl / notch / hole / note / doc。

function startTool(t,ed,place){
  if(t==='doc'){endTool();addAnn({type:'doc'});return}
  if(tool&&tool.btn===t&&!ed){endTool();return}

  tool={type:dm?'dim':t,btn:t,pts:[],keep:0,guide:[],gLock:-1,gS:-1,gBtn:false};
  if(dm){
    /* stage：pts 取点 / place 放尺寸线。lock：锁在哪根轴（-1 不锁）；sLock：按着 Shift 时锁的那根；

    Object.assign(tool,{chain:t==='dimc',show:t==='dimc'?chainShow:'r',stage:'pts',dir:null,lock:-1,sLock:-1,
      neg:false,plane:-1,pj:-1,pm:null,color:COLORS[DEFCOL.dim],off:0,ov:null});
    const g=ed&&dimGeo(ed,false);
    if(g) Object.assign(tool,{edit:ed.id,pts:ed.pts.map(q=>({pn:q.pn,p:q.p.slice()})),keep:ed.pts.length,
      dir:ed.dir||(ed.chain?dirL(PIDX.get(ed.pts[0].pn),g.u):null),show:ed.show,color:ed.color,off:ed.off,ov:ed.ov,
      stage:place?'place':'pts',replace:!!place});

  const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur();

function endTool(){tool=null;hover=null;cv.style.cursor='';toolBtns();hud();cap();undoBtns();draw(false)}
/* 这根木料上标的圆洞：两个口的圆心也能吸。q 圆心，na / s 这个口开在哪根轴的哪一头
   （朝着镜头的那个口才吸） */
function holeCtrs(p){const r=[];
  A.forEach(an=>{if(an.type!=='hole'||an.g.sh!=='c'||PIDX.get(an.pn)!==p.pi||an.mi!==p.mi) return;
    const b=an.box, na=an.g.na;
    [[b[na],-1],[b[na+3],1]].forEach(w=>{const q=[(b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2];
      q[na]=w[0];r.push({q,na,s:w[1]})})});

    if(c&&better(c,best)){best=c;bq=q}});

/* 从世界点 o 出发的模型三根轴：near = 鼠标在屏幕上挨着哪根（没有就 -1），best = 从 o 到鼠标的

function lineT(A,u,o,d){const w=V.sub(A,o), b=V.dot(u,d), c=V.dot(d,d), den=V.dot(u,u)*c-b*b;

      if(s) k=[0,1,2].findIndex(j=>Math.abs(d[j])>.05&&Math.hypot(d[(j+1)%3],d[(j+2)%3])<.5);

/* ----- 放尺寸线 ----- */
/* 量的方向 u 和拉出的方向 v 张成的面叫什么 */
function planeName(u,v){const n=V.norm(V.cross(u,v)), k=[0,1,2].findIndex(j=>Math.abs(n[j])>.9995);
  return k>=0?['YZ 面','XZ 面','XY 面'][k]:Math.abs(n[2])<.02?'竖直面':'斜面'}

   u 量的方向，A 第一个点现在的位置 */
function placeCands(){
  const g=dimGeo({pts:tool.pts,dir:tool.dir},true), u=g.u, cand=[];
  for(const k of [2,0,1]){const c=u[k], v=[-u[0]*c,-u[1]*c,-u[2]*c]; v[k]+=1;
    const L=Math.hypot(v[0],v[1],v[2]); if(L<.3) continue;
    const w=[v[0]/L,v[1]/L,v[2]/L]; if(cand.some(x=>Math.abs(V.dot(x.v,w))>.999)) continue;
    cand.push({v:w,name:planeName(u,w)})}

/* 光标往哪边走，尺寸线就贴哪个面：最近这一小段移动在屏幕上最像哪根轴拉出去的方向，就吸到那个面
   （要明显更像才换，不然在两个面之间来回跳）。pj 现在吸的是第几个面，pm 上次记下的光标位置 */
function placeTrack(x,y){

  const pc=placeCands(), a=w2s(pc.A), ppm=cv.clientHeight/(2*dist*Math.tan(0.36)); let best=-1, bs=.5, cur=9;
  pc.cand.forEach((c,j)=>{const b=w2s([pc.A[0]+c.v[0]*300,pc.A[1]+c.v[1]*300,pc.A[2]+c.v[2]*300]),
      wx=b[0]-a[0], wy=b[1]-a[1], wl=Math.hypot(wx,wy);

    const sn=Math.abs(dx*wy-dy*wx)/(L*wl);                // 走的方向和它差多少（夹角的正弦）
    if(j===tool.pj) cur=sn; if(sn<bs){bs=sn;best=j}});

   哪里，尺寸线就过哪里。贴哪个面：用户在提示条上指定的 > 跟着光标吸到的 > 最正对着屏幕的。
   返回 v 拉出的方向、off 拉出多远（毫米，带正负）、name 面的名字 */
function placeAt(cx,cy){
  const pc=placeCands(), ray=rayAt(cx,cy), n=pc.cand.length;
  const res=pc.cand.map((c,j)=>{const nr=V.cross(pc.u,c.v), den=V.dot(nr,ray.d);
    if(Math.abs(den)<.08) return null;                    // 这个面几乎侧对着屏幕，放不了
    const t=V.dot(nr,V.sub(pc.A,ray.o))/den;
    return {j,v:c.v,name:c.name,den:Math.abs(den),
      off:V.dot([ray.o[0]+ray.d[0]*t-pc.A[0],ray.o[1]+ray.d[1]*t-pc.A[1],ray.o[2]+ray.d[2]*t-pc.A[2]],c.v)}});
  const want=tool.plane>=0&&tool.plane<n?tool.plane:(tool.pj>=0&&tool.pj<n?tool.pj:-1);
  let best=want>=0?res[want]:null;
  if(!best) res.forEach(r=>{if(r&&(!best||r.den>best.den)) best=r});

function placeDefault(){
  const pc=placeCands(), rc=cv.getBoundingClientRect(), d=rayAt(rc.left+rc.width/2,rc.top+rc.height/2).d;
  const want=tool.plane>=0?tool.plane:tool.pj; let best=null;
  pc.cand.forEach((c,j)=>{const den=want===j?9:Math.abs(V.dot(V.cross(pc.u,c.v),d));
    if(!best||den>best.den) best={j,v:c.v,name:c.name,off:0,den}});

function enterPlace(){tool.guide=[];tool.stage='place';tool.plane=-1;tool.pj=-1;tool.pm=null;hover=null;hud();undoBtns();if(hovXY)hoverNow();else draw(false)}
/* 尺寸线放好了：存下来。v 拉出的方向（世界），off 拉出多远 */
function commitDim(v,off){
  const t=tool, ov=dirL(PIDX.get(t.pts[0].pn),v);
  endTool();
  if(t.edit){const i=A.findIndex(a=>a.id===t.edit); if(i<0) return;
    Object.assign(A[i],{pts:t.pts,dir:t.dir,show:t.show,ov,off,flip:false});sel=i;changed(true);openAnn()}
  else addAnn({type:'dim',chain:t.chain,pts:t.pts,dir:t.dir,show:t.show,ov,off});

/* ----- 开槽：照单次测量的路数，点一下定起点，移动鼠标定长度（或者输入长度） ----- */

   想顺着水平的木料去切，但是没有办法把方向调过去」—— 早先点中哪根就只能开哪根，方向也只有那个面
   里的两根轴。

   时鼠标正指着的那一点（没吸附的，判方向用）；
   cands 起点挨着的木料（cd：p 木料、b 它的外形、l 起点在它那块板里的坐标）；

   opts 每根木料的每根轴：cd、k 它的第几根轴、ai 是 axes 里的第几根、o 同向还是反向、long 是不是

   那一头剩得多的。每一条：cd 哪根木料、k 它的哪根轴、sl 朝它的哪一头、room 那一头还剩多少、faces

    const j=[0,1,2].reduce((m,k)=>Math.abs(u[k])>Math.abs(u[m])?k:m,0);
    r.push({ai,j,name:AXL[j]+(r.some(x=>x.j===j)?'′':'')})});

   · 只有一个朝着镜头 —— 看得见的那个；
   · 两个都看得见 —— 鼠标偏在棱的哪一边，就是那一边的面（偏不到 6 个像素不换）；还没偏，取更正对着

/* 鼠标在屏幕上 (cx,cy)：槽开到哪 —— p 开在哪根木料上、p1 起点（那块板的局部坐标）、na / ns 从哪个面

  c.face={p:P,k:kk,na:f.na,ns:f.ns};
  const to=x=>Math.max(b.lo[kk],Math.min(b.hi[kk],x)),

  /* 选中变回来的那一条：撤销删除 = 刚回来的，撤销改动 = 被改的那条 */
  let i=A.findIndex(a=>{const o=cur.get(a.id);return !o||!sameAn(o,a)});
  if(i<0&&keep) i=A.findIndex(a=>a.id===keep);
  sel=i;lastKey='';dirty=true;
  rebuildMarks();renderList();counts();cap();autosave();state();undoBtns();draw(false);
  if(fi>=0){const nb=document.querySelector('#annList .an.sel .anE'), f=nb&&nb.querySelectorAll('textarea,input')[fi];
    if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch(_){}}}
}
/* 做到一半能退的那一步。有引导点：退掉最后一个引导点。量尺寸：放尺寸线 → 退回取点；取点 → 退掉
   刚点的那个点。开槽：退掉起点 */
function toolStep(){return !!tool&&(guided()||(tool.type==='notch'?!!tool.cut
  :tool.type==='dim'&&(tool.stage==='place'?!tool.replace:tool.pts.length>tool.keep)))}
function undo(){
  if(toolStep()){
    if(guided()) tool.guide.pop();
    else if(tool.type==='notch') tool.cut=null;
    else if(tool.stage==='place'){tool.stage='pts';if(!tool.chain){tool.pts.pop();tool.dir=null}}   // 单次测量退掉第二个点
    else{tool.pts.pop();if(tool.pts.length<2&&!tool.edit)tool.dir=null}
    hover=null;hud();undoBtns();if(hovXY)hoverNow();else draw(false);return}
  if(!UN.length){toast('没有可以撤销的了');return}
  if(tool)endTool();
  RE.push(LAST);LAST=UN.pop();restore(LAST);
}
function redo(){
  if(!RE.length){toast('没有可以重做的了');return}
  if(tool)endTool();
  UN.push(LAST);LAST=RE.pop();restore(LAST);
}
function undoBtns(){
  document.getElementById('bUndo').disabled=!(UN.length||toolStep());
  document.getElementById('bRedo').disabled=!RE.length;
}
/* structural=false：只改了字或数，不重排列表（重排会把正在打字的输入框换掉）。
   key：同一处连着改给同一个 key，撤销时并成一步 */
function changed(structural,key){
  record(key);

  counts();cap();autosave();state();undoBtns();draw(false);

  if(an.type==='dim'){const s=Array.from(new Set(an.pts.map(q=>q.pn)));
    return s.length>2?s[0]+' 等 '+s.length+' 块板':s.join(' → ')}
  const p=pieceOf(an);return an.pn+(p?' · '+D.kinds[p.ki]+(p.lab?' '+p.lab:''):'');
}
function sub(an){
  const p=pieceOf(an), g=an.g;

  if(an.type==='notch') return '长 '+fmtD(g.L)+' × 宽 '+fmt(g.W)+' × 深 '+fmt(g.Dp);
  if(an.type==='hole') return (g.sh==='c'?'Ø'+fmt(g.d):fmt(g.L)+' × '+fmt(g.W))+' · '+AXN[g.ax]+' '+fmt(g.pos);
  if(an.type==='dim'){const q=dimGeo(an,false); if(!q) return '原来那块板找不到了';
    const k=axW(PIDX.get(an.pts[0].pn),an.dir), d=k>=0?' · '+AXL[k]+' 向':an.dir?' · 斜向':'';

/* 照片缩到最长边 1600 再存进文件，不然几张照片就把 HTML 撑到几十兆 */
function shrink(f){
  return new Promise((ok,no)=>{const u=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
function readURL(f){return new Promise((ok,no)=>{const r=new FileReader();
  r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function addFiles(an,files){
  for(const f of files){
    try{
      let d;
      if(/^image\/(jpeg|png|webp|bmp|heic|heif)$/.test(f.type)) d=await shrink(f);
      else{
        if(f.size>15e6){toast('「'+f.name+'」有 '+Math.round(f.size/1e6)+' MB，太大放不进文件；请传到网盘，再用「加链接」');continue}
        d=await readURL(f);
      }
      const m=normMedia({n:f.name,d});
      if(m)an.media.push(m);else toast('「'+f.name+'」这种文件放不进来');
    }catch(_){toast('「'+f.name+'」读不出来')}
  }
  changed(true);
}

/* 带标注的整页源码：把 SRC 里那块标注数据换成现在的。< 写成 <，数据里就不会

  return SRC.slice(0,m.index)+m[1]+j+m[2]+SRC.slice(m.index+m[0].length);
}

addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(), t=e.target, tag=((t&&t.tagName)||'').toLowerCase();
  /* 撤销 Ctrl+Z，重做 Ctrl+Shift+Z（也认 Ctrl+Y；Mac 上是 ⌘）。说明框里也归这里管 ——
     让浏览器自己撤销的话，它改回去的字会被当成又一次新的改动 */
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(k==='z'||k==='y')){
    if(t&&t.closest&&t.closest('.lk')) return;        // 填链接的两个框还不是标注数据，留给浏览器
    e.preventDefault();(k==='y'||e.shiftKey)?redo():undo();return}
  const typing=/^(input|textarea|select)$/.test(tag);
  /* 量尺寸时在模型上直接敲数字：字落进提示条上那个输入框 */
  if(tool&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[0-9.\-]$/.test(e.key)){
    const i=document.getElementById('lenIn');
    if(i){e.preventDefault();i.value+=e.key;i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(_){}}
    return}
  if(k==='enter'&&tool&&tool.chain&&tool.stage==='pts'&&!typing&&!/^(button|a)$/.test(tag)){
    e.preventDefault();finishPts();return}
  if(k!=='escape') return;
  if(!document.getElementById('lb').hidden){closeLb();return}
  /* Esc：有引导点先清引导点，再按一次才退出工具 */
  if(tool&&guided()){tool.guide=[];tool.gLock=-1;tool.gS=-1;hover=null;hud();undoBtns();if(hovXY)hoverNow();else draw(false);return}
  if(tool)endTool();
});
