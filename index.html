<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6083C</title>
<style>
:root{
  --bg:#12100c; --panel:#1c1a15; --line:#332f26; --fg:#ece7dc; --dim:#9a9284;
  --acc:#d9a441; --ok:#5fa86e; --bad:#c9614f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
#gl{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl.drag{cursor:grabbing}
/* 标注的序号、尺寸线画在这张叠在上面的画布上；它不接鼠标，事件都落到 #gl */
#ov{position:fixed;inset:0;display:block;pointer-events:none}
.pane{position:fixed;background:color-mix(in srgb,var(--panel) 92%,transparent);
  border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
#side{top:12px;left:12px;width:250px;max-height:calc(100vh - 24px);overflow:auto;padding:12px}
/* 右上一列：标注面板在上（常驻），构件信息框在下（点了木料才出现）。
   手机上这一列不存在（display:contents），两块各自定位 */
#rcol{position:fixed;top:12px;right:12px;width:292px;max-height:calc(100vh - 24px);
  max-height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
#rcol>.pane{position:relative;pointer-events:auto}
#info{padding:12px;display:none;flex:none}
/* 信息框右上角的关闭按钮：点空白处也能关，但手机上空白少、初次用也不知道。
   按钮在信息框上、不在画布上，点它不会触发拾取。内容区 #infoBody 自己滚动，
   内容长时按钮不跟着滚走 */
#infoX{position:absolute;top:8px;right:8px;width:28px;height:28px;min-width:0;flex:none;
  padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border-color:transparent;color:var(--fg)}
#infoX svg{width:18px;height:18px}
#infoX:active{background:#26231c;color:var(--acc)}
#info h1{padding-right:26px}
#infoBody{max-height:46vh;overflow:auto}
#hud{bottom:12px;left:12px;padding:8px 12px;color:var(--dim);font-size:12px;
  max-width:calc(100vw - 328px)}         /* 不伸到右上那一列底下 */
h1{margin:0 0 2px;font-size:14px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:11px;margin-bottom:10px}
h2{margin:14px 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
  font-weight:600}
label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;font-size:12px}
@media (hover:hover){label:hover{color:var(--acc)}}
input[type=checkbox]{accent-color:var(--acc);margin:0}
.sw{width:11px;height:11px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4) inset}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button{flex:1;min-width:52px;background:#26231c;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 6px;font:inherit;font-size:11px;cursor:pointer}
@media (hover:hover){button:hover{border-color:var(--acc);color:var(--acc)}
  #infoX:hover{background:#26231c;color:var(--acc)}}
button.on{background:var(--acc);color:#1a1509;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:2px 0;vertical-align:top}
td:first-child{color:var(--dim);padding-right:8px;white-space:nowrap}
.issue{color:var(--bad);font-size:11px;margin-top:6px;line-height:1.45}
.pill{font-size:10px;padding:1px 6px;border-radius:20px;background:#2a2620;color:var(--dim)}
.pill.ok{background:#20301f;color:var(--ok)} .pill.bad{background:#33201c;color:var(--bad)}
.mini{color:var(--dim);font-size:11px}
/* ---------- 标注 ---------- */
#ann{padding:12px;display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
#annHead{display:flex;align-items:center;gap:8px;cursor:pointer}
#annHead h1{flex:1;margin:0}
#annFold{width:18px;height:18px;flex:none;color:var(--dim);transition:transform .15s}
#ann.fold #annFold{transform:rotate(-90deg)}
#ann.fold #annBody{display:none}
#annBody{display:flex;flex-direction:column;min-height:0;margin-top:4px}
#annList{overflow:auto;min-height:0;margin-top:10px;-webkit-user-select:none;user-select:none}      /* 按着 Shift 点是连选，别把字选中了 */
#annList input[type=text]{-webkit-user-select:text;user-select:text}
#annState{margin-top:8px;line-height:1.5}
#annState:empty{display:none}
/* 清单里一条一行：方格、色点、标题、是什么（槽口 / 尺寸 / 标注……）、眼睛，别的都不写。用户（2026-11-15 深夜）：
   「清单希望显示的信息更少一点，只显示标题和对象类型，其他都不显示。我希望这个清单上下能窄一些，在有限的空间内
   显示更多的清单」。在哪、多大、说明这些，鼠标停在那一行上看得到，选中了在右下角的设置里也有 */
.an{border:1px solid var(--line);border-radius:6px;margin-bottom:2px;background:#201d17}
.an.sel{border-color:var(--acc)}
/* 拖着排序：要落在这一行的前面 / 后面，那一侧画一条金线 */
.an.dropA{box-shadow:0 -2px 0 0 var(--acc)}
.an.dropB{box-shadow:0 2px 0 0 var(--acc)}
.anH{display:flex;gap:7px;padding:3px 4px 3px 8px;cursor:pointer;align-items:center}
.num{flex:none;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.anH .ty{flex:none}
/* 清单照待办清单的样子：每一条左边一个方格（多选），右边一个眼睛（隐藏）；能归到群组里，
   群组一行：全选的方格、折叠箭头、颜色、名字、条数、眼睛、改名。已完成的归到最下面那一组 */
/* 设置：选中的那一条、或者勾着的那几条能改的东西。电脑上固定在模型的右下角（清单那一列的左边），手机上在最底下。
   用户（2026-11-15 深夜）：「单击右侧清单不再展开选项，在模型右下角这个区域弹出设置，多选也是在这里弹出设置」；
   看了以后：「我希望右下角这个菜单能够窄一些，现在占用太多空间了」—— 宽从 400 收到 288（和清单那一列差不多宽），
   里面的东西跟着排紧：色点小一号、群组和它的名字排一行、行距收一点 */
#ed{right:316px;bottom:12px;z-index:4;width:288px;max-width:calc(100vw - 340px);max-height:calc(100vh - 70px);
  max-height:calc(100dvh - 70px);overflow:auto;padding:8px 10px 10px}
#ed[hidden]{display:none}
#ed .anE{padding:0;border-top:0}
#ed .row{margin-top:6px}
#ed .row button{min-width:0;padding:5px 2px}
#ed .fld{margin-top:6px}
#ed .fld.gi{flex-direction:row;align-items:center;gap:8px}
#ed .fld.gi select{flex:1;width:auto;min-width:0}
#ed .cols{gap:6px;margin-top:8px}
#ed .cdot{width:18px;height:18px}
#ed .fg{grid-template-columns:repeat(3,1fr)}
#ed .fg .lab{grid-column:span 2}
#ed textarea{min-height:40px}
#ed .anL{padding:6px 0 0}
#ed .anM{padding:8px 0 0}
#ed select{width:100%;margin-top:6px;background:#15130f;color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font:inherit;font-size:12px}
#ed .fld select{margin-top:0}
#ed .row select{flex:1.5 1 0;min-width:0;width:auto;margin-top:0;padding:4px 6px}
.edH{display:flex;align-items:center;gap:8px;font-size:12px}
.edH b{flex:none}
.edH .mini{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edH button.ib{margin:-2px -4px -2px 0;color:var(--fg)}
.selE{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:6px;border-top:1px solid var(--line);
  font-size:12px;font-weight:600}
.selE .gn{cursor:pointer}
.selE .mini{margin-left:auto;font-weight:400}
.sec{margin-top:10px;font-size:11px;color:var(--acc)}
.gh .ck{margin:0 2px 0 6px}
.cols label.dn{font-size:11px;color:var(--dim)}
.ck{flex:none;width:15px;height:15px;margin:0;cursor:pointer}
button.ib{flex:none;min-width:0;width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border-color:transparent;color:var(--dim)}
button.ib svg{width:15px;height:15px;pointer-events:none}
button.ib.off{color:var(--bad)}
.anH>button.ib{margin:-3px 0}
.an.hid .t1,.an.hid .ty,.an.hid .num{opacity:.45}
.gh{display:flex;align-items:center;gap:4px;margin:8px 0 4px;padding:2px 0 2px 2px;border-radius:6px;font-size:12px;font-weight:600}
.gh.drop,#annList .gz.drop{outline:1px dashed var(--acc)}
.gh .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.gh .gc{flex:none;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.gh .gc.no{background:transparent;box-shadow:0 0 0 1px var(--dim) inset}
.gh.hid .gn,.gh.hid .gc{opacity:.45}
.gh .mini{font-weight:400}
.ge{margin:-2px 0 8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#201d17}
.ge .cols{margin-top:8px}
.gz{min-height:6px;border-radius:6px}
/* 群组（和「已完成」）下面的事项往里缩一格：方格对着组头上的折叠箭头；没分组的不缩。
   用户（2026-11-16，第二十六版）：「群组下面的事项前面加缩进」 */
.gz.in>.an{margin-left:20px}
/* 拖着群组排序：落在哪一组前面 —— 它的组头上面一条金线；后面 —— 这一组最底下一条金线（都是整宽，和事项那条缩进的分得开） */
.gh.dropA{box-shadow:0 -2px 0 0 var(--acc)}
.gh.dropB,.ge.dropB,.gz.dropB{box-shadow:0 2px 0 0 var(--acc)}
.fld{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin-top:8px;font-size:11px;color:var(--dim);cursor:default;padding:0}
.fld input[type=text],.fld select,.ge input[type=text],.vw input[type=text]{width:100%;background:#15130f;color:var(--fg);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px}
.fld input:focus,.fld select:focus,.ge input:focus,.vw input:focus{outline:none;border-color:var(--acc)}
.fld textarea{margin-top:0}
.cols.lock .cdot{opacity:.35}
/* 视角：俯视是自带的；三点定出来的一条一张小卡片。正用着的那个描金边，剖切深度的滑块跟在它下面 */
.vw{border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#201d17}
.vw.on{border-color:var(--acc)}
.vwH{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 8px}
.vwN{flex:1;min-width:0;padding:4px 0;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw.on .vwN{color:var(--acc)}
.vwC{padding:2px 8px 8px}
.vwC.top{padding:8px 0 0}
.vwL{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--dim)}
.vwR{display:flex;align-items:center;gap:6px}
.vwR input[type=number]{flex:none;width:68px;background:#15130f;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
.vwR input[type=number]:focus{outline:none;border-color:var(--acc)}
.anL{display:flex;flex-direction:column;gap:3px;padding:0 8px 8px 36px}
.anL a{color:var(--acc);overflow-wrap:anywhere}
.t1{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an.done .t1{text-decoration:line-through;color:var(--dim)}
.anM{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 8px 36px}
.anM:empty{display:none}
.th{position:relative;width:48px;height:48px;border-radius:6px;border:1px solid var(--line);
  cursor:pointer;background:#000;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 9px;border-radius:14px;
  border:1px solid var(--line);background:#26231c;font-size:11px;cursor:pointer}
.chip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{flex:none;width:18px;height:18px;min-width:0;padding:0;border-radius:50%;font-size:12px;line-height:1}
.th .mx{position:absolute;top:-7px;right:-7px}
.anE{padding:0 8px 8px;border-top:1px solid var(--line)}
textarea,.anE input[type=number],.lk input{width:100%;background:#15130f;color:var(--fg);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px}
textarea{display:block;min-height:54px;resize:vertical;margin-top:8px}
textarea:focus,.anE input:focus{outline:none;border-color:var(--acc)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.fg label,.fg .lab{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:0;font-size:11px;
  color:var(--dim);cursor:default}
.fg .two{display:flex;gap:6px}
.cols{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}
/* 八个色点：平时一圈细边（黑色那个在深色面板上也认得出），选中的外面套一个白环 */
.cdot{width:20px;height:20px;min-width:0;flex:none;padding:0;border-radius:50%;border:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.cdot.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #fff}
/* 连续尺寸各点的读数表 */
.dtw{max-height:168px;overflow:auto;margin-top:6px}
.dt th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;padding:2px 0}
.dt td{vertical-align:middle;font-size:11px;font-variant-numeric:tabular-nums}
.dt td:last-child{width:24px;text-align:right}
.dt .mx{display:inline-flex;align-items:center;justify-content:center}
/* 撤销 / 重做（标注面板标题行里） */
button.ic{flex:none;min-width:0;width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center}
button.ic svg{width:15px;height:15px}
button.go{border-color:var(--acc);color:var(--acc)}
/* 放标注时的提示条：一排选项，放不下就换行 */
#hud.tool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--fg);
  left:274px;min-width:300px;max-width:calc(100vw - 590px)}       /* 夹在左边侧栏和右上那一列之间 */
#hud.tool .br{flex-basis:100%;height:0}
#hud.tool .tip{color:var(--dim)}
#hud.tool button.inl{margin-left:0}
#hud.tool input.len{width:76px;background:#15130f;color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:2px 6px;font:inherit;font-size:12px}
#hud.tool input.len:focus{outline:none;border-color:var(--acc)}
.cols .dn{margin-left:auto}
.lk{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lk[hidden]{display:none}
.lk button{flex:none}
button.del{color:var(--bad)}
button.inl{flex:none;min-width:0;padding:2px 8px;margin-left:6px}
button:disabled,input:disabled{opacity:.5;cursor:default}
/* 浮在屏幕上的三个开关（电脑上在右边那一列的左边，手机上在左上第二、三、四个）：
   只读 —— 亮着 = 只能看，不能改；动态视角 —— 亮着 = 点清单里的一条就回到做它时的视角；
   说明的总开关 —— 亮着 = 有信息开着 */
#togs{position:fixed;top:12px;right:316px;z-index:3;display:flex;gap:8px;pointer-events:none}
#togs>button{position:relative;pointer-events:auto;display:flex;align-items:center;gap:6px;height:34px;min-width:0;flex:none;
  padding:0 11px;font-size:12px;color:var(--dim)}
#togs>button.on{background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--acc);border-color:var(--acc)}   /* 亮着：描金边、金字，不整块涂黄 */
#togs>button[hidden]{display:none}
/* 只读：做东西的、改东西的都收起来（.eo = 只在可编辑时才有的） */
body.ro .eo{display:none!important}
/* 分享：给对方可编辑的一份，还是只读的一份 */
#shareBox{margin-top:6px;padding:2px 8px 8px;border:1px solid var(--line);border-radius:8px;background:#201d17}
#shareBox[hidden]{display:none}
#shareBox .sh{display:flex;align-items:center;gap:6px;margin-top:6px}
#shareBox .sh b{flex:none;width:48px;font-size:12px}
#shareBox .mini{margin-top:6px;line-height:1.5}
/* 只读时右下角那一块：只是看 */
.anV .vT{margin-top:8px;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.anV .vX{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lbC img,#lbC video{max-width:100%;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);display:block}
#lbT{color:var(--fg);font-size:12px}
#lbX{position:absolute;top:10px;right:10px;width:44px;height:44px;min-width:0;flex:none;padding:0;
  display:flex;align-items:center;justify-content:center}
#lbX svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:30;display:none;
  max-width:min(440px,calc(100vw - 32px));background:#2a2620;color:var(--fg);border:1px solid var(--acc);
  border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5}
/* 手机（窄屏，或触屏为主的设备）：侧栏默认收起，左上角按钮展开/收起；
   勾选行、按钮加大，手指好点 */
#tog{display:none}
#tog .i-x{display:none}
body.side-open #tog .i-menu{display:none}
body.side-open #tog .i-x{display:inline}
@media (max-width:760px),(pointer:coarse){
  /* 左上角那四个钮（侧栏、说明、动态视角、只读）36 见方。用户（2026-11-16，第二十二版）：「左上角四个按钮稍微
     小一些」—— 原来 44 */
  #tog{display:flex;align-items:center;justify-content:center;top:12px;left:12px;z-index:3;
    width:36px;height:36px;min-width:0;flex:none;padding:0}
  #tog svg{width:20px;height:20px}
  #side{display:none;top:56px;width:min(260px,calc(100vw - 24px));
    max-height:calc(100vh - 68px);max-height:calc(100dvh - 68px);z-index:2}
  body.side-open #side{display:block}
  /* 右上那一列拆开：信息框回到右上角（最高到半屏，别伸到底下的清单后面）；事项面板贴在屏幕底下 */
  html,body{overscroll-behavior:none}                                /* 在清单上划到头，别把整页带着走 / 拉出刷新 */
  #rcol{display:contents}
  #rcol>.pane{position:fixed}
  #info{top:12px;right:12px;width:min(262px,calc(100vw - 116px))}
  #infoBody{max-height:calc(50vh - 48px);max-height:calc(50dvh - 48px)}
  #togs{left:56px;right:auto;flex-direction:row-reverse}             /* 说明的开关在第二个，动态视角、只读排它后面 */
  #togs>button{width:36px;height:36px;padding:0;justify-content:center}
  #togIt,#togVt,#togRt{display:none}
  /* 事项面板：一直在屏幕底下，最高占三分之一（可编辑时上面多了做东西的按钮，放到一半）；标题那一行点一下

/* ---------- 小型向量/矩阵 ---------- */
const V={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
 cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
 norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]},
 dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2]};
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2);
 return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]}
/* 正交投影：视高取 dist·tan(fov/2)，与透视在目标距离处的视高一致，
   切换投影时画面大小不跳，滚轮缩放的手感也不变 */
function orthoM(hh,asp,n,f){const hw=hh*asp;
 return [1/hw,0,0,0, 0,1/hh,0,0, 0,0,2/(n-f),0, 0,0,(f+n)/(n-f),1]}
function lookAt(eye,ctr,up){const z=V.norm(V.sub(eye,ctr)),x=V.norm(V.cross(up,z)),y=V.cross(z,x);
 return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
  -V.dot(x,eye),-V.dot(y,eye),-V.dot(z,eye),1]}
function mul(a,b){const o=new Array(16);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}
 return o}

/* ---------- 由 panel 局部几何生成世界顶点 ---------- */
/* 文件里存的是每块板的局部几何 + 一个摆位，同一根木料只出现一次；
   世界顶点在这里现场生成，省下的体积是数量级的。 */
const pieces=[], tris=[], edges=[];
const GP=[],GN=[],GC=[],GI=[],GE=[];
let center=[0,0,0], radius=1000, bb=[1e18,1e18,1e18,-1e18,-1e18,-1e18];

D.panels.forEach((P,pi)=>{
  const t=P.tr, ox=t[0],oy=t[1],oz=t[2],ux=t[3],uy=t[4],nx=t[5],ny=t[6];
  const T=(x,y,z)=>[ox+ux*x+nx*y, oy+uy*x+ny*y, oz+z];
  /* 绕向：轮廓环在 (x,z) 里逆时针、按 lo 反序 / hi 正序 / 侧面 lo→hi 排顶点，
     lo 在小 y 时局部法线全部朝里；已就位板的嵌入是左手系（MiTek 立面从室外
     看，det<0），镜像一次正好翻成朝外 —— 所以 det<0 时 lo 取小 y，det>0
     （平铺）时反过来。以前条件写反，2865 根的面全部朝里：正对镜头的面被剔除、
     看到的是构件内侧的远面，像玻璃箱子，被挡住的边线全露出来（拉撑板后面
     1mm 的挡块轮廓就这样透到板面上）。 */
  const mir=(ux*ny-uy*nx)<0;
  P.m.forEach((m,mi)=>{
    const ki=m[0],lab=m[1],x=m[2],y=m[3],z=m[4],dx=m[5],dy=m[6],dz=m[7];
    const len=m[8],plies=m[9],mat=m[10],r0=m[11]||0,prof=m[12];
    const rec=Math.abs(r0), enc=r0<0;     // enc：整根被前面那根包住，六个面都退
    /* 显示收缩：贴面接触的构件（双柱并排、横档顶柱侧、搭接板压柱）各面
       内退 0.5mm —— 共面深度打架和"贴合面边线透出"就此消失；与别的构件
       互相穿插、被排在后面的（rec 级，见 _recess_levels）只在墙厚方向每级再退
       2.5mm；整根被前面那根包住的（enc）六个面都退、藏进去。只影响显示，JSON/GLB 里的尺寸原样。 */
    const S=0.5, ex=Math.min(S+(enc?2.5*rec:0),dx/4), ey=Math.min(S+2.5*rec,dy/4),
          ez=Math.min(S+(enc?2.5*rec:0),dz/4);
    let ring;
    if(prof&&prof.length>=3){
      let mnx=1e18,mxx=-1e18,mnz=1e18,mxz=-1e18;
      prof.forEach(p1=>{mnx=Math.min(mnx,p1[0]);mxx=Math.max(mxx,p1[0]);
                        mnz=Math.min(mnz,p1[1]);mxz=Math.max(mxz,p1[1]);});
      const cx=(mnx+mxx)/2, cz=(mnz+mxz)/2;
      const kx=(mxx-mnx)>2?1-2*ex/(mxx-mnx):1, kz=(mxz-mnz)>2?1-2*ez/(mxz-mnz):1;
      ring=prof.map(p1=>[cx+(p1[0]-cx)*kx, cz+(p1[1]-cz)*kz]);
    }else{
      ring=[[x+ex,z+ez],[x+dx-ex,z+ez],[x+dx-ex,z+dz-ez],[x+ex,z+dz-ez]];
    }
    let a2=0;
    for(let i=0;i<ring.length;i++){const p1=ring[i],q=ring[(i+1)%ring.length];a2+=p1[0]*q[1]-q[0]*p1[1];}
    if(a2<0) ring=ring.slice().reverse();
    const n=ring.length;
    const yA=y+ey, yB=y+dy-ey;
    const yl=mir?yA:yB, yh=mir?yB:yA;
    const lo=ring.map(p1=>T(p1[0],yl,p1[1])), hi=ring.map(p1=>T(p1[0],yh,p1[1]));
    const faces=[lo.slice().reverse(),hi];
    for(let i=0;i<n;i++) faces.push([lo[i],lo[(i+1)%n],hi[(i+1)%n],hi[i]]);
    const c=D.colors[ki], id=pieces.length;
    const tri0=tris.length, e0=edges.length, v0=GP.length/3;
    for(const f of faces){
      const u=V.sub(f[1],f[0]), v=V.sub(f[2],f[0]), nn=V.norm(V.cross(u,v));
      const base=GP.length/3;
      for(const p1 of f){
        GP.push(p1[0],p1[1],p1[2]); GN.push(nn[0],nn[1],nn[2]);
        GC.push(c[0]/255,c[1]/255,c[2]/255); GI.push(id+1); GE.push(0,0);
        for(let k=0;k<3;k++){ if(p1[k]<bb[k])bb[k]=p1[k]; if(p1[k]>bb[k+3])bb[k+3]=p1[k]; }
      }
      for(let k=1;k<f.length-1;k++) tris.push(base,base+k,base+k+1);
      /* 面的周界线 —— 实体叠边线用，木料棱角一根根看得清 */
      for(let k=0;k<f.length;k++) edges.push(base+k,base+(k+1)%f.length);
    }
    pieces.push({id,pi,mi,lv:P.lv,ki,lab,len,plies,mat,x,y,z,dx,dy,dz,
                 tri0,tri1:tris.length,e0,e1:edges.length,v0,v1:GP.length/3});
  });
});
center=[(bb[0]+bb[3])/2,(bb[1]+bb[4])/2,(bb[2]+bb[5])/2];
radius=Math.max(1,Math.hypot(bb[3]-bb[0],bb[4]-bb[1],bb[5]-bb[2])/2);

/* 爆炸方向：每块板离整体中心的水平方向，逐顶点写进 attribute */
pieces.forEach(p=>{
  const P0=D.panels[p.pi];
  const dx=P0.tr[0]-center[0], dy=P0.tr[1]-center[1], L=Math.hypot(dx,dy)||1;
  for(let i=p.v0;i<p.v1;i++){ GE[i*2]=dx/L; GE[i*2+1]=dy/L; }
});

function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
 gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));return p}

const VS=`
attribute vec3 aPos; attribute vec3 aNrm; attribute vec3 aCol; attribute float aId;
attribute vec2 aExp;
uniform mat4 uMVP; uniform float uExpK; uniform float uZBias;
uniform vec3 uEye; uniform vec3 uFwd; uniform float uOrtho; uniform vec4 uClip;
varying vec3 vNrm; varying vec3 vCol; varying vec3 vId; varying float vCut;
vec3 idcol(float i){ float r=mod(i,256.0); float g=mod(floor(i/256.0),256.0);
  float b=floor(i/65536.0); return vec3(r,g,b)/255.0; }
void main(){
  vec3 p=aPos; p.xy += aExp*uExpK;
  /* 剖切：这一点在剖切面的哪一侧、离多远（米 —— 手机上片元里的数只有十几位精度，毫米数太大）。
     在这里按高精度算好再插值；不剖切时传进来的是 (0,0,0,1)，处处是负的 */
  vCut=(dot(p,uClip.xyz)-uClip.w)*0.001;
  /* 边线沿视线朝镜头挪 uZBias 毫米 —— 屏幕位置不变，只是深度靠前一点：
     赢得过自己贴着的面，赢不过前方哪怕几毫米厚的实体，被挡住的线就看不见。
     偏置按世界毫米给、不随远近变（旧做法在裁剪空间加常数，透视时远处
     等于几十毫米，墙骨边线从别的构件后面透出来；polygonOffset 按面斜率
     放大，侧立窄面后面的线全漏）。 */
  if(uZBias>0.0){ p += (uOrtho>0.5 ? -uFwd : normalize(uEye-p))*uZBias; }
  gl_Position=uMVP*vec4(p,1.0);
  vNrm=aNrm; vCol=aCol; vId=idcol(aId);
}`;
const FS=`
precision mediump float;
varying vec3 vNrm; varying vec3 vCol; varying vec3 vId; varying float vCut;
uniform float uPick; uniform float uLine;
void main(){
  if(vCut>0.0) discard;
  if(uPick>0.5){ gl_FragColor=vec4(vId,1.0); return; }
  if(uLine>0.5){ gl_FragColor=vec4(0.22,0.17,0.11,1.0); return; }
  vec3 n=normalize(vNrm);
  float d=max(dot(n,normalize(vec3(0.45,0.25,0.86))),0.0);
  float a=0.42+0.58*d;
  float rim=pow(1.0-abs(n.z),2.0)*0.06;
  vec3 c=vCol*a+rim;
  gl_FragColor=vec4(c,1.0);
}`;

function saveVis(){
  if(!visReady) return;
  const t=JSON.stringify({hl:D.levels.filter((_,i)=>!showLv.has(i)),hk:D.kinds.filter((_,i)=>!showKd.has(i))});
  if(t===visLast) return;
  visLast=t;try{localStorage.setItem(VISKEY,t)}catch(_){}}
function loadVis(){
  let o=null;try{o=JSON.parse(localStorage.getItem(VISKEY)||'null')}catch(_){}
  if(!o||!Array.isArray(o.hl)||!Array.isArray(o.hk)) return false;
  showLv.clear();D.levels.forEach((n,i)=>{if(!o.hl.includes(n))showLv.add(i)});
  showKd.clear();D.kinds.forEach((n,i)=>{if(!o.hk.includes(n))showKd.add(i)});
  syncFilters();rebuild();draw(false);return true}
function rebuild(){
  const arr=[], earr=[];
  pieces.forEach(p=>{
    if(!showLv.has(p.lv)||!showKd.has(p.ki))return;
    for(let t=p.tri0;t<p.tri1;t++) arr.push(tris[t]);
    for(let t=p.e0;t<p.e1;t++) earr.push(edges[t]);
  });
  idxCount=arr.length; edgeCount=earr.length;
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
    uintOK?new Uint32Array(arr):new Uint16Array(arr),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bEIdx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
    uintOK?new Uint32Array(earr):new Uint16Array(earr),gl.STATIC_DRAW);
  rebuildMarks();
  hud();
  saveVis();
}

/* ---------- 相机 ---------- */
/* 边线深度偏置（世界毫米）：必须小于最薄的遮挡物 —— 拉撑板 7.5~10mm */
const EDGE_BIAS_MM=2.0;
/* roll：镜头绕着自己的视线转了多少。平常是 0（屏幕的上方就是模型的 Z）；三点定出来的视角，X 轴不一定是水平的，
   要让它朝右就得转这一下。wire / edgesOn：线框、边线的开关早先在侧栏里，用户（2026-11-15）让去掉了 ——
   固定成「实体 + 边线」 */
let yaw=-0.9,pitch=0.62,roll=0,dist=radius*2.6,pan=[0,0,0],wire=false,expK=0,
    orthoOn=true,edgesOn=true;
/* 剖切面：CN·P > CD 的那一半不画。CN 是单位向量 —— 现在用着的那个视角的 Z 轴（朝着看的人），所以剖切面
   往屏幕里推就是 CD 变小；P 是画出来的位置（带爆炸）。clipOn=false：不剖切 */
let CN=[0,0,1], CD=0, clipOn=false;
function setClip(n,d){clipOn=!!n; if(n){CN=n.slice();CD=d}}
function cutW(W){return clipOn&&W[0]*CN[0]+W[1]*CN[1]+W[2]*CN[2]>CD+1e-6}        // 这个世界点被切掉了
function eye(){
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  return [center[0]+pan[0]+dist*cp*Math.cos(yaw),
          center[1]+pan[1]+dist*cp*Math.sin(yaw),
          center[2]+pan[2]+dist*sp];
}
/* 模型在镜头前后占多深 —— dc：模型包围球的球心顺着视线离镜头多远（负的 = 在镜头后面），R：球的半径
   （爆炸开了跟着放大，再留一点余量）。远近裁剪面、正交下视线的起点都照它定。
   球心是模型的中心，不是镜头盯着的那一点：镜头绕着光标转、朝着光标缩放以后，盯着的那一点常常离模型
   中心一两个半径远。早先裁剪面照「盯着的那一点前后各 1.6 个半径」定，那时模型的一头就落到裁剪面外面，
   被斜着切掉一块 —— 用户看到的「特定视角产生破面」。 */
function depthSpan(){
  const cp=Math.cos(pitch), f=[-cp*Math.cos(yaw),-cp*Math.sin(yaw),-Math.sin(pitch)];       // 视线方向
  return {dc:dist-(pan[0]*f[0]+pan[1]*f[1]+pan[2]*f[2]), R:radius*1.03+expK*1.5+50};
}
function draw(pick){
  const w=cv.width,h=cv.height;
  gl.viewport(0,0,w,h);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clearColor(0.07,0.063,0.047,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const e=eye(), c=[center[0]+pan[0],center[1]+pan[1],center[2]+pan[2]];
  /* 远近裁剪面贴着模型包围球走（见 depthSpan）：深度缓冲的精度全花在有几何的地方。
     正交投影允许负的近平面 —— 裁剪槽直接包住整个模型，镜头贴得再近、转到哪个角度都不会切出破面；
     透视的近平面必须为正：镜头在球外面就贴着球的近端，钻进球里了就取一个小的正数（随距离缩小，
     但不超过半径的 2%，不然离得远的时候会把眼前的木料切掉）。 */
  const sp=depthSpan();
  const zn=orthoOn?sp.dc-sp.R
    :(sp.dc-sp.R>radius*0.002?sp.dc-sp.R:Math.max(radius*0.002,Math.min(dist*0.03,radius*0.02)));
  const zf=orthoOn?sp.dc+sp.R:Math.max(sp.dc+sp.R,zn*2);
  const proj=orthoOn?orthoM(dist*Math.tan(0.36),w/h,zn,zf)
                    :persp(0.72,w/h,zn,zf);
  const mvp=mul(proj,lookAt(e,c,camBasis().y));
  gl.useProgram(P);
  gl.uniformMatrix4fv(loc.mvp,false,new Float32Array(mvp));
  gl.uniform1f(loc.pick,pick?1:0);
  if(clipOn) gl.uniform4f(loc.clip,CN[0],CN[1],CN[2],CD); else gl.uniform4f(loc.clip,0,0,0,1);
  gl.uniform1f(loc.expk,expK);
  const fw=[c[0]-e[0],c[1]-e[1],c[2]-e[2]], fl=Math.hypot(fw[0],fw[1],fw[2])||1;
  gl.uniform3f(loc.eye,e[0],e[1],e[2]);
  gl.uniform3f(loc.fwd,fw[0]/fl,fw[1]/fl,fw[2]/fl);
  gl.uniform1f(loc.ortho,orthoOn?1:0);
  const bind=(b,l,n)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l,n,gl.FLOAT,false,0,0)};
  bind(bPos,loc.pos,3); bind(bNrm,loc.nrm,3); bind(bCol,loc.col,3); bind(bId,loc.id,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,bExp);
  gl.enableVertexAttribArray(loc.exp);
  gl.vertexAttribPointer(loc.exp,2,gl.FLOAT,false,0,0);
  gl.uniform1f(loc.line,0); gl.uniform1f(loc.zbias,0);
  gl.depthFunc(gl.LEQUAL);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);
  gl.drawElements(wire&&!pick?gl.LINES:gl.TRIANGLES,idxCount,
    uintOK?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,0);
  if(!pick&&edgesOn&&!wire){
    gl.uniform1f(loc.line,1); gl.uniform1f(loc.zbias,EDGE_BIAS_MM);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bEIdx);
    gl.drawElements(gl.LINES,edgeCount,uintOK?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,0);
    gl.uniform1f(loc.line,0); gl.uniform1f(loc.zbias,0);
  }
  /* 标注：高亮块接着画进同一张深度图，序号和尺寸线画到上面那张 2D 画布 */
  if(!pick){ MVP=mvp; drawMarks(mvp,e,[fw[0]/fl,fw[1]/fl,fw[2]/fl]); drawOv(); }
}
function resize(){const r=Math.min(devicePixelRatio||1,2);
 cv.width=innerWidth*r; cv.height=innerHeight*r;
 cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
 ov.width=cv.width; ov.height=cv.height;
 ov.style.width=cv.style.width; ov.style.height=cv.style.height; draw(false)}
addEventListener('resize',resize);

/* ---------- 交互 ---------- */
/* 鼠标：左键拖拽旋转，Shift/右键/中键拖拽平移，滚轮缩放，点击拾取。旋转绕着按下去时光标指着的
   那一点（见 pointAt；转的时候那一点上画着一个小圈），缩放以光标指着的那一点为中心（那一点在屏幕上不动）。
   触屏：单指旋转；双指捏合缩放（以两指中点为中心，指下那一点不动），两指一起挪
   = 平移（画面跟着手指走）；轻点拾取。pointer 事件按 pointerId 记住每根手指，
   每次只算增量，手指数变化时画面不跳。双指之后剩下的那根手指不再旋转、直到
   全部抬起 —— 两指抬起总有先后，不然俯视时画面会被带歪一点。 */
const TOUCH=matchMedia('(pointer: coarse)').matches;   // 触屏为主：底栏提示换成手势
const ptrs=new Map();               // pointerId -> {x,y}
let gest=null, raf=0;               // gest：一次按下到全部抬起
function redraw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw(false)}); }
/* 画面跟着手走：屏幕上往右 dx、往下 dy 个像素，目标点就往左、往上挪（s：每像素合多少毫米） */
function panBy(dx,dy,s){ const b=camBasis();
  for(let i=0;i<3;i++) pan[i]+=(-dx*b.x[i]+dy*b.y[i])*s; }
function zoomTo(d){ return Math.max(radius*0.05,Math.min(radius*40,d)); }
function two(){ const [p,q]=ptrs.values();
  return {x:(p.x+q.x)/2, y:(p.y+q.y)/2, d:Math.hypot(p.x-q.x,p.y-q.y)||1}; }
/* ---- 转、缩都以光标（手指）指着的那一点为准，不是画面中心 ---- */
/* 屏幕上这一点指着模型的哪里（世界坐标）—— 转、缩的中心。
   框架是空的：一堵墙九成是立柱之间的缝，光标多半落在缝里，正下方要么是背景，要么是从缝里露出来的、后面
   几米远的另一堵墙。早先「压着木料取木料那一点，压着空白取镜头目标点那么深」：在缝里按下去转，转的中心在
   几米开外，眼前这堵墙被甩着走 —— 用户（2026-11-14）：「有的时候它就是不能以鼠标光标位置为中心去旋转…
   我总觉得它那个旋转中心会跑掉」。实测整栋楼的画面上，压着木料的点有两到七成是从别的板的缝里露出来的，
   空白的点有两到六成紧挨着木料。现在按「光标落在哪块板上」来取：
   ① 光标附近（四分之一个画面以内，pivR）露着木料的那些板里，光标落在谁的范围里（压着它的木料，或者
      落在它的缝、洞里）—— 取最靠前的那一块，中心就是光标在这块板面上的那一点；
   ② 正下方压着木料、它前面没有这样的板：木料表面上那一点（和原来一样）；
   ③ 正下方是空白、紧挨着（PIVN 个像素以内）有比 ① 更靠前的木料：视线上和那根木料一样深的那一点
      （光标贴在前面那堵墙的墙头、墙边外面一点，背后正好是另一堵墙的缝）；
   ④ 光标不在哪块板的范围里、附近有木料：视线上和最近那根木料一样深的那一点；
   ⑤ 附近什么都没有：落在哪块板的大洞里，就取那块板面上的一点；真在模型外面，取视线上和模型中心一样深的
      那一点（不再取镜头目标点 —— 转过、缩过以后它不知道漂到哪去了）。
   「附近」定得大：拉近以后立柱的间距在屏幕上就是一两百个像素；要拉近到一条缝比半个画面还宽、站在缝中间
   指着后面的木料，取的才是后面那根。PIVT：前面的至少靠前这么多毫米才算数（墙角上两块板挨着）。 */
const PIVT=150, PIVN=24;
function pivR(){return Math.max(90,Math.min(240,Math.round(Math.min(cv.clientWidth||innerWidth,cv.clientHeight||innerHeight)/4)))}
function pointAt(cx,cy){
  const nb={r:pivR(),rn:PIVN}, p=pickPiece(cx,cy,nb), ray=rayAt(cx,cy), cb=camBasis(), dz=V.dot(ray.d,cb.z),
        at=t=>[0,1,2].map(k=>ray.o[k]+ray.d[k]*t),
        tAt=X=>(V.dot(V.sub(cb.e,ray.o),cb.z)-V.dot(V.sub(cb.e,X),cb.z))/dz,     // 光标这条视线上，和 X 一样深的地方
        surf=(q,x,y)=>L2W(q.pi,rawHit(q,x,y).raw);                              // 木料 q 在屏幕 (x,y) 处的表面
  let t0=null, tb=null, tn=null;
  if(p){const P0=surf(p,cx,cy); t0=V.dot(V.sub(P0,ray.o),ray.d);
    /* 视线没打中这根木料的准确外形（rawHit 退回了木料中心）：取这块板的面 */
    const a=at(t0); if(Math.hypot(a[0]-P0[0],a[1]-P0[1],a[2]-P0[2])>1){const t=boxT(p.pi,ray); t0=t!=null?t:tAt(P0)}}
  const pis=new Set(); (nb.ids||[]).forEach(id=>{const q=pieces[id-1]; if(q&&!(p&&q.pi===p.pi)) pis.add(q.pi)});
  pis.forEach(pi=>{const t=boxT(pi,ray); if(t!=null&&(tb==null||t<tb)) tb=t});
  if(t0!=null) return at(tb!=null&&tb<t0-PIVT?tb:t0);
  (nb.close||[]).forEach(c=>{const q=pieces[c.id-1]; if(!q) return; const t=tAt(surf(q,c.x,c.y)); if(tn==null||t<tn) tn=t});
  if(tb!=null) return at(tn!=null&&tn<tb-PIVT?tn:tb);
  if(tn!=null) return at(tn);
  if(nb.near){const q=pieces[nb.near.id-1]; if(q) return at(tAt(surf(q,nb.near.x,nb.near.y)))}
  D.panels.forEach((_,pi)=>{if(!panelShown(pi)) return; const t=boxT(pi,ray); if(t!=null&&(tb==null||t<tb)) tb=t});
  return at(tb!=null?tb:(V.dot(V.sub(cb.e,ray.o),cb.z)-depthSpan().dc)/dz);
}
/* 抓住世界点 P：记下它在镜头里的位置 s —— 从目标点量起，往右、往上、朝着镜头各多远 */
function grab(P){const cb=camBasis(), r=[P[0]-center[0]-pan[0],P[1]-center[1]-pan[1],P[2]-center[2]-pan[2]];
  return {P,s:[V.dot(r,cb.x),V.dot(r,cb.y),V.dot(r,cb.z)]}}
/* 镜头转过（或者 s 改过）以后，把目标点挪到让 P 在镜头里还是 s 那个位置：P 在屏幕上就没动 */
function hold(g){const cb=camBasis();
  pan=[0,1,2].map(i=>g.P[i]-g.s[0]*cb.x[i]-g.s[1]*cb.y[i]-g.s[2]*cb.z[i]-center[i])}
/* 绕着抓住的那一点转（没抓就是绕目标点） */
function orbitBy(dx,dy,g){
  /* 镜头带着滚转（三点定出来的视角）时，屏幕上的左右、上下不再是模型的水平、竖直：先把拖的方向换回去，
     顺着屏幕上地平线的方向拖才是绕着 Z 转 */
  if(roll){const c=Math.cos(roll), s=Math.sin(roll), x=dx*c+dy*s; dy=dy*c-dx*s; dx=x}
  yaw-=dx*0.006; pitch=Math.max(-1.5706,Math.min(1.5706,pitch+dy*0.006)); if(g) hold(g)}
/* 以屏幕上 (cx,cy) 指着的那一点为中心，把镜头距离缩放到 nd：那一点在屏幕上不动。正交投影只和屏幕
   位置有关；透视还要看那一点有多深，所以得知道它是哪一点（P，没给就现找） */
function zoomAt(cx,cy,nd,P){
  nd=zoomTo(nd); if(nd===dist) return;
  if(orthoOn){const r=cv.getBoundingClientRect(), u=2*dist*Math.tan(0.36)/(cv.clientHeight||innerHeight), k=nd/dist;
    panBy((k-1)*(cx-r.left-r.width/2),(k-1)*(cy-r.top-r.height/2),u);dist=nd;return}
  const g=grab(P||pointAt(cx,cy)), a=dist-g.s[2], b=nd-g.s[2];        // 镜头到那一点有多深：缩之前、缩之后
  dist=nd; if(a>1e-6&&b>1e-6){g.s[0]*=b/a;g.s[1]*=b/a;hold(g)}
}
cv.addEventListener('pointerdown',e=>{
  stopFly();                        // 手一碰就停下正在转过去的镜头
  if(e.isPrimary) ptrs.clear();     // 新的一次手势（顺手清掉万一漏收 up 的残留）
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  cv.classList.add('drag');
  if(ptrs.size===1||!gest)
    gest={moved:0,multi:ptrs.size>1,mouse:e.pointerType==='mouse',b:e.button};
  else{gest.multi=true; if(gest.orb){gest.orb=0;redraw()}}      // 单指转着又放下一根手指：不转了，中心那个小圈收掉
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p||!gest){
    if(tool&&!ptrs.size&&e.pointerType==='mouse'){setShift(e.shiftKey);setCtrl(guideKey(e));hoverReq(e.clientX,e.clientY)}
    return;
  }
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(ptrs.size===1){
    p.x=e.clientX; p.y=e.clientY;
    if(gest.multi) return;
    gest.moved+=Math.abs(dx)+Math.abs(dy);
    if(gest.mouse&&(gest.b!==0||e.shiftKey)) panBy(dx,dy,dist*0.0016);
    else{
      /* 转第一下之前，先看光标（手指）指着哪：整个这一拖都绕着那一点转 */
      if(!gest.pv) gest.pv=grab(pointAt(e.clientX-dx,e.clientY-dy));
      if(gest.moved>=(gest.mouse?4:10)) gest.orb=1;      // 真转起来了（不是点一下时手抖）：把中心画出来
      orbitBy(dx,dy,gest.pv); }
    redraw(); return;
  }
  const a=two(); p.x=e.clientX; p.y=e.clientY; const b=two();
  /* 目标深度上每个 CSS 像素对应的世界毫米 —— 与 draw() 的视高 dist·tan(0.36) 同源，
     正交下处处精确，透视下在目标深度上精确 */
  const u=2*dist*Math.tan(0.36)/(cv.clientHeight||innerHeight);
  panBy(b.x-a.x, b.y-a.y, u);
  const nd=zoomTo(dist*a.d/b.d), k=nd/dist, r=cv.getBoundingClientRect();
  panBy((k-1)*(b.x-r.left-r.width/2), (k-1)*(b.y-r.top-r.height/2), u);
  dist=nd; redraw();
});
/* 手指轻点画布：pointerup 那一刻就把事办了（开大图、出构件信息……），可浏览器随后还要在同一个位置补一下 click（触屏
   轻点都有这一下）。刚办的事要是正好在那个位置盖上来一样能点的东西，这一下就落在它身上 —— 大图是「点一下就关」，
   于是刚开就关；构件信息框的 × 在右上角，点那儿的木料也一样。用户（2026-11-16，第二十四版）：「在手机端查看图片
   标注有点问题：点一下不显示，图片好像一闪而过，一定要长按才能显示」（长按不补 click，所以留得住）。
   tapEcho：刚在画布上点的那一下的位置和时刻。紧跟着（半秒之内）落在那儿附近的头一下 click 吞掉 —— 只吞一下；
   发给画布自己的（没有东西盖上来）、落在别处的、来晚了的，都不吞。鼠标点也记：有的浏览器把那一下发给盖上来的东西 */
let tapEcho=null;
addEventListener('click',e=>{
  const g=tapEcho; if(!g) return;
  tapEcho=null;
  if(e.target===cv||performance.now()-g.t>500||Math.hypot(e.clientX-g.x,e.clientY-g.y)>30) return;
  e.stopPropagation();e.preventDefault();
},true);
function lift(e,cancel){
  if(!ptrs.delete(e.pointerId)) return;
  if(ptrs.size) return;             // 还有手指在屏上，手势没完
  cv.classList.remove('drag');
  const g=gest; gest=null;
  if(g&&g.orb) redraw();            // 转完了：中心那个小圈收掉
  if(!cancel&&g&&!g.multi&&g.moved<(g.mouse?4:10)){
    if(g.mouse){setShift(e.shiftKey);setCtrl(guideKey(e))}   // Shift+点 = 锁定方向（Shift+拖 才是平移）；Ctrl+点 = 引导点
    tapEcho={x:e.clientX,y:e.clientY,t:performance.now()};

let fb=null,tex=null,rb=null;
/* 屏幕上这一点是哪根木料（没有就是 null）。只画进离屏的拾取缓冲，屏幕上的画面不动。
   给了 nb={r} 就连周围 r 个像素的一小块一起读回来：nb.ids = 这一圈里露出来的木料，
   nb.shows(id,x,y) = 屏幕上 (x,y) 附近露没露出 id 这一根（取点吸附用），nb.near = 离得最近的那一根，
   nb.close = 紧挨着的那几根（转的中心用，见 pointAt） */
function pickPiece(cx,cy,nb){
  /* CSS 像素 -> 画布像素用画布自己的实际比例：缩放比变了而画布还没重排时，
     现查 devicePixelRatio 会读到别处的像素（点这根、选中那根） */
  const w=cv.width,h=cv.height, rx=w/(cv.clientWidth||w), ry=h/(cv.clientHeight||h);
  if(!fb){fb=gl.createFramebuffer();tex=gl.createTexture();rb=gl.createRenderbuffer();}
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);
  draw(true);
  const px=new Uint8Array(4), X=Math.round(cx*rx), Y=Math.round(h-cy*ry);
  gl.readPixels(X,Y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  if(nb){
    const R=Math.ceil(nb.r*rx)+2, x0=Math.max(0,X-R), y0=Math.max(0,Y-R),
          w2=Math.min(w,X+R+1)-x0, h2=Math.min(h,Y+R+1)-y0, k=Math.max(2,Math.round(rx*2.5));
    nb.ids=new Set(); nb.shows=()=>false; nb.near=null; nb.close=[];
    if(w2>0&&h2>0){
      const buf=new Uint8Array(w2*h2*4), at=i=>buf[i]+buf[i+1]*256+buf[i+2]*65536;
      gl.readPixels(x0,y0,w2,h2,gl.RGBA,gl.UNSIGNED_BYTE,buf);
      /* nb.near：这一圈里离 (cx,cy) 最近的那个露着木料的像素 —— 哪一根、在屏幕上哪（CSS 像素）；
         nb.close（给了 nb.rn 才有）：紧挨着的 rn 个像素以内露着的每一根木料，各自离得最近的那个像素 */
      /* 转的中心要读的那一块大（四分之一个画面）：高分屏上隔一个像素扫一个，少扫四分之三 —— 只是数有哪些
         板、哪根离得近，差一个像素不要紧。取点吸附的那一小块照样一个不落 */
      let bd=1e18, last=0; const rn2=nb.rn?nb.rn*rx*nb.rn*rx:-1, cl=new Map(), stp=nb.rn&&rx>=1.5?2:1;
      /* 背景读出来不是 0：拾取缓冲清成了画面的底色，读回来是一个比木料总数大得多的数 —— 不是木料的都跳过 */
      for(let b=0;b<h2;b+=stp) for(let a=0;a<w2;a+=stp){const id=at((b*w2+a)*4); if(!id||id>pieces.length) continue;
        if(id!==last){nb.ids.add(id);last=id}
        const u=a+x0-X, v=b+y0-Y, dd=u*u+v*v;
        if(dd<bd){bd=dd; nb.near={id,x:(X+u)/rx,y:(h-Y-v)/ry}}
        if(dd<=rn2){const c=cl.get(id); if(!c||dd<c.dd) cl.set(id,{id,dd,x:(X+u)/rx,y:(h-Y-v)/ry})}}
      nb.close=Array.from(cl.values());
      nb.shows=(id,sx,sy)=>{const u=Math.round(sx*rx)-x0, v=Math.round(h-sy*ry)-y0;
        for(let b=Math.max(0,v-k);b<=Math.min(h2-1,v+k);b++)
          for(let a=Math.max(0,u-k);a<=Math.min(w2-1,u+k);a++) if(at((b*w2+a)*4)===id) return true;
        return false};
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const id=px[0]+px[1]*256+px[2]*65536;   // 0 = 背景
  return id?(pieces[id-1]||null):null;
}

    const num=(lab,empty)=>{add(el('span','tip',lab));const i=add(el('input','len'));

    add(el('b',null,dm?(tool.chain?'连续测量':'单次测量'):tool.type==='view'?'三点定义视角':TYPES[tool.type])).style.color='var(--acc)';
    const gd=guideTool();
    if(gd&&guided()){
      /* 有引导点：读数从最后一个引导点量起，这一排管引导线 —— 锁方向、输入长度、退一个引导点 */
      add(el('span','tip',TOUCH?'引导线：从引导点量起。关掉「引导点」再点 = 真正的点；开着再点 = 再加一个引导点；也可以锁定方向后输入长度'
        :'引导线：从引导点量起。松开 Ctrl 再点 = 真正的点；按着 Ctrl 点 = 再加一个引导点；也可以输入长度；按住 Shift 锁定方向'));

      add(el('span','tip','锁定'));
      [-1,0,1,2].forEach(k=>{const lk=tool.gLock>=0?tool.gLock:-1, x=btn(k<0?'不锁':AXL[k],()=>{tool.gLock=k;tool.gS=-1;again()},lk===k?'on':'');

        ['r','a','ar'].forEach(k=>btn(SHOWN[k],()=>{tool.show=k;if(!tool.edit)chainShow=k;again()},
          tool.show===k?'on':''));
        add(el('span','br'))}

        add(el('span','tip',TOUCH?'放置尺寸线：点一下要放的位置（贴哪个面在下面选）'
          :'放置尺寸线：往哪根轴的方向拉就贴哪个面，拉到要放的位置点一下确定'));

        btn('跟着光标',()=>{tool.plane=-1;again()},tool.plane<0?'on':'');
        placeCands().cand.forEach((c,j)=>btn(c.name,()=>{tool.plane=j;again()},tool.plane===j?'on':''));
        num('拉出');
        if(!tool.replace)btn('上一步',undo);
      }else{
        add(el('span','tip',!n?'点第 1 个点（自动吸附顶点、中点、圆心、垂足、边线）'

          :'接着点下一个点，或者输入这一段的长度；点完按「完成」'+(TOUCH?'':'（或回车）')));
        if(n===1&&!tool.dir){add(el('span','tip','锁定'));
          [-1,0,1,2].forEach(k=>{const x=btn(k<0?'不锁':AXL[k],()=>{tool.lock=k;again()},tool.lock===k?'on':'');
            if(k>=0&&tool.lock!==k)x.style.color=AXC[k]});

      cutAxNames(c).forEach(x=>{const e=btn(x.name,()=>{c.lock=x.ai;c.sLock=-1;again()},c.lock===x.ai?'on':'');
        if(c.lock!==x.ai)e.style.color=AXC[x.j]});
      if(NARROW.matches) add(el('span','br'));          // 手机上另起一行，「长度」两个字别和输入框拆开

      const n=tool.pts.length;
      add(el('span','tip',(n===0?'点第 1 个点：原点':n===1?'点第 2 个点：X 轴朝哪（看过去时朝右）':'点第 3 个点：Y 轴朝哪（看过去时朝上）')
        +'。自动吸附顶点、中点、边线'));
      if(n)btn('撤销上一点',undo);
    }else add(el('span','tip',TIPS[tool.type]));
    /* 标注平常点在模型上；和哪儿都不相干的（整套图纸之类）可以不定位置，只进清单 */
    if(tool.type==='note') btn('不定位置',()=>{endTool();addAnn({type:'note'})});
    /* 引导点的开关：亮着的时候点下去的是引导点。电脑上按住 Ctrl 就是它亮着；手机上没有 Ctrl，点它 */
    if(gd){const x=btn('引导点',()=>{tool.gBtn=!tool.gBtn;again()},guideOn()?'on':'');x.id='gBtn';
      x.title='亮着的时候点下去的是引导点，不是真正的点；读数从引导点量起。电脑上按住 '+(MAC?'⌘':'Ctrl')+' 也一样'}
    btn('取消',()=>endTool());
    return;
  }
  const vis=pieces.filter(p=>showLv.has(p.lv)&&showKd.has(p.ki)).length;
  const bad=D.panels.filter(p=>!p.ok).length;
  const np=D.panels.filter(p=>!p.placed).length;
  document.getElementById('hud').innerHTML=
    `显示 ${vis} / ${pieces.length} 根构件 · ${D.panels.length} 块 panel`+
    (bad?` · <span style="color:var(--bad)">${bad} 块对账未通过</span>`:'')+
    (np?` · ${np} 块未定位（平铺）`:'')+
    (TOUCH?' &nbsp;|&nbsp; 单指旋转 · 双指捏合缩放、拖动平移 · 轻点查看构件'
          :' &nbsp;|&nbsp; 拖拽旋转 · 滚轮缩放 · Shift+拖拽平移 · 点击查看构件');
}

/* ====================== 标注 ======================
   用户在模型上做的记号：哪根木料尺寸不对（构件高亮）、哪里开槽口、哪里开洞、
   量一段尺寸、写一句话、挂一份资料。都存在数组 A 里。

   画法分两层 ——
   · 高亮块（构件高亮 / 槽口 / 开洞）是 WebGL 里的半透明实体：有深度，贴在木料表面，
     被别的木料挡住就看不见，选中没选中一个样；只有开洞不做深度测试再画一遍 —— 洞开在

   脚本开头抓下来的原始页面）另存一份 —— 还是单个文件，发给别人打开就带着标注。

/* 面板里的东西统称「事项」（面板的标题、导出 / 导入、提示里都这么叫）；「标注」只是其中一种，和槽口、开洞平级。
   用户（2026-11-16，第二十二版）：「列表左上角标注二字改为事项，这和开槽等平级的标注选项重名，不太好」；
   「导出标注、导入标注也改为导出事项、导入事项」。代码和注释里说的「标注」多半还是老叫法（= 事项） */

const COLORS=['#3ddc5f','#2f9bff','#ffd60a','#ff9f0a','#ff453a','#19d3c5','#c56bff','#111111'];
const CNAME=['绿','蓝','黄','橙','红','青','紫','黑'];

/* 已完成的：统一显示成浅灰，很淡。DONEA 叠层（线、字）淡到几成；高亮块 / 槽口 / 开洞的面再乘 DONEF、棱线淡到 DONEL。
   用户（2026-11-15 晚）：「已完成的透明度还要降低，现在看着太清楚」—— 原来是 .55 / .55 / 棱线不淡。
   浅灰盖在深色木料上，两成就挺显眼：高亮块的面现在只有一成多（.5 × DONEF） */

    if(ext(wa)>150) g.off=Math.round(h.raw[wa]-b.lo[wa]);   // 板材、宽料按点的位置放，窄料居中
  }

function cutBox(an){
  const p=pieceOf(an); if(!p) return;
  const b=boxOf(p), g=an.g, lo=[0,0,0], hi=[0,0,0], rnd=an.type==='hole'&&g.sh==='c';
  let hw=rnd?g.d/2:g.W/2;
  if(an.type==='notch'){
    /* 槽：从起点 s0 朝 sg 那头开 L 长；宽度方向以起点为中，出了木料往里收，比木料宽就是整宽 */
    const e=b.hi[g.wa]-b.lo[g.wa]; hw=Math.min(g.W,e)/2;
    g.pos=r1(g.s0+g.sg*g.L/2); g.off=r1(Math.max(hw,Math.min(e-hw,g.o0)))}

  lo[g.wa]=b.lo[g.wa]+g.off-hw; hi[g.wa]=b.lo[g.wa]+g.off+hw;
  if(an.type==='hole'){lo[g.na]=b.lo[g.na]; hi[g.na]=b.hi[g.na]}

  an.pt=r3(pt);

/* ----- 槽能跨木料 ----- */
/* 用户（2026-11-15，第二十版）：「现在开槽不能跨板件。比如我在 VTP 上开槽，从一个 VTP 延伸到另一个，它不能贯穿，光标拉不过去。」
   原先槽的长度卡在起点那根木料里。现在槽还是记在起点那根木料上（pn / mi、起点 s0、朝哪头 sg、长 L），只是长度
   可以出它的头，一直开到接在它头上的木料里去 —— 哪些木料算「接着」见 cutRun。 */
/* 两块板的轴对不对得齐（同一块板，或者转了 90° 的整数倍）：对得齐，一块板里的盒子换到另一块里还是盒子 */
const ALN=new Map();
function aligned(pj,pi){ if(pj===pi) return true;
  const key=pj*100000+pi; let v=ALN.get(key);
  if(v===undefined){const u=D2L(pi,dirW(pj,AX[0])), L=Math.hypot(u[0],u[1])||1;
    v=Math.max(Math.abs(u[0]),Math.abs(u[1]))/L>.9995;ALN.set(key,v)}
  return v}
/* 木料 q 的外形，写成板 pi 里的坐标（同一块板就是它自己的）。两块板的轴对不齐（斜着的）给 null */
function boxIn(q,pi){
  const b=boxOf(q); if(q.pi===pi) return b; if(!aligned(q.pi,pi)) return null;
  const a=W2L0(pi,L2W0(q.pi,b.lo)), c=W2L0(pi,L2W0(q.pi,b.hi));
  return {lo:[0,1,2].map(k=>Math.min(a[k],c[k])),hi:[0,1,2].map(k=>Math.max(a[k],c[k]))}}
/* 槽顺着木料 P 的 k 轴开，一路能开到哪：P 自己，加上一根接一根接在它头上的木料 —— 开槽的那个面（na / ns）和它
   齐平（差不到 1.5，各自取整留下的 1 毫米不算）、槽的中心线压在它身上、头尾挨着（缝不到 2）。别的板上的木料
   也算，只要两块板的轴对得齐（数值都按没爆炸的位置算）。
   l：起点（P 那块板里的坐标）；vis：只算显示着的木料（做的时候 —— 藏起来的不该被开到）。
   返回 lo / hi（P 那块板里 k 轴上的范围）和 ps：这一路上的木料，各带着自己在 P 那块板里的外形 b，P 打头 */
function cutRun(P,k,na,ns,l,vis){
  const pi=P.pi, b=boxOf(P), wa=3-na-k, f0=ns>0?b.hi[na]:b.lo[na], ps=[{p:P,b}], pool=[];
  let lo=b.lo[k], hi=b.hi[k];
  pieces.forEach(q=>{ if(q===P||(vis&&!(showLv.has(q.lv)&&showKd.has(q.ki)))) return;
    const qb=boxIn(q,pi); if(!qb) return;
    if(Math.abs((ns>0?qb.hi[na]:qb.lo[na])-f0)>1.5||l[wa]<qb.lo[wa]-.5||l[wa]>qb.hi[wa]+.5) return;
    pool.push({p:q,b:qb})});
  for(let more=true;more;){more=false;
    for(let i=pool.length-1;i>=0;i--){const qb=pool[i].b;
      if(qb.lo[k]>hi+2||qb.hi[k]<lo-2) continue;
      lo=Math.min(lo,qb.lo[k]);hi=Math.max(hi,qb.hi[k]);ps.push(pool[i]);pool.splice(i,1);more=true}}
  return {lo,hi,ps};

/* 做槽的时候用的那一份：同一根木料、同一个面、同一条线上的，定了起点以后只找一遍（c 是 tool.cut） */
function cutRunOf(c,P,k,na,ns,l){
  const key=[P.pi,P.mi,k,na,ns,Math.round(l[3-na-k]*2)].join(':');
  if(!c.runs)c.runs={};

/* 这条槽开在哪几根木料上：它自己那根打头；槽长出了它的头，接着开过去的那几根顺着槽的方向排在后面。
   每一项：p 木料、b 它的外形（槽那块板里的坐标）、lo / hi 槽在它身上的那一段（长向）。
   槽没出自己那根的头就不去找别的；找过的记着（盒子变了才重找） */
const CUTP=new WeakMap();
function cutParts(an){
  const P=an.type==='notch'?pieceOf(an):null; if(!P) return [];
  const g=an.g, b=boxOf(P), k=g.ax, lo=an.box[k], hi=an.box[k+3],
        me={p:P,b,lo:Math.max(lo,b.lo[k]),hi:Math.min(hi,b.hi[k])};
  if(lo>=b.lo[k]-.5&&hi<=b.hi[k]+.5) return [me];

  const l=[0,0,0]; l[k]=b.lo[k]+g.s0; l[g.wa]=b.lo[g.wa]+(num(g.o0)?g.o0:g.off); l[g.na]=g.ns>0?b.hi[g.na]:b.lo[g.na];
  const r=cutRun(P,k,g.na,g.ns,l,false).ps.filter(x=>x.p!==P)
    .map(x=>({p:x.p,b:x.b,lo:Math.max(lo,x.b.lo[k]),hi:Math.min(hi,x.b.hi[k])})).filter(x=>x.hi-x.lo>.5)
    .sort((x,y)=>g.sg>0?x.b.lo[k]-y.b.lo[k]:y.b.hi[k]-x.b.hi[k]);
  r.unshift(me);CUTP.set(an,{key,r});return r;

/* 爆炸开的时候，跨了板的槽一块板一段、各跟着自己那块板走：每段在哪块板（pi）、那块板里的盒子（b，六个数）。
   没爆炸（各块板都在原位，画一整块就行）、没跨到别的板上：null */
function cutSegs(an){
  if(an.type!=='notch'||!(expK>0)) return null;
  const ps=cutParts(an), pi=PIDX.get(an.pn); if(ps.length<2||ps.every(x=>x.p.pi===pi)) return null;
  const k=an.g.ax, by=new Map();
  ps.forEach(x=>{const q=by.get(x.p.pi)||{pi:x.p.pi,lo:1e18,hi:-1e18};
    q.lo=Math.min(q.lo,x.lo);q.hi=Math.max(q.hi,x.hi);by.set(x.p.pi,q)});
  const L=Array.from(by.values()).sort((x,y)=>x.lo-y.lo);
  L[0].lo=an.box[k];L[L.length-1].hi=an.box[k+3];              // 两头出了木料的那一截，归最挨着的那一段
  return L.map(q=>{const a=an.box.slice(0,3), c=an.box.slice(3);a[k]=q.lo;c[k]=q.hi;
    if(q.pi===pi) return {pi,b:a.concat(c)};
    const u=W2L0(q.pi,L2W0(pi,a)), v=W2L0(q.pi,L2W0(pi,c));
    return {pi:q.pi,b:[0,1,2].map(j=>Math.min(u[j],v[j])).concat([0,1,2].map(j=>Math.max(u[j],v[j])))}});

/* ---------- 尺寸 ---------- */
/* 一条尺寸 = 一串测点 pts（各自记着板号和板内坐标）+ 量的方向 dir + 尺寸线放在哪（ov / off）。
   dir：量的方向，记成第一个点所在那块板的局部方向（板挪了它跟着走）；做的时候吸的是模型的
   X / Y / Z，也可以是斜的；没有 dir 就是两个点之间的直线距离。有方向时每个测点都垂直投到
   「过第一个点、顺着 dir」的那条线上，读数是投影点之间的距离。第一个点是 0 点：绝对读数 =
   到它的距离，相对读数 = 相邻两点的间距。
   ov / off：尺寸线从量的那条线往 ov 方向（也是板局部的写法，垂直于量的方向）拉出去 off 毫米。
   是做的时候用户手动放的 —— 贴哪个面、拉多远都由他定。前几版的数据没有 ov：画的时候照老办法
   自动摆（见 drawDim）。
   数值一律按没爆炸的位置算，画的时候才跟着爆炸走。 */
function dirW(pi,d){const t=D.panels[pi].tr;return V.norm([t[3]*d[0]+t[5]*d[1],t[4]*d[0]+t[6]*d[1],d[2]])}
/* 世界方向 -> 板局部的单位方向（存进标注用） */
function dirL(pi,u){const d=D2L(pi,u), L=Math.hypot(d[0],d[1],d[2])||1;return d.map(x=>Math.round(x/L*1e5)/1e5)}
/* 板 pi 里的方向 d 是不是正好顺着模型的某根轴：是就返回 0/1/2（X/Y/Z），斜的（或没有方向）返回 -1 */
function axW(pi,d){if(!d) return -1;const u=dirW(pi,d);return [0,1,2].findIndex(k=>Math.abs(u[k])>.9995)}
/* P 测点；M 测点落在量的那条线上的位置；N 再拉出去之后的位置（尺寸线上）—— 都是世界坐标。
   u 量的方向，w 拉出的方向；val 各点到第一个点的距离（带正负，顺着 u 为正）；ord 按 val
   从小到大的点序；len 首尾之间的总长 */
function dimGeo(an,exploded){
  const pis=an.pts.map(q=>PIDX.get(q.pn)); if(pis.some(i=>i==null)) return null;
  const P0=an.pts.map((q,i)=>L2W0(pis[i],q.p)), P=exploded?an.pts.map((q,i)=>L2W(pis[i],q.p)):P0;
  const u0=an.dir?dirW(pis[0],an.dir):V.norm(V.sub(P0[1],P0[0])),
        u=(an.dir||!exploded)?u0:V.norm(V.sub(P[1],P[0]));
  const val=P0.map(q=>V.dot(V.sub(q,P0[0]),u0));
  let w=[0,0,0];
  if(an.ov){const v=dirW(pis[0],an.ov), c=V.dot(v,u), q=[v[0]-u[0]*c,v[1]-u[1]*c,v[2]-u[2]*c];
    if(Math.hypot(q[0],q[1],q[2])>.05) w=V.norm(q)}
  const f=an.off||0;
  const M=P.map(q=>{const k=V.dot(V.sub(q,P[0]),u);return [0,1,2].map(j=>P[0][j]+u[j]*k)}),
        N=M.map(q=>[q[0]+w[0]*f,q[1]+w[1]*f,q[2]+w[2]*f]);
  const ord=val.map((_,i)=>i).sort((a,b)=>val[a]-val[b]);

function anchorW(an){
  if(!placed(an)) return null;
  if(an.type==='dim'){const g=dimGeo(an,true); if(!g) return null;
    const a=g.N[g.ord[0]], b=g.N[g.ord[g.ord.length-1]];return [0,1,2].map(k=>(a[k]+b[k])/2)}
  const pi=PIDX.get(an.pn); return pi==null?null:L2W(pi,an.pt);

function annVisible(an){
  if(!placed(an)||effHidden(an)) return false;
  const pi=PIDX.get(an.pn); if(pi==null||!showLv.has(D.panels[pi].lv)) return false;
  if(an.type==='dim') return an.pts.every(q=>PIDX.has(q.pn));
  const p=pieceOf(an); return !(p&&!showKd.has(p.ki));
}

/* ---------- 高亮块：WebGL 半透明实体 ---------- */
const VS2=`
attribute vec3 aPos; attribute vec4 aCol;
uniform mat4 uMVP; uniform vec3 uEye; uniform vec3 uFwd; uniform float uOrtho; uniform float uZBias; uniform vec4 uClip;
varying vec4 vCol; varying float vCut;
void main(){
  /* 与边线同一招：沿视线朝镜头挪几毫米，贴在木料表面的块赢得过那个面，
     赢不过前面隔着的另一根木料 */
  vec3 p=aPos+(uOrtho>0.5 ? -uFwd : normalize(uEye-aPos))*uZBias;
  gl_Position=uMVP*vec4(p,1.0); vCol=aCol; vCut=(dot(aPos,uClip.xyz)-uClip.w)*0.001;
}`;
const FS2=`
precision mediump float;
varying vec4 vCol; varying float vCut; uniform float uA;
void main(){ if(vCut>0.0) discard; gl_FragColor=vec4(vCol.rgb,vCol.a*uA); }`;
const P2=prog(VS2,FS2);
const loc2={pos:gl.getAttribLocation(P2,'aPos'),col:gl.getAttribLocation(P2,'aCol'),
  mvp:gl.getUniformLocation(P2,'uMVP'),eye:gl.getUniformLocation(P2,'uEye'),
  fwd:gl.getUniformLocation(P2,'uFwd'),ortho:gl.getUniformLocation(P2,'uOrtho'),
  zbias:gl.getUniformLocation(P2,'uZBias'),clip:gl.getUniformLocation(P2,'uClip'),
  a:gl.getUniformLocation(P2,'uA')};
const MK={pos:[],col:[],lpos:[],lcol:[],rng:[],nf:0,nl:0,
  bP:gl.createBuffer(),bC:gl.createBuffer(),bLP:gl.createBuffer(),bLC:gl.createBuffer()};
/* 沿 na 轴拉伸的棱柱：ring 是另外两个轴（序号从小到大）上的截面，w0..w1 是 na 轴上的范围 */
function mkPrism(pi,ring,w0,w1,na,col,al,sides,la){
  const o=[0,1,2].filter(k=>k!==na), n=ring.length;
  const pt=(q,w)=>{const r=[0,0,0];r[na]=w;r[o[0]]=q[0];r[o[1]]=q[1];return L2W(pi,r)};
  const lo=ring.map(q=>pt(q,w0)), hi=ring.map(q=>pt(q,w1));
  const tri=(a,b,c)=>{for(const q of [a,b,c]){MK.pos.push(q[0],q[1],q[2]);MK.col.push(col[0],col[1],col[2],al)}};
  const ln=(a,b)=>{for(const q of [a,b]){MK.lpos.push(q[0],q[1],q[2]);MK.lcol.push(col[0],col[1],col[2],la==null?1:la)}};
  for(let k=1;k<n-1;k++){tri(lo[0],lo[k],lo[k+1]);tri(hi[0],hi[k],hi[k+1])}
  for(let i=0;i<n;i++){const j=(i+1)%n;
    tri(lo[i],lo[j],hi[j]);tri(lo[i],hi[j],hi[i]);ln(lo[i],lo[j]);ln(hi[i],hi[j]);if(sides)ln(lo[i],hi[i])}
}
/* 整根木料罩上一层：按它的准确轮廓四面各放大 1mm（k：面再淡多少、la：棱线淡到几成 —— 已完成的） */
function hlPrism(p,col,k,la){
  const b=boxOf(p), cx=(b.lo[0]+b.hi[0])/2, cz=(b.lo[2]+b.hi[2])/2,
        kx=1+2/Math.max(1,b.hi[0]-b.lo[0]), kz=1+2/Math.max(1,b.hi[2]-b.lo[2]);
  mkPrism(p.pi,ringOf(p).map(q=>[cx+(q[0]-cx)*kx,cz+(q[1]-cz)*kz]),b.lo[1]-1,b.hi[1]+1,1,col,.5*(k||1),true,la);
}
/* 标注变了、过滤变了、爆炸量变了、点中的构件换了，都要重排一次（块的世界坐标带着爆炸位移）。
   颜色照 effColor：已完成的是浅灰，面和棱线都淡下去（DONEF / DONEL） */
function rebuildMarks(){
  MK.pos.length=MK.col.length=MK.lpos.length=MK.lcol.length=0; MK.rng=[];
  A.forEach(an=>{
    const r={f0:MK.pos.length/3,l0:MK.lpos.length/3};
    if(annVisible(an)&&an.type!=='dim'&&!isNote(an)){
      const pi=PIDX.get(an.pn), col=hex(effColor(an)), dk=an.done?DONEF:1, la=an.done?DONEL:1;
      if(an.type==='hl'){const p=pieceOf(an); if(p) hlPrism(p,col,dk,la)}
      else{
        const b=an.box, g=an.g, e=.5;
        if(an.type==='hole'&&g.sh==='c'){
          const o=[0,1,2].filter(k=>k!==g.na), c0=(b[o[0]]+b[o[0]+3])/2, c1=(b[o[1]]+b[o[1]+3])/2, ring=[];
          for(let k=0;k<24;k++){const t=k/24*6.283185307;ring.push([c0+Math.cos(t)*g.d/2,c1+Math.sin(t)*g.d/2])}
          mkPrism(pi,ring,b[g.na]-e,b[g.na+3]+e,g.na,col,.7*dk,false,la);
        }else (cutSegs(an)||[{pi,b}]).forEach(sg=>{const b=sg.b;        // 跨了板的槽，爆炸开的时候一块板一段
          mkPrism(sg.pi,[[b[0]-e,b[2]-e],[b[3]+e,b[2]-e],[b[3]+e,b[5]+e],[b[0]-e,b[5]+e]],b[1]-e,b[4]+e,1,col,.62*dk,true,la)});
      }
    }
    r.f1=MK.pos.length/3; r.l1=MK.lpos.length/3; MK.rng.push(r);
  });
  /* 点中的那根构件的临时高亮（见 pickP）：排在最后，不算哪一条标注的 */
  if(pickP&&showLv.has(pickP.lv)&&showKd.has(pickP.ki)&&hlOf(pickP)<0) hlPrism(pickP,hex(COLORS[DEFCOL.hl]));      // 本来就高亮着的不再罩一层
  MK.nf=MK.pos.length/3; MK.nl=MK.lpos.length/3;
  const up=(b,d)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.DYNAMIC_DRAW)};
  up(MK.bP,MK.pos); up(MK.bC,MK.col); up(MK.bLP,MK.lpos); up(MK.bLC,MK.lcol);
}
function drawMarks(mvp,e,fw){
  if(!MK.nf&&!MK.nl) return;
  gl.useProgram(P2);
  gl.uniformMatrix4fv(loc2.mvp,false,new Float32Array(mvp));
  gl.uniform3f(loc2.eye,e[0],e[1],e[2]); gl.uniform3f(loc2.fwd,fw[0],fw[1],fw[2]);
  gl.uniform1f(loc2.ortho,orthoOn?1:0);
  if(clipOn) gl.uniform4f(loc2.clip,CN[0],CN[1],CN[2],CD); else gl.uniform4f(loc2.clip,0,0,0,1);
  const bind=(bp,bc)=>{
    gl.bindBuffer(gl.ARRAY_BUFFER,bp); gl.enableVertexAttribArray(loc2.pos);
    gl.vertexAttribPointer(loc2.pos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bc); gl.enableVertexAttribArray(loc2.col);
    gl.vertexAttribPointer(loc2.col,4,gl.FLOAT,false,0,0)};
  /* 画布的 alpha 保持 1（只混颜色），不然半透明处会透出网页底色 */
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE);
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  bind(MK.bP,MK.bC); gl.uniform1f(loc2.zbias,3); gl.uniform1f(loc2.a,1); gl.drawArrays(gl.TRIANGLES,0,MK.nf);
  bind(MK.bLP,MK.bLC); gl.uniform1f(loc2.zbias,4); gl.drawArrays(gl.LINES,0,MK.nl);
  /* 开洞不做深度测试再画一遍：洞开在木头里面，隔着木料也要看得见。高亮、槽口照实画 —— 被挡住的
     那几面看不见，选中没选中一个样（早先选中的那条也这样透着画，刚做出来的总是「透明」的） */
  gl.disable(gl.DEPTH_TEST);

   放到一起，一个视角对应一个剖切深度。拉动滑块，往 Z 轴的负方向走，也就是往屏幕内走。」
   VW 里一条 = {id,name,o,x,y,clip}：o 原点、x / y 两根轴（单位向量，互相垂直；都是没爆炸的世界坐标），
   Z = x × y，朝着看的人。clip：剖切深度（毫米）—— 剖切面离原点那个面多远，往屏幕里为正、往外为负；
   null = 不剖切。俯视是自带的（'top'）：原点是模型的零点、X 朝右、Y 朝上，它的剖切记的是标高 topClip。
   同一时间只用一个视角（vwOn）：剖切面是它的，滑块跟在它的名字下面。镜头转开了它也还是「用着的」——
   切完了转着看，和早先的「剖切高度」一样。换视角只转方向，不动远近、不挪位置。 */
const VR=new Map();                   // 每个视角：模型顺着它的 Z 轴从哪到哪（不带爆炸；算一次存着）
function vwGet(id){return id==='top'?null:(VW.find(v=>v.id===id)||null)}
function vwAxes(v){return v?{o:v.o,x:v.x,y:v.y,z:V.cross(v.x,v.y)}:{o:[0,0,0],x:[1,0,0],y:[0,1,0],z:[0,0,1]}}
function normView(o){
  if(!o||typeof o!=='object'||!o.id||!v3(o.o)||!v3(o.x)||!v3(o.y)) return null;
  const x=V.norm(o.x), d=V.dot(o.y,x), y0=[0,1,2].map(i=>o.y[i]-x[i]*d);
  if(Math.hypot(o.x[0],o.x[1],o.x[2])<1e-6||Math.hypot(y0[0],y0[1],y0[2])<1e-6) return null;
  const r5=a=>a.map(q=>Math.round(q*1e6)/1e6||0);
  return {id:String(o.id),name:String(o.name||'').replace(/\s+/g,' ').trim().slice(0,40)||'视角',
    o:r3(o.o),x:r5(x),y:r5(V.norm(y0)),clip:num(o.clip)?Math.round(o.clip):null}}
/* 三个点（没爆炸的世界坐标）定一个视角；定不出来（两点重合、三点共线）返回 null */
function viewFrom(O,PX,PY){
  const a=V.sub(PX,O), b=V.sub(PY,O), la=Math.hypot(a[0],a[1],a[2]), lb=Math.hypot(b[0],b[1],b[2]);
  if(la<1||lb<1) return null;
  const c=V.cross(a,b); if(Math.hypot(c[0],c[1],c[2])/(la*lb)<.02) return null;
  return normView({id:nid(),name:freeName('视角',VW.map(v=>v.name)),o:O,x:a,y:b})}
/* 面朝这个视角看过去，镜头要转成什么样：yaw / pitch 定 Z 朝哪，roll 让 X 朝右。Z 正好竖直时（看地面、
   看天花）yaw 定不出来，直接照 X 取 */
function vwAngles(a){
  const z=a.z, p=Math.max(-1.5706,Math.min(1.5706,Math.asin(Math.max(-1,Math.min(1,z[2]))))),
        y=Math.hypot(z[0],z[1])<1e-4?Math.atan2(-a.x[0],a.x[1]):Math.atan2(z[1],z[0]),
        x0=[-Math.sin(y),Math.cos(y),0], y0=[-Math.sin(p)*Math.cos(y),-Math.sin(p)*Math.sin(y),Math.cos(p)];
  return {yaw:y,pitch:p,roll:Math.atan2(V.dot(a.x,y0),V.dot(a.x,x0))}}
/* 模型顺着这个视角的 Z 轴占到哪（爆炸开了跟着放宽） */
function vwRange(id){
  let r=VR.get(id); const z=vwAxes(vwGet(id)).z;
  if(!r){let lo=1e18, hi=-1e18;
    for(let i=0;i<GP.length;i+=3){const s=GP[i]*z[0]+GP[i+1]*z[1]+GP[i+2]*z[2]; if(s<lo)lo=s; if(s>hi)hi=s}
    r={lo,hi};VR.set(id,r)}
  const k=expK*Math.hypot(z[0],z[1]);return {lo:Math.floor(r.lo-k)-1,hi:Math.ceil(r.hi+k)+1}}
/* 现在用着的视角的剖切面顺着它的 Z 轴在哪（null = 不剖切）；zc → 这个视角记的那个数 */
function vwZc(id){const v=vwGet(id);
  if(!v) return topClip;
  return v.clip==null?null:V.dot(v.o,vwAxes(v).z)-v.clip}
function vwSetZc(id,zc){const v=vwGet(id);
  if(!v) topClip=zc==null?null:Math.round(zc);
  else v.clip=zc==null?null:Math.round(V.dot(v.o,vwAxes(v).z)-zc)}
/* 把用着的那个视角的剖切面交给画图的（CN / CD） */
function vwClip(){
  if(vwOn!=='top'&&!vwGet(vwOn)) vwOn='top';
  const zc=vwZc(vwOn); if(zc==null) setClip(null); else setClip(vwAxes(vwGet(vwOn)).z,zc)}
/* 剖切深度写成什么：俯视写标高；别的写离原点那个面多远、在哪一侧 */
function vwClipText(id){const v=vwGet(id), c=v?v.clip:topClip;
  if(c==null) return '全部';
  if(!v) return '标高 '+c+' mm';
  return c===0?'正在原点那个面':c>0?'原点往里 '+c+' mm':'原点往外 '+(-c)+' mm'}
/* 用这个视角：镜头转过去面朝着它。keep：绕着它的原点转，原点在屏幕上不动（刚定出来的时候 —— 眼前这一块别跑）；
   不然绕着画面中间盯着的那一点转。远近都不动 */
function vwGo(id,keep){
  if(id!=='top'&&!vwGet(id)) id='top';
  vwOn=id;vwClip();renderViews();
  const a=vwAxes(vwGet(id)), g=vwAngles(a);
  let t=[center[0]+pan[0],center[1]+pan[1],center[2]+pan[2]];
  if(keep){const sv=[yaw,pitch,roll,pan], h=grab(a.o);
    yaw=g.yaw;pitch=g.pitch;roll=g.roll;hold(h);t=[center[0]+pan[0],center[1]+pan[1],center[2]+pan[2]];
    yaw=sv[0];pitch=sv[1];roll=sv[2];pan=sv[3]}
  flyTo(g.yaw,g.pitch,dist,t,g.roll);
}
/* 视角改了（新建、改名、删除）：进撤销；剖切深度拉来拉去不算一步，只是存下来 */
function vwChanged(){record();dirty=true;vwClip();renderViews();autosave();state();undoBtns();draw(false)}
let vwEdit='';                         // 正在改名的那个视角
function renderViews(){
  const host=document.getElementById('views');host.textContent='';
  document.getElementById('bTop').classList.toggle('on',vwOn==='top');
  /* 剖切深度那一块：一个滑块（最左 = 全部，往右 = 往屏幕里切）加一个能敲数的框 */
  const clipBox=(id,cls)=>{
    const v=vwGet(id), b=el('div','vwC'+(cls?' '+cls:'')), l=el('div','vwL'), r=el('div','vwR'),
          lab=el('span','mini',vwClipText(id)), sl=el('input'), ni=el('input'), rg=vwRange(id), zc=vwZc(id);
    l.appendChild(el('span',null,'剖切深度'));l.appendChild(lab);
    sl.type='range';sl.min='0';sl.max='1000';sl.step='1';
    sl.value=zc==null?0:Math.max(1,Math.min(1000,Math.round((rg.hi-zc)/(rg.hi-rg.lo)*1000)));
    sl.setAttribute('aria-label','剖切深度');
    ni.type='number';ni.step='10';ni.placeholder='全部';ni.inputMode='decimal';
    ni.title=v?'剖切面离原点那个面多远（毫米）：往屏幕里为正，往外为负；空着 = 不剖切':'剖切到的标高（毫米）；空着 = 不剖切';
    ni.setAttribute('aria-label',v?'剖切深度（毫米）':'剖切标高（毫米）');
    const cur=()=>v?v.clip:topClip, show=()=>{lab.textContent=vwClipText(id);vwClip();autosave();draw(false)};
    ni.value=cur()==null?'':cur();
    sl.oninput=()=>{const k=+sl.value;
      vwSetZc(id,k<=0?null:rg.hi-(rg.hi-rg.lo)*k/1000);ni.value=cur()==null?'':cur();show()};
    ni.oninput=()=>{const t=ni.value.trim(), x=parseFloat(t);
      if(t===''){if(v)v.clip=null;else topClip=null}
      else if(isFinite(x)){if(v)v.clip=Math.round(x);else topClip=Math.round(x)}
      else return;
      const z=vwZc(id);sl.value=z==null?0:Math.max(1,Math.min(1000,Math.round((rg.hi-z)/(rg.hi-rg.lo)*1000)));show()};
    r.appendChild(sl);r.appendChild(ni);b.appendChild(l);b.appendChild(r);return b};
  if(vwOn==='top') host.appendChild(clipBox('top','top'));
  VW.forEach(v=>{
    const on=v.id===vwOn, box=el('div','vw'+(on?' on':'')), h=el('div','vwH');box.dataset.id=v.id;
    if(!RO&&vwEdit===v.id){
      const inp=el('input');inp.type='text';inp.value=v.name;inp.maxLength=40;inp.setAttribute('aria-label','视角的名字');
      const done=ok=>{if(vwEdit!==v.id) return;vwEdit='';const s=inp.value.replace(/\s+/g,' ').trim();
        if(ok&&s&&s!==v.name){v.name=s;vwChanged()}else renderViews()};
      inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false)};
      inp.onblur=()=>done(true);
      h.appendChild(inp);setTimeout(()=>{try{inp.focus();inp.select()}catch(_){}},0);
    }else{
      const n=el('span','vwN',v.name);n.tabIndex=0;n.setAttribute('role','button');n.title='面朝这个视角看过去';
      n.onclick=()=>vwGo(v.id);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();vwGo(v.id)}};
      h.appendChild(n);
      if(!RO){h.appendChild(ibtn('pen','改名',()=>{vwEdit=v.id;renderViews()}));
        h.appendChild(ibtn('x','删除这个视角（删错了按撤销）',()=>{
          VW.splice(VW.indexOf(v),1);VR.delete(v.id);if(vwOn===v.id)vwOn='top';vwChanged()}))}
    }
    box.appendChild(h);
    if(on) box.appendChild(clipBox(v.id));
    host.appendChild(box)});
}

/* ---------- 放置 ---------- */
/* 尺寸怎么量（照 SketchUp 尺寸工具的路数）：
   · 两个工具，用哪个由用户自己点：「单次测量」两个点一条；「连续测量」第一个点是 0 点、
     第二个点定方向，再一个个往下点，「完成」或回车收住。标注上记着是哪一种（chain）。
   · 取点：点在模型上（自动吸附顶点 / 中点 / 圆心 / 垂足 / 边线）；第一个点之后也可以用鼠标
     指个方向，直接输入长度（毫米）回车 —— 那个点不在木料上，是算出来的。
   · 方向：轴 = 模型的 X / Y / Z，不画出来。落在顶点这类确定的点上就量到那个点；只是落在
     边线、面上或者空白处，鼠标又挨着一根轴，就顺着那根轴；按住 Shift（或提示条上的 X / Y /
     Z）锁在一根轴上，这时点哪里都只量它在这根轴上的那一份。
   · 点完以后还有一步「放置尺寸线」：移动鼠标把尺寸线从测点拉出来，贴哪个面（XY / XZ /
     YZ…）、拉多远都由用户定，点一下确定；也可以输入拉出的距离。程序不替他摆。 */
let chainShow='r', shiftOn=false;       // chainShow：连续测量的读数上次选的是哪种写法
function toolBtns(){document.querySelectorAll('[data-tool]').forEach(b=>
  b.classList.toggle('on',!!tool&&tool.btn===b.dataset.tool))}
/* t：按钮的名字 —— dim1 单次测量 / dimc 连续测量 / hl / notch / hole / note / doc。
   ed：拿已有的一条尺寸接着做 —— place 为真是重新放它的尺寸线，否则是给连续尺寸接着加点 */
function startTool(t,ed,place){
  if(RO) return;                                         // 只读：不做东西
  if(tool&&tool.btn===t&&!ed){endTool();return}
  /* 去做新的：不选着画上去的那个了，勾着的也都去掉。接着做已有的那一条（重新放置、继续加点）：还选着它，
     做完它的设置又回来 */
  if(SEL.size||(!ed&&sel>=0&&A[sel]&&!isNote(A[sel]))){SEL.clear();if(!ed)sel=-1;renderList()}
  const dm=t==='dim1'||t==='dimc';
  tool={type:dm?'dim':t,btn:t,pts:[],keep:0,guide:[],gLock:-1,gS:-1,gBtn:false};
  if(dm){
    /* stage：pts 取点 / place 放尺寸线。lock：锁在哪根轴（-1 不锁）；sLock：按着 Shift 时锁的那根；
       neg：触屏上输入长度时朝轴的反方向；plane：放尺寸线时指定贴哪个面（-1 按视角） */
    Object.assign(tool,{chain:t==='dimc',show:t==='dimc'?chainShow:'r',stage:'pts',dir:null,lock:-1,sLock:-1,
      neg:false,plane:-1,pj:-1,pm:null,color:(lastLike({type:'dim',chain:t==='dimc'})||{}).color||COLORS[DEFCOL.dim],off:0,ov:null});
    const g=ed&&dimGeo(ed,false);
    if(g) Object.assign(tool,{edit:ed.id,pts:ed.pts.map(q=>({pn:q.pn,p:q.p.slice()})),keep:ed.pts.length,
      dir:ed.dir||(ed.chain?dirL(PIDX.get(ed.pts[0].pn),g.u):null),show:ed.show,color:effColor(ed),off:ed.off,ov:ed.ov,
      stage:place?'place':'pts',replace:!!place});
  }
  /* 焦点别留在刚点的按钮上：不然取点时按回车会再按一次那个按钮 */
  const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur();
  hover=null;showInfo(null);cv.style.cursor='crosshair';
  /* 手机上把侧栏收起来，把模型让出来（底下的清单做东西时自己让开，见 hud） */
  toolBtns();if(NARROW.matches){document.body.classList.remove('side-open');tog.setAttribute('aria-expanded','false')}
  hud();renderEd();undoBtns();draw(false);
}
function endTool(){tool=null;hover=null;cv.style.cursor='';toolBtns();hud();renderEd();undoBtns();draw(false)}
/* 这根木料上标的圆洞：两个口的圆心也能吸。q 圆心，na / s 这个口开在哪根轴的哪一头
   （朝着镜头的那个口才吸） */
function holeCtrs(p){const r=[];
  A.forEach(an=>{if(an.type!=='hole'||an.g.sh!=='c'||PIDX.get(an.pn)!==p.pi||an.mi!==p.mi||effHidden(an)) return;
    const b=an.box, na=an.g.na;
    [[b[na],-1],[b[na+3],1]].forEach(w=>{const q=[(b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2];
      q[na]=w[0];r.push({q,na,s:w[1]})})});
  return r}
/* 屏幕上这一点吸到模型的哪里（什么都没挨着就是 null）；ref 是上一个点，找垂足用。
   鼠标周围一小圈里露出来的木料都算：各自最该吸的点里再挑一个；一个都没有，就是鼠标
   正下方那根木料表面上的点。 */
function snapAt(cx,cy,touch,ref){
  const thr=touch?18:10, nb={r:thr}, p=pickPiece(cx,cy,nb);
  const rp=ref?PIDX.get(ref.pn):null, rw=rp!=null?L2W0(rp,ref.p):null;
  let best=null, bq=null;
  nb.ids.forEach(id=>{const q=pieces[id-1]; if(!q) return;
    const c=snapOn(q,cx,cy,thr,rw?W2L0(q.pi,rw):null,holeCtrs(q),q===p?null:(x,y)=>nb.shows(id,x,y));
    if(c&&better(c,best)){best=c;bq=q}});
  if(best) return {pi:bq.pi,pn:D.panels[bq.pi].n,p:r3(best.q),kind:best.kind};
  return p?{pi:p.pi,pn:D.panels[p.pi].n,p:r3(rawHit(p,cx,cy).raw),kind:'f'}:null;
}
/* 从世界点 o 出发的模型三根轴：near = 鼠标在屏幕上挨着哪根（没有就 -1），best = 从 o 到鼠标的
   方向最像哪根。几乎正对着镜头的那根轴在屏幕上缩成一个点，不参加 */
function axesAt(cx,cy,o,thr){
  const a=w2s(o), rx=cx-a[0], ry=cy-a[1], R=Math.hypot(rx,ry),
        ppm=cv.clientHeight/(2*dist*Math.tan(0.36));
  let near=-1, nd=thr, best=-1, bs=1e9;
  if(a[2]>0&&R>1) for(let k=0;k<3;k++){
    const u=AX[k], b=w2s([o[0]+u[0]*1000,o[1]+u[1]*1000,o[2]+u[2]*1000]); if(b[2]<=0) continue;
    const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy); if(L<150*ppm) continue;
    const dd=Math.abs(rx*dy-ry*dx)/L;                 // 鼠标到这根轴线的距离
    if(dd<nd&&R>14){nd=dd;near=k}
    if(dd/R<bs){bs=dd/R;best=k}
  }
  return {near,best};
}
/* 直线 A + u·t 上离射线 (o,d) 最近的那一点的 t */
function lineT(A,u,o,d){const w=V.sub(A,o), b=V.dot(u,d), c=V.dot(d,d), den=V.dot(u,u)*c-b*b;
  return Math.abs(den)<1e-9?0:(b*V.dot(d,w)-c*V.dot(u,w))/den}
/* 取尺寸的点：屏幕上这一下算哪个点、顺着哪个方向量、量出来多少（没有方向可言就是 null）。
   pt 测点（没点中木料时没有，free 为真 —— 这一下只能拿来指方向、看长度，要收下它得输入长度）；
   k 方向是模型的哪根轴（-1 = 不是轴）；dir 这个方向在第一个点那块板里的写法（null = 两点直线）；
   uv 从第一个点指过去的方向；t 顺着方向线走了多远（带正负）、val 它的大小；
   end 这一段的另一头、w 鼠标指着的那一点（都带爆炸位移，画预览用） */
function resolvePt(cx,cy,touch){
  const n=tool.pts.length, p0=tool.pts[0];
  const s=snapAt(cx,cy,touch,(n===1&&!tool.dir)?p0:null);
  if(!n) return s?{pt:{pn:s.pn,p:s.p},s,k:-1,dir:null,lock:false,w:L2W(s.pi,s.p)}:null;
  const pi0=PIDX.get(p0.pn), a0=L2W0(pi0,p0.p), a=L2W(pi0,p0.p), r={s,k:-1,dir:null,lock:false};
  const d=s?V.sub(L2W0(s.pi,s.p),a0):null;                    // 第一个点到测点（没爆炸的位置）
  if(tool.dir){r.dir=tool.dir;r.k=axW(pi0,tool.dir)}
  else{
    const ax=axesAt(cx,cy,a,touch?16:9);
    let k=tool.lock;
    if(k<0&&shiftOn){if(tool.sLock<0)tool.sLock=ax.near>=0?ax.near:ax.best;k=tool.sLock}
    if(!shiftOn)tool.sLock=-1;
    r.lock=k>=0;
    if(k<0){
      /* 没锁：这个点正好在某根轴上就认出来；只是落在边线、面上（不是顶点这类确定的点）或者
         空白处，鼠标又挨着一根轴，就顺着那根轴 */
      if(s) k=[0,1,2].findIndex(j=>Math.abs(d[j])>.05&&Math.hypot(d[(j+1)%3],d[(j+2)%3])<.5);
      if(k<0&&(!s||s.kind==='e'||s.kind==='f')) k=ax.near;
    }
    r.k=k;r.dir=k>=0?dirL(pi0,AX[k]):null;
  }
  const u=r.dir?dirW(pi0,r.dir):(d?V.norm(d):null);
  if(!u) return null;
  if(s){const b=L2W(s.pi,s.p);
    r.pt={pn:s.pn,p:s.p};r.w=b;
    if(r.dir){r.t=V.dot(d,u);const te=V.dot(V.sub(b,a),u);r.end=[a[0]+u[0]*te,a[1]+u[1]*te,a[2]+u[2]*te]}
    else{r.t=Math.hypot(d[0],d[1],d[2]);r.end=b}
  }else{const ray=rayAt(cx,cy);
    r.free=true;r.t=lineT(a,u,ray.o,ray.d);
    r.end=r.w=[a[0]+u[0]*r.t,a[1]+u[1]*r.t,a[2]+u[2]*r.t]}
  r.val=Math.abs(r.t);r.uv=r.t<0?[-u[0],-u[1],-u[2]]:u;
  return r;
}
/* ----- 放尺寸线 ----- */
/* 量的方向 u 和拉出的方向 v 张成的面叫什么 */
function planeName(u,v){const n=V.norm(V.cross(u,v)), k=[0,1,2].findIndex(j=>Math.abs(n[j])>.9995);
  return k>=0?['YZ 面','XZ 面','XY 面'][k]:Math.abs(n[2])<.02?'竖直面':'斜面'}
/* 尺寸线能往哪几个方向拉：模型的三根轴里不顺着尺寸线的（去掉顺着的那一份，方向一样的并掉）。
   u 量的方向，A 第一个点现在的位置 */
function placeCands(){
  const g=dimGeo({pts:tool.pts,dir:tool.dir},true), u=g.u, cand=[];
  for(const k of [2,0,1]){const c=u[k], v=[-u[0]*c,-u[1]*c,-u[2]*c]; v[k]+=1;
    const L=Math.hypot(v[0],v[1],v[2]); if(L<.3) continue;
    const w=[v[0]/L,v[1]/L,v[2]/L]; if(cand.some(x=>Math.abs(V.dot(x.v,w))>.999)) continue;
    cand.push({v:w,name:planeName(u,w)})}

}
/* 光标往哪边走，尺寸线就贴哪个面：最近这一小段移动在屏幕上最像哪根轴拉出去的方向，就吸到那个面
   （要明显更像才换，不然在两个面之间来回跳）。pj 现在吸的是第几个面，pm 上次记下的光标位置 */
function placeTrack(x,y){
  const m=tool.pm; if(!m){tool.pm={x,y};return}
  const dx=x-m.x, dy=y-m.y, L=Math.hypot(dx,dy); if(L<16) return;
  const pc=placeCands(), a=w2s(pc.A), ppm=cv.clientHeight/(2*dist*Math.tan(0.36)); let best=-1, bs=.5, cur=9;
  pc.cand.forEach((c,j)=>{const b=w2s([pc.A[0]+c.v[0]*300,pc.A[1]+c.v[1]*300,pc.A[2]+c.v[2]*300]),
      wx=b[0]-a[0], wy=b[1]-a[1], wl=Math.hypot(wx,wy);
    if(a[2]<=0||b[2]<=0||wl<45*ppm) return;               // 这个方向几乎正对着屏幕，光标表达不了
    const sn=Math.abs(dx*wy-dy*wx)/(L*wl);                // 走的方向和它差多少（夹角的正弦）

/* 鼠标在屏幕上 (cx,cy)：尺寸线拉到哪。每个能拉的方向和量的方向张成一个面，鼠标的视线打在面上

   返回 v 拉出的方向、off 拉出多远（毫米，带正负）、name 面的名字 */
function placeAt(cx,cy){
  const pc=placeCands(), ray=rayAt(cx,cy), n=pc.cand.length;
  const res=pc.cand.map((c,j)=>{const nr=V.cross(pc.u,c.v), den=V.dot(nr,ray.d);
    if(Math.abs(den)<.08) return null;                    // 这个面几乎侧对着屏幕，放不了
    const t=V.dot(nr,V.sub(pc.A,ray.o))/den;
    return {j,v:c.v,name:c.name,den:Math.abs(den),
      off:V.dot([ray.o[0]+ray.d[0]*t-pc.A[0],ray.o[1]+ray.d[1]*t-pc.A[1],ray.o[2]+ray.d[2]*t-pc.A[2]],c.v)}});
  const want=tool.plane>=0&&tool.plane<n?tool.plane:(tool.pj>=0&&tool.pj<n?tool.pj:-1);
  let best=want>=0?res[want]:null;
  if(!best) res.forEach(r=>{if(r&&(!best||r.den>best.den)) best=r});
  if(!best) return null;
  /* 鼠标离量的那条线不到 6 个像素：就放在线上，不拉出 */

}
/* 鼠标不在画面上时预览用：指定的 / 吸到的那个面，都没有就是最正对着屏幕的，不拉出 */
function placeDefault(){
  const pc=placeCands(), rc=cv.getBoundingClientRect(), d=rayAt(rc.left+rc.width/2,rc.top+rc.height/2).d;
  const want=tool.plane>=0?tool.plane:tool.pj; let best=null;
  pc.cand.forEach((c,j)=>{const den=want===j?9:Math.abs(V.dot(V.cross(pc.u,c.v),d));
    if(!best||den>best.den) best={j,v:c.v,name:c.name,off:0,den}});
  return best;
}
function enterPlace(){tool.guide=[];tool.stage='place';tool.plane=-1;tool.pj=-1;tool.pm=null;hover=null;hud();undoBtns();if(hovXY)hoverNow();else draw(false)}

  endTool();

    Object.assign(A[i],{pts:t.pts,dir:t.dir,show:t.show,ov,off,flip:false});sel=i;changed(true)}     // 改完还选着它（右下角它的设置又回来）

/* ----- 开槽：照单次测量的路数，点一下定起点，移动鼠标定长度（或者输入长度） ----- */
/* 起点是空间里的一个点，不认死在点中的那根木料上：起点挨着几根木料时（立柱的脚踩在底板上，起点
   吸在立柱脚的棱上，那也是底板顶面上的点），往哪根的方向拉，槽就开在哪根上。用户的话：「我其实是
   想顺着水平的木料去切，但是没有办法把方向调过去」—— 早先点中哪根就只能开哪根，方向也只有那个面
   里的两根轴。
   tool.cut：p / na / ns 点中的那根木料和那个面，p1 起点（p 那块板的局部坐标，吸附过的），raw 点下去
   时鼠标正指着的那一点（没吸附的，判方向用）；
   cands 起点挨着的木料（cd：p 木料、b 它的外形、l 起点在它那块板里的坐标）；
   axes 这些木料的轴在模型里的方向（去掉重复的，一般就是三根）；
   opts 每根木料的每根轴：cd、k 它的第几根轴、ai 是 axes 里的第几根、o 同向还是反向、long 是不是
   这根木料的长向；
   lock 方向锁在 axes 的第几根（-1 = 不锁，跟着光标）、sLock 按着 Shift 时锁的那根、ax 上一回判出来的
   那根、face 上一回开在哪根木料的哪个面。 */
function cutInit(c){
  const pi=c.p.pi, W0=L2W0(pi,c.p1); c.cands=[]; c.axes=[]; c.opts=[];
  pieces.forEach(q=>{ if(q!==c.p&&!(showLv.has(q.lv)&&showKd.has(q.ki))) return;      // 藏起来的木料不算
    const l=q.pi===pi?c.p1.slice():W2L0(q.pi,W0), b=boxOf(q);
    for(let k=0;k<3;k++) if(l[k]<b.lo[k]-.5||l[k]>b.hi[k]+.5) return;
    c.cands.push({p:q,b,l:l.map((x,k)=>Math.max(b.lo[k],Math.min(b.hi[k],x)))})});
  if(!c.cands.some(d=>d.p===c.p)){const b=boxOf(c.p);
    c.cands.push({p:c.p,b,l:c.p1.map((x,k)=>Math.max(b.lo[k],Math.min(b.hi[k],x)))})}
  c.cands.forEach(cd=>{const e=[0,1,2].map(k=>cd.b.hi[k]-cd.b.lo[k]), em=Math.max(e[0],e[1],e[2]);
    for(let k=0;k<3;k++){ if(e[k]<1) continue; const u=dirW(cd.p.pi,AX[k]);
      let ai=c.axes.findIndex(v=>Math.abs(V.dot(u,v))>.9995); if(ai<0){ai=c.axes.length;c.axes.push(u)}
      c.opts.push({cd,k,ai,o:V.dot(u,c.axes[ai])<0?-1:1,long:e[k]>=em-.5}) }});
  if(!(c.lock>=0))c.lock=-1; if(!(c.sLock>=0))c.sLock=-1; if(!(c.ax>=0))c.ax=-1;

/* 往 axes 的第 ai 根、s 那一头（±1）开，能开在哪 —— 排好了序：顺着那根木料长向的 > 就是点中的那根 >
   那一头剩得多的。每一条：cd 哪根木料、k 它的哪根轴、sl 朝它的哪一头、room 那一头还剩多少、faces
   起点落在它的哪几个面上（槽只能从起点所在的面开进去；开的方向不能就是面的法线） */
function cutOpts(c,ai,s){
  const r=[];
  c.opts.forEach(o=>{ if(o.ai!==ai) return; const cd=o.cd, k=o.k, sl=s*o.o,
      room=sl>0?cd.b.hi[k]-cd.l[k]:cd.l[k]-cd.b.lo[k]; if(room<1) return;
    const faces=[]; for(let n=0;n<3;n++){ if(n===k) continue;
      if(Math.abs(cd.l[n]-cd.b.hi[n])<.5) faces.push({na:n,ns:1}); else if(Math.abs(cd.l[n]-cd.b.lo[n])<.5) faces.push({na:n,ns:-1}) }
    if(faces.length) r.push({cd,k,sl,room,long:o.long,faces}) });

  return r.sort((x,y)=>rk(x)-rk(y)||y.room-x.room);

/* 这些轴里哪几根开得了（不管朝哪头）、各叫什么：照模型的 X / Y / Z 叫，和量尺寸时锁方向的按钮一样 */
function cutAxNames(c){
  const r=[];
  c.axes.forEach((u,ai)=>{ if(![1,-1].some(s=>cutOpts(c,ai,s).length)) return;
    const j=[0,1,2].reduce((m,k)=>Math.abs(u[k])>Math.abs(u[m])?k:m,0);
    r.push({ai,j,name:AXL[j]+(r.some(x=>x.j===j)?'′':'')})});
  return r.sort((x,y)=>x.j-y.j);
}
/* 开在这根木料的哪个面。起点只落在它一个面上：就是那个面。落在两个面的公共棱上：
   · 这根就是点中的那根、其中一个就是点中的那个面 —— 照点中的；
   · 只有一个朝着镜头 —— 看得见的那个；
   · 两个都看得见 —— 鼠标偏在棱的哪一边，就是那一边的面（偏不到 6 个像素不换）；还没偏，取更正对着
     屏幕的那个。

  const rc=cv.getBoundingClientRect(), A0=L2W(c.p.pi,c.p1), a=w2s(A0), d=rayAt(a[0]+rc.left,a[1]+rc.top).d,
        fc=F.map(f=>-f.ns*V.dot(dirW(pj,AX[f.na]),d)), vis=F.filter((f,i)=>fc[i]>1e-3), def=F[fc[1]>fc[0]?1:0];

   朝哪根轴：和量尺寸时吸轴一个路数，在屏幕上判 —— 鼠标从点下去的地方出发，更挨着哪根轴的线，就是

/* ---------- 撤销 / 重做 ---------- */
/* 每改一次，把改之前的整份标注压进撤销栈（最多 100 步）。附件的内容不复制，只记着是
   哪几个 —— 一张照片几百 KB，每步都抄一份吃不消。同一处连着改（打字、连点数字框）
   1.2 秒之内并成一步。取尺寸点到一半时，撤销先退掉刚点的那个点。
   撤销栈只在这次打开页面期间有效，刷新就没了（标注本身还在草稿里）。 */
const UN=[], RE=[]; let LAST={items:[],groups:[],views:[],dh:false,df:false}, lastKey='', lastT=0;

  const now=Date.now();

function sameAn(a,b){return a.media.length===b.media.length&&a.media.every((m,k)=>m===b.media[k])&&

  const ae=document.activeElement, bx=ae&&ae.closest?ae.closest('.anE'):null,
        fi=bx?Array.from(bx.querySelectorAll('textarea,input')).indexOf(ae):-1;
  A=s.items.map(cloneAn);G=cloneJ(s.groups||[]);doneHidden=!!s.dh;doneFold=!!s.df;

function tname(an){return an.type==='dim'&&an.chain?'连续尺寸':TYPES[an.type]}

  if(!placed(an)) return '';
  if(an.type==='dim'){const s=Array.from(new Set(an.pts.map(q=>q.pn)));
    return s.length>2?s[0]+' 等 '+s.length+' 块板':s.join(' → ')}
  const p=pieceOf(an), nm=q=>D.kinds[q.ki]+(q.lab?' '+q.lab:''), s=an.pn+(p?' · '+nm(p):'');
  /* 跨了木料的槽：后面接着写开到了哪几根（别的板上的带板号）；多了就只写一共几根 */
  const more=cutParts(an).slice(1);
  if(!more.length) return s;
  return more.length>2?s+' 等 '+(more.length+1)+' 根木料'
    :s+more.map(x=>' → '+(x.p.pi===p.pi?'':D.panels[x.p.pi].n+' · ')+nm(x.p)).join('');

  if(an.type==='hole') return (g.sh==='c'?'Ø'+fmt(g.d):fmt(g.L)+' × '+fmt(g.W))+' · '+AXN[g.ax]+' '+fmt(g.pos);
  if(an.type==='dim'){const q=dimGeo(an,false); if(!q) return '原来那块板找不到了';
    const k=axW(PIDX.get(an.pts[0].pn),an.dir), d=k>=0?' · '+AXL[k]+' 向':an.dir?' · 斜向':'';
    return (an.chain?an.pts.length+' 个点，总长 ':'')+fmtD(q.len)+' mm'+d}
  return '';
